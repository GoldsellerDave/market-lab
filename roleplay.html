<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Role-play stations</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎭</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700;800&family=Source+Sans+3:wght@400;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root {
  --cocoa: #3a2217;
  --cocoa-2: #5b3826;
  --ink: #23170f;
  --muted: #6d6158;
  --paper: #f3f4f7;
  --panel: #ffffff;
  --line: #dcd8de;
  --foil: #d8a21f;
  --foil-2: #f2cf6b;
  --buyer: #12648c;
  --buyer-soft: #e2eff6;
  --seller: #b02a3f;
  --seller-soft: #f8e5e8;
  --mint: #22805a;
  --mint-soft: #e1f2e9;
  --warn: #9a5b00;
  --warn-soft: #fbf0dc;
  --shadow: 0 1px 2px rgba(35, 23, 15, .08), 0 6px 18px rgba(35, 23, 15, .06);
  --r-sm: 8px;
  --r-md: 14px;
  --buyer-card: #12648c;
  --seller-card: #b02a3f;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --font-display: "Bricolage Grotesque", "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #f3ebe4; --muted: #b8aca2; --paper: #17120f; --panel: #221b16; --line: #3c322b;
    --buyer: #5fb3dc; --buyer-soft: #16303d; --seller: #ec7a8c; --seller-soft: #3d1c22;
    --mint: #5cc79a; --mint-soft: #16332a; --warn: #f0b85a; --warn-soft: #3a2c12;
    --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #f3ebe4; --muted: #b8aca2; --paper: #17120f; --panel: #221b16; --line: #3c322b;
  --buyer: #5fb3dc; --buyer-soft: #16303d; --seller: #ec7a8c; --seller-soft: #3d1c22;
  --mint: #5cc79a; --mint-soft: #16332a; --warn: #f0b85a; --warn-soft: #3a2c12;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  margin: 0; min-height: 100%; background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; margin: 0 0 .4em; letter-spacing: -.01em; }
h1 { font-size: clamp(1.6rem, 4vw, 2.3rem); font-weight: 800; }
h2 { font-size: 1.3rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0 0 .8em; max-width: 68ch; }
small, .muted { color: var(--muted); }
a { color: var(--buyer); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--foil); outline-offset: 2px; }

.wrap { max-width: 1180px; margin: 0 auto; padding: 16px; }
.narrow { max-width: 520px; margin: 0 auto; padding: 16px; }

.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--cocoa); color: #fbf3ea;
}
.topbar .brand { font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; }
.topbar .spacer { flex: 1; }
.topbar .chip { background: rgba(255,255,255,.12); color: #fbf3ea; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px; box-shadow: var(--shadow); }
.panel + .panel { margin-top: 14px; }
.stack > * + * { margin-top: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }

.btn {
  appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 999px; padding: 10px 18px; font-weight: 700; cursor: pointer; min-height: 44px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
}
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--cocoa); border-color: var(--cocoa); color: #fbf3ea; }
:root[data-theme="dark"] .btn.primary { background: var(--foil); border-color: var(--foil); color: #23170f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { background: var(--foil); border-color: var(--foil); color: #23170f; } }
.btn.buyer { background: var(--buyer-card); border-color: var(--buyer-card); color: #fff; }
.btn.seller { background: var(--seller-card); border-color: var(--seller-card); color: #fff; }
.btn.small { min-height: 34px; padding: 5px 12px; font-size: .9rem; }
.btn.block { width: 100%; }
.btn.ghost { background: transparent; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: .88rem; background: var(--paper); border: 1px solid var(--line); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; }
.dot.ok { background: var(--mint); } .dot.bad { background: var(--seller); } .dot.wait { background: var(--foil); }

label.field { display: block; font-weight: 700; margin-bottom: 4px; }
input[type=text], input[type=number], select, textarea {
  width: 100%; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; background: var(--panel); min-height: 44px;
}
textarea { min-height: 120px; resize: vertical; line-height: 1.45; }
.code-input { font-family: var(--font-display); font-size: 1.6rem; letter-spacing: .25em; text-transform: uppercase; text-align: center; }

.note { padding: 10px 12px; border-radius: var(--r-sm); background: var(--warn-soft); color: var(--ink); border-left: 4px solid var(--warn); }
.good { padding: 10px 12px; border-radius: var(--r-sm); background: var(--mint-soft); border-left: 4px solid var(--mint); }
.bad { padding: 10px 12px; border-radius: var(--r-sm); background: var(--seller-soft); border-left: 4px solid var(--seller); }

/* Home */
.home-hero { padding: 40px 0 20px; }
.home-choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.choice { text-align: left; padding: 22px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--panel); cursor: pointer; box-shadow: var(--shadow); }
.choice h2 { margin-bottom: .2em; }

/* The chocolate bar card: the one bold element */
.bar {
  position: relative; border-radius: 16px; overflow: hidden; color: #fff; box-shadow: 0 10px 28px rgba(35,23,15,.25);
  background: var(--buyer-card);
}
.bar.seller { background: var(--seller-card); }
.bar .foil { height: 14px; background: linear-gradient(90deg, var(--foil), var(--foil-2), var(--foil), var(--foil-2)); }
.bar .body { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 16px 18px 18px; }
.bar .role { font-family: var(--font-display); font-size: 1.5rem; font-weight: 800; }
.bar .say { font-size: 1rem; opacity: .95; margin: 2px 0 0; }
.bar .slab {
  width: 112px; height: 112px; border-radius: 10px; display: grid; place-items: center;
  background:
    linear-gradient(var(--cocoa) 0 0) padding-box,
    var(--cocoa);
  background-image:
    linear-gradient(90deg, transparent 47%, rgba(0,0,0,.35) 47% 53%, transparent 53%),
    linear-gradient(0deg, transparent 47%, rgba(0,0,0,.35) 47% 53%, transparent 53%),
    linear-gradient(145deg, var(--cocoa-2), var(--cocoa));
  box-shadow: inset 0 2px 0 rgba(255,255,255,.12), inset 0 -3px 0 rgba(0,0,0,.25);
}
.bar .slab span { font-family: var(--font-display); font-size: 3.4rem; font-weight: 800; color: var(--foil-2); text-shadow: 0 2px 0 rgba(0,0,0,.4); line-height: 1; }
.bar .slab small { display: block; color: #f6e2b0; text-align: center; font-size: .78rem; margin-top: 2px; }

/* Market */
.quotes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.quote { border-radius: var(--r-sm); padding: 10px 12px; border: 1px solid var(--line); background: var(--panel); }
.quote .q-label { font-size: .88rem; color: var(--muted); }
.quote .q-val { font-family: var(--font-display); font-size: 1.8rem; font-weight: 800; }
.quote.bid .q-val { color: var(--buyer); } .quote.ask .q-val { color: var(--seller); }
.stepper { display: grid; grid-template-columns: 56px 1fr 56px; align-items: center; gap: 8px; }
.stepper button { min-height: 56px; border-radius: 12px; font-size: 1.6rem; font-weight: 800; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
.stepper .val { text-align: center; font-family: var(--font-display); font-size: 2.4rem; font-weight: 800; }
.tape { display: flex; flex-wrap: wrap; gap: 6px; }
.tape .chip { font-weight: 700; }
.timer { font-family: var(--font-display); font-weight: 800; font-variant-numeric: tabular-nums; }
.big-timer { font-size: 2.2rem; }

/* Tables */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: right; }
th:first-child, td:first-child { text-align: left; }
th { font-weight: 700; color: var(--muted); font-size: .9rem; }
tr.eq td { background: var(--mint-soft); font-weight: 700; }

/* Teacher stepper */
ol.steps { list-style: none; padding: 0; margin: 0; counter-reset: s; }
ol.steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); }
ol.steps li::before { content: counter(s); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: .9rem; background: var(--paper); border: 1px solid var(--line); }
ol.steps li.done::before { content: "✓"; background: var(--mint); border-color: var(--mint); color: #fff; }
ol.steps li.now::before { background: var(--foil); border-color: var(--foil); color: #23170f; }
ol.steps li .btn { justify-self: start; }

.roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.roster .who { padding: 6px 8px; border-radius: var(--r-sm); border: 1px solid var(--line); font-size: .9rem; display: flex; justify-content: space-between; gap: 6px; }
.roster .who.buyer { border-left: 4px solid var(--buyer); } .roster .who.seller { border-left: 4px solid var(--seller); }
.roster .who.done { background: var(--mint-soft); }

.chart-box { position: relative; width: 100%; aspect-ratio: 16 / 9; min-height: 220px; }
.chart-box canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

/* Projector overlay */
.projector { position: fixed; inset: 0; z-index: 50; background: var(--paper); display: grid; grid-template-columns: 1fr 340px; gap: 20px; padding: calc(16px + env(safe-area-inset-top, 0px)) 20px calc(16px + env(safe-area-inset-bottom, 0px)); }
.projector .chart-box { aspect-ratio: auto; height: 100%; }
.projector .side { display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
.projector .code { font-family: var(--font-display); font-size: 3.4rem; font-weight: 800; letter-spacing: .12em; line-height: 1; }
@media (max-width: 900px) { .projector { grid-template-columns: 1fr; grid-template-rows: 1fr auto; } }

.envelope { border-radius: var(--r-md); padding: 18px; background: var(--cocoa); color: #fbf3ea; text-align: center; }
.envelope .seal { width: 54px; height: 54px; border-radius: 50%; background: var(--foil); margin: 0 auto 8px; display: grid; place-items: center; font-weight: 800; color: #23170f; }
.envelope.open { animation: openup .9s cubic-bezier(.2,.8,.2,1); }
.envelope .pred { font-family: var(--font-display); font-size: 2.2rem; font-weight: 800; color: var(--foil-2); }
@keyframes openup { 0% { transform: rotateX(70deg) scale(.9); opacity: 0; } 100% { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .envelope.open { animation: none; } }

.qr { background: #fff; padding: 8px; border-radius: 8px; width: max-content; }
.qr img, .qr canvas { display: block; }

/* Tasks */
.tier { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; margin: 18px 0 8px; display: flex; align-items: center; gap: 8px; }
.tier .chip { font-family: var(--font-body); font-weight: 400; }
.task { border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px; background: var(--panel); }
.task + .task { margin-top: 10px; }
.task.solved { border-color: var(--mint); }
.task .ref { font-size: .82rem; color: var(--muted); }
.opts { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.opt { min-width: 48px; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font-weight: 700; cursor: pointer; padding: 6px 12px; }
.opt.sel { border-color: var(--cocoa); background: var(--cocoa); color: #fbf3ea; }
.frames { font-size: .95rem; color: var(--muted); margin: 6px 0; padding-left: 18px; }
.plot svg { width: 100%; max-width: 420px; height: auto; touch-action: manipulation; user-select: none; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 8px 14px; font-weight: 700; cursor: pointer; min-height: 40px; }
.seg button.on.d { background: var(--buyer); color: #fff; } .seg button.on.s { background: var(--seller); color: #fff; }

/* Glossary */
.term { border: 0; background: none; padding: 0; font: inherit; color: inherit; text-decoration: underline dotted 2px; text-underline-offset: 3px; cursor: help; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 80; background: var(--panel); border-top: 3px solid var(--foil); padding: 16px 18px calc(18px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -8px 24px rgba(0,0,0,.18); max-width: 640px; margin: 0 auto; border-radius: 16px 16px 0 0; }
.sheet .vi { color: var(--muted); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 90; background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font-weight: 700; max-width: 92vw; text-align: center; }

.poll-bar { height: 12px; border-radius: 6px; background: var(--paper); border: 1px solid var(--line); overflow: hidden; }
.poll-bar > i { display: block; height: 100%; background: var(--foil); }

details summary { cursor: pointer; font-weight: 700; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }
.hidden { display: none !important; }
.topbar .btn.primary { background: var(--foil); border-color: var(--foil); color: #23170f; }
.dot.ok, .dot.bad, .dot.wait { padding: 0; border: 0; border-radius: 50%; width: 9px; height: 9px; }
.dot.bad { background: var(--seller); }

/* ===== Level 0 additions ===== */
.fx { position: fixed; inset: 0; pointer-events: none; z-index: 95; width: 100vw; height: 100vh; }
.lead { font-size: 1.15rem; }
.code-big { font-family: var(--font-display); font-size: 2rem; font-weight: 800; letter-spacing: .12em; line-height: 1.1; }
.art-join { width: 90px; }
.art-join svg, .art svg, .art-big svg { width: 100%; height: auto; display: block; }
kbd { font-family: var(--font-body); font-size: .72em; font-weight: 700; padding: 1px 6px; border-radius: 5px; border: 1px solid currentColor; opacity: .6; margin-left: 4px; }
@media (hover: none) { kbd { display: none; } }

/* student two-column layout for tablets and laptops */
.sgrid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .sgrid { grid-template-columns: 1fr; } }
.ask-mini { position: relative; }
.ask-mini .art { width: 92px; float: right; margin: 0 0 6px 12px; }
.ask-mini.demand { border-top: 6px solid var(--buyer-card); }
.ask-mini.supply { border-top: 6px solid var(--seller-card); }
.yn { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; clear: both; }
.yn .btn { min-height: 72px; font-size: 1.5rem; border-radius: 16px; border-width: 2px; }
.yn .btn.yes.sel { background: var(--mint); border-color: var(--mint); color: #fff; }
.yn .btn.no.sel { background: var(--seller-card); border-color: var(--seller-card); color: #fff; }
.opt.big { min-height: 60px; font-size: 1.15rem; padding: 8px 20px; }
tr.cur td { background: var(--warn-soft); font-weight: 700; }

.bdg { font-size: 1.6rem; line-height: 1; display: inline-block; }
.bdg.off { filter: grayscale(1); opacity: .3; }
.bdg.big { font-size: 2.6rem; }
.badgewall { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.bw { border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; background: var(--panel); }
.bw.locked { opacity: .45; filter: grayscale(1); }
.meter { height: 16px; border-radius: 8px; background: var(--paper); border: 1px solid var(--line); overflow: hidden; margin-top: 4px; }
.meter > i { display: block; height: 100%; background: linear-gradient(90deg, var(--foil), var(--foil-2)); transition: width .6s ease; }
.feed-item { padding: 4px 0; border-bottom: 1px dashed var(--line); }

/* robot deals */
.chat { max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px; }
.msg { max-width: 82%; padding: 8px 12px; border-radius: 14px; background: var(--paper); border: 1px solid var(--line); }
.msg .who { display: block; font-size: .78rem; color: var(--muted); font-weight: 700; }
.msg.y { align-self: flex-end; background: var(--buyer-soft); }
.dline { width: 100%; max-width: 460px; height: auto; display: block; margin: 4px 0; }

/* projector, Level 0 */
.projector.l0 { grid-template-columns: 1fr 320px; }
.pmain { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.news { display: flex; align-items: center; gap: 14px; background: var(--cocoa); color: #fbf3ea; border-radius: var(--r-md); padding: 12px 16px; font-size: clamp(1.05rem, 1.6vw, 1.4rem); }
.news .flag { background: var(--foil); color: #23170f; font-weight: 800; padding: 4px 10px; border-radius: 6px; white-space: nowrap; font-family: var(--font-display); }
.news.slide { animation: slidein .6s cubic-bezier(.2,.8,.2,1); }
@keyframes slidein { from { transform: translateY(-30px); opacity: 0; } to { transform: none; opacity: 1; } }
.pstage { flex: 1; min-height: 0; display: flex; }
.pstage > * { flex: 1; min-height: 0; }
.lobby-stage { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; }
.lobby-stage h1 { font-size: clamp(2rem, 4vw, 3.4rem); }
.art-big { width: clamp(120px, 14vw, 200px); }
.bubbles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 900px; }
.bubble { padding: 6px 14px; border-radius: 999px; background: var(--panel); border: 2px solid var(--foil); font-weight: 700; animation: pop .4s ease; }
.ask-stage { display: grid; grid-template-columns: minmax(260px, 34%) 1fr; gap: 18px; min-height: 0; }
.ask-stage.wide { grid-template-columns: 1fr minmax(240px, 30%); }
.ask-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); padding: 18px; display: flex; flex-direction: column; gap: 10px; overflow: auto; }
.ask-card.demand { border-top: 8px solid var(--buyer-card); } .ask-card.supply { border-top: 8px solid var(--seller-card); }
.ask-card .art { width: 46%; max-width: 170px; align-self: center; }
.ask-card h2 { font-size: clamp(1.3rem, 2.2vw, 2rem); }
.ask-card .story { font-size: 1.05rem; margin: 0; }
.pricetag { align-self: center; font-family: var(--font-display); font-weight: 800; font-size: clamp(2.2rem, 4.5vw, 3.8rem); background: var(--foil); color: #23170f; padding: 4px 22px; border-radius: 14px; transform: rotate(-3deg); box-shadow: 0 6px 0 rgba(0,0,0,.18); }
.yescount { display: flex; align-items: baseline; gap: 10px; justify-content: center; }
.yescount span { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.4rem, 5vw, 4.4rem); line-height: 1; }
.yescount.pop span { animation: pop .35s ease; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
.chart-box.tall { aspect-ratio: auto; height: 100%; min-height: 300px; }
.chart-box.mid { aspect-ratio: 16 / 7; }
.meet-text { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px; overflow: auto; }
.selfpace, .finish { display: flex; flex-direction: column; gap: 12px; overflow: auto; }

/* ===== Role-play stations ===== */
:root {
  --rp-dark: #1B2340; --rp-primary: #0E6B6B; --rp-accent: #FCE3A6; --rp-soft: #EEF4F4;
  --cocoa: var(--rp-dark); --cocoa-2: var(--rp-primary); --foil: var(--rp-accent); --paper: var(--rp-soft);
  --rp-good: #1f7a4d; --rp-good-soft: #e3f3ea; --rp-bad: #b3261e; --rp-bad-soft: #fbe9e7;
  --font-display: "Lexend", "Segoe UI", system-ui, sans-serif; --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
}
body { font-size: 18px; }
h1, h2, h3 { color: var(--rp-dark); }
.btn.primary { background: var(--rp-primary); border-color: var(--rp-primary); color: #fff; }
.btn.big { font-size: 1.1rem; padding: 12px 22px; min-height: 52px; }
.btn.small { padding: 6px 12px; min-height: 36px; font-size: .92rem; }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .45; cursor: default; }
.rp-topbtn { color: #fff !important; border-color: rgba(255,255,255,.35) !important; }
.topbar { background: var(--rp-dark); color: #fff; }
.topbar .chip { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.2); color: #fff; }
.spacer { flex: 1; }
.dot.ok { background: #3ccf8e; } .dot.bad { background: #ff6b5e; } .dot.wait { background: #ccc; }
.field { display: block; font-weight: 700; margin-bottom: 4px; }
select, input[type=number], input[type=time], input:not([type]), textarea { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); max-width: 100%; }
textarea { width: 100%; box-sizing: border-box; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.muted { color: var(--muted); }
.rp-mini { margin: .3em 0 0; padding-left: 1.3em; }

/* setup */
.rp-setgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
@media (max-width: 900px) { .rp-setgrid { grid-template-columns: 1fr; } }
.rp-packinfo { display: flex; flex-direction: column; gap: 4px; background: var(--rp-soft); border-radius: 12px; padding: 10px 12px; font-size: .95rem; }
.rp-plan { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rp-plan label { display: flex; flex-direction: column; gap: 4px; font-weight: 700; font-size: .92rem; }
.rp-room { margin: 0; background: var(--rp-soft); padding: 8px 12px; border-radius: 10px; }
.rp-phtable { width: 100%; border-collapse: collapse; }
.rp-phtable td, .rp-phtable th { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: left; }
.rp-phtable input { width: 6em; }
.rp-fit { margin: 0; font-weight: 700; padding: 8px 12px; border-radius: 10px; }
.rp-fit.ok { background: var(--rp-good-soft); color: var(--rp-good); } .rp-fit.bad { background: var(--rp-bad-soft); color: var(--rp-bad); }
.rp-check1 { display: flex; gap: 8px; align-items: center; font-weight: 600; }

/* ===== console (projected) ===== */
body.rp-console { overflow: hidden; height: 100vh; display: flex; flex-direction: column; background: var(--rp-soft); }
.rp-top { font-size: 1.05rem; }
.rp-top .brand { font-family: var(--font-display); font-weight: 700; }
.rp-top .timer { font-size: 1.5rem; min-width: 3.2em; }
.timer.warn { color: var(--rp-accent); } .timer.over { color: #ff8a80; }
.rp-proj { font-size: .95rem; opacity: .95; } .rp-proj .rp-okc { color: #8ff0c4; } .rp-proj .rp-badc { color: #ffb4a9; }
.rp-stage { flex: 1; min-height: 0; overflow: auto; padding: clamp(14px, 2.2vw, 40px); display: flex; flex-direction: column; gap: clamp(12px, 2vh, 28px); }
.rp-kicker { font-family: var(--font-display); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--rp-primary); font-size: clamp(14px, 1.3vw, 22px); }
.rp-stage h1 { font-size: clamp(30px, 4vw, 72px); margin: .1em 0 .2em; }
.rp-ctl { display: flex; gap: 10px; align-items: center; padding: 10px 16px; background: #fff; border-top: 1px solid var(--line); flex-wrap: wrap; }
.rp-next { font-size: 1.15rem; }
.rp-next.pulse { animation: rpPulse 1.1s ease-in-out infinite; }
@keyframes rpPulse { 50% { box-shadow: 0 0 0 8px rgba(14,107,107,.25); } }
.rp-auto { display: flex; gap: 6px; align-items: center; font-weight: 600; }
.rp-lobby { display: grid; grid-template-columns: 1.3fr 1fr; gap: clamp(16px, 3vw, 48px); align-items: center; }
.rp-obj { font-size: clamp(18px, 1.7vw, 30px); line-height: 1.35; margin: 0; padding-left: 1.3em; }
.rp-obj li { margin: .25em 0; }
.rp-how { display: flex; gap: 10px; flex-wrap: wrap; list-style: none; padding: 0; margin: 1em 0 0; counter-reset: h; }
.rp-how li { counter-increment: h; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px 6px 6px; font-weight: 600; display: flex; gap: 8px; align-items: center; font-size: clamp(15px, 1.2vw, 22px); }
.rp-how li::before { content: counter(h); background: var(--rp-primary); color: #fff; width: 1.6em; height: 1.6em; border-radius: 50%; display: grid; place-items: center; font-weight: 700; }
.rp-how.big li { font-size: clamp(18px, 1.8vw, 32px); }
.rp-lob-r { display: flex; flex-direction: column; align-items: center; gap: 8px; background: #fff; border-radius: 22px; padding: clamp(12px, 1.6vw, 28px); box-shadow: var(--shadow); }
.rp-qr { background: #fff; padding: 8px; line-height: 0; } .rp-qr img, .rp-qr canvas { max-width: 100%; height: auto; }
.rp-code { font-family: var(--font-display); font-size: clamp(22px, 2.4vw, 44px); } .rp-code b { letter-spacing: .12em; color: var(--rp-primary); }
.rp-url { color: var(--muted); word-break: break-all; text-align: center; }
.rp-noqr { font-size: 1.2rem; padding: 20px; }
.rp-board { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.rp-team { background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.rp-team.ready { border-color: var(--rp-good); background: var(--rp-good-soft); }
.rp-team.done { opacity: .55; } .rp-team.live { border-color: var(--rp-accent); box-shadow: 0 0 0 4px var(--rp-accent); }
.rp-team-h { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--font-display); font-size: clamp(16px, 1.4vw, 24px); }
.rp-team-h span { font-size: .75em; color: var(--muted); }

/* Supabase counts every copy of a message: 1 when sent + 1 for each device that receives it (free plan: 100 a second).
   So there is one room channel for what everyone needs (the teacher's shared state), and one private channel
   ("pipe") per student, joined only by that student and the teacher: cards, marks and everything a student
   sends go there and cost 2, not 1 + the whole class. Sending is paced, and a newer state replaces one still waiting. */
const RT = { sent: 0, recv: 0, sec: {} }; // message counts (the tests read these)
const rtTick = () => { const k = Math.floor(Date.now() / 1000); RT.sec[k] = (RT.sec[k] || 0) + 1; };
const RT_BUDGET = { teacher: { rate: 35, burst: 10 }, student: { rate: 1.5, burst: 4 } }; // teacher: counted copies a second; student: messages a second
function makeTransport(kind, room, opt = {}) {
  const teacher = !!opt.teacher, me = opt.pid || null, online = kind === 'supabase', MAXPIPES = 90;
  const pipeName = pid => CHANNEL(room) + ':' + pid;
  const pipes = new Map(); // teacher: pid -> { ch, wait, dead }
  let client = null, roomCh = null, myPipe = null, pipeOk = false, onMsg = null, nextJoin = 0;
  async function open(name, onIn, onStatus) {
    if (!online) {
      const bc = new BroadcastChannel(name); bc.onmessage = e => onIn(e.data);
      onStatus && onStatus('SUBSCRIBED');
      return { send: m => bc.postMessage(m), close: () => bc.close() };
    }
    if (!client) { await loadSupabase(); client = client || window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey); }
    const c = client, ch = c.channel(name, { config: { broadcast: { self: false } } });
    ch.on('broadcast', { event: 'm' }, ({ payload }) => onIn(payload));
    await new Promise((res, rej) => ch.subscribe(status => {
      onStatus && onStatus(status);
      if (status === 'SUBSCRIBED') res();
      else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') rej(new Error('Could not connect to the online room (' + status + ').'));
    }));
    return { send: m => ch.send({ type: 'broadcast', event: 'm', payload: m }), close: () => c.removeChannel(ch) };
  }
  const inbound = via => m => {
    if (!m) return; RT.recv++; rtTick();
    if (teacher) { if (via === 'room' && typeof m.from === 'string' && /^p-/.test(m.from)) pipeFor(m.from); }
    else if (via === 'pipe' && m.from === 'teacher') pipeOk = true;
    onMsg && onMsg(m);
  };
  // teacher: join a student's pipe (joins are spaced out; Supabase allows 100 joins a second)
  function pipeFor(pid) {
    let p = pipes.get(pid); if (p) return p;
    if (pipes.size >= MAXPIPES) return null;
    p = { ch: null, wait: [], dead: false }; pipes.set(pid, p);
    const at = Math.max(Date.now(), nextJoin); nextJoin = at + 30;
    setTimeout(() => open(pipeName(pid), inbound('pipe')).then(ch => { p.ch = ch; }).catch(() => { p.dead = true; })
      .finally(() => { q.unshift(...p.wait.splice(0)); pump(); }), at - Date.now());
    return p;
  }
  // paced sending
  const B = RT_BUDGET[teacher ? 'teacher' : 'student'], q = [];
  let tokens = B.burst, last = Date.now(), timer = null;
  function pump() {
    clearTimeout(timer); timer = null;
    if (!roomCh) return;
    const now = Date.now(); tokens = Math.min(B.burst, tokens + (now - last) / 1000 * B.rate); last = now;
    while (q.length) {
      const it = q[0]; let ch = roomCh;
      if (teacher && it.to) { const p = pipeFor(it.to); if (p && !p.dead) { if (!p.ch) { q.shift(); p.wait.push(it); continue; } ch = p.ch; } }
      if (!teacher && pipeOk && myPipe) ch = myPipe;
      const cost = !teacher ? 1 : ch === roomCh ? 1 + Math.max(1, pipes.size) : 2, need = Math.min(cost, B.burst);
      if (tokens < need) { timer = setTimeout(pump, Math.max(15, (need - tokens) / B.rate * 1000)); return; }
      q.shift(); tokens -= cost; RT.sent++; rtTick();
      try { ch.send(it.m); } catch (e) { console.warn('Send failed', e); }
    }
  }
  function send(m) {
    if (teacher && m.type === 'state' && !m.to) { const old = q.find(it => !it.to && it.m.type === 'state'); if (old) { old.m = m; return; } }
    q.push({ m, to: teacher ? m.to || null : null }); pump();
  }
  return {
    kind,
    async connect(handler, onStatus) {
      onMsg = handler;
      const own = !teacher && me ? open(pipeName(me), inbound('pipe')).then(ch => { myPipe = ch; }).catch(() => null) : null;
      roomCh = await open(CHANNEL(room), inbound('room'), onStatus);
      await own; pump();
    },
    send,
    watch: pid => { if (teacher) pipeFor(pid); },
    close() { clearTimeout(timer); [roomCh, myPipe, ...[...pipes.values()].map(p => p.ch)].forEach(c => { try { c && c.close(); } catch { } }); }
  };
}

/* ---- sound (Web Audio, no files) ---- */
const Sound = {
  ctx: null, on: true, lastBlip: 0, noise: null,
  ensure() {
    if (!this.ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; this.ctx = new C(); }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  note(f, t0, dur, type = 'sine', vol = .12, f2) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .015); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(c.destination); o.start(t0); o.stop(t0 + dur + .05);
  },
  noiseBuf() {
    if (this.noise) return this.noise;
    const c = this.ctx, b = c.createBuffer(1, c.sampleRate * 2, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return (this.noise = b);
  },
  play(name) {
    if (!this.on) return;
    const c = this.ensure(); if (!c) return;
    const t = c.currentTime + .01;
    if (name === 'blip') { if (performance.now() - this.lastBlip < 70) return; this.lastBlip = performance.now(); this.note(700 + Math.random() * 400, t, .09, 'triangle', .07); }
    else if (name === 'step') this.note(330, t, .28, 'sine', .12, 880);
    else if (name === 'chime') [1047, 1319, 1568].forEach((f, i) => this.note(f, t + i * .08, .4, 'sine', .1));
    else if (name === 'cash') { this.note(1568, t, .07, 'square', .05); this.note(2093, t + .07, .25, 'square', .05); }
    else if (name === 'sting') [392, 523, 659, 784].forEach((f, i) => this.note(f, t + i * .07, .22, 'sawtooth', .05));
    else if (name === 'wrong') this.note(220, t, .22, 'square', .05, 180);
    else if (name === 'drumroll') {
      const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
      src.buffer = this.noiseBuf(); f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = .7;
      g.gain.setValueAtTime(0, t);
      for (let k = 0; k < 40; k++) { const tt = t + k * .04; g.gain.setValueAtTime(.06 + k * .004, tt); g.gain.setValueAtTime(.015, tt + .02); }
      g.gain.setValueAtTime(0.0001, t + 1.62);
      src.connect(f).connect(g).connect(c.destination); src.start(t); src.stop(t + 1.65);
    }
    else if (name === 'fanfare') [[523, 0], [659, .12], [784, .24], [1047, .4]].forEach(([fq, d]) => { this.note(fq, t + d, .5, 'triangle', .1); this.note(fq / 2, t + d, .5, 'sine', .06); });
  }
};

/* ---- confetti ---- */
function confetti(n = 70) {
  if (REDUCED) return;
  const cv = $('#fx'); if (!cv) return;
  const W = cv.width = innerWidth, H = cv.height = innerHeight, g = cv.getContext('2d');
  const cols = ['#d8a21f', '#12648c', '#b02a3f', '#22805a', '#f2cf6b'];
  const ps = Array.from({ length: n }, () => ({ x: W / 2 + (Math.random() - .5) * W * .3, y: H * .35, vx: (Math.random() - .5) * 12, vy: -Math.random() * 12 - 4, r: 4 + Math.random() * 5, c: cols[Math.floor(Math.random() * cols.length)], a: Math.random() * 6 }));
  const t0 = performance.now();
  (function frame(now) {
    g.clearRect(0, 0, W, H);
    ps.forEach(p => { p.vy += .45; p.x += p.vx; p.y += p.vy; p.a += .2; g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.fillStyle = p.c; g.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); g.restore(); });
    if (now - t0 < 1600) requestAnimationFrame(frame); else g.clearRect(0, 0, W, H);
  })(t0);
}

  if (p && p.active && p.active !== S.team && ['reveal', 'observer', 'debrief'].includes(p.phase) && p.result) return resultHtml();
  return hubHtml();
}
/** After an in-place change (a tick or a tally), record what the screen now shows, so the next redraw leaves it alone */
const settle = () => { const m = $('#sMain'); if (m) m._html = mainHtml(); };
function bannerHtml() {
  const p = S.pub, W = words(S.P); if (!p || !S.team) return '';
  const mine = p.active === S.team, R = myRoles().map(id => roleOf(S.P, id)), has = k => R.some(r => r.kind === k);
  const b = (cls, html) => `<div class="rp-banner ${cls}">${html}</div>`;
  if (p.phase === 'lobby' || p.phase === 'prep') return b('', S.seat == null ? `📖 Read your briefing, then claim a role.` : p.phase === 'prep' ? `⏱ Prep time: read your card, rehearse once.` : `✓ Role claimed. Read your card; prep starts soon.`);
  if (p.phase === 'spin') return b('spin', `🎡 Spinning… who’s next?`);
  if (p.phase === 'ready') return b('', `Next team in a moment…`);
  if (p.phase === 'finish') return b('', `🎉 All done. ${S.tab === 'take' ? '' : '<button class="btn small" data-a="tab" data-t="take">Takeaway</button>'}`);
  if (mine) {
    if (p.phase === 'stage') return b('live', `🎬 YOUR TEAM IS ON STAGE`);
    if (p.phase === 'vote') return b('live', `🗳 The room is voting on your ${esc(W.scene)}…`);
    if (p.phase === 'reveal') return b('live', p.result && p.result.n ? `${Math.round((p.result.counts[p.result.station] || 0) / p.result.n * 100)}% of the room spotted it!` : 'The votes are in.');
    if (p.phase === 'observer') return b(has('observer') ? 'turn' : 'live', has('observer') ? `🔍 Your turn: walk the room through it` : `🔍 Your ${esc((S.P.roles.find(r => r.kind === 'observer') || { name: 'observer' }).name.toLowerCase())} is talking`);
    if (p.phase === 'debrief') return b(has('debriefer') ? 'turn' : 'live', has('debriefer') ? `🧠 Your turn: explain why it works` : `🧠 Your ${esc((S.P.roles.find(r => r.kind === 'debriefer') || { name: 'debriefer' }).name.toLowerCase())} is talking`);
  }
  return '';
}
function entryHtml() {
  const p = S.pub, n = p ? p.nTeams : 0;
  return `<div class="stack"><h1 style="margin:0">${esc(S.P.icon || '')} ${esc(S.P.title)}</h1><p class="muted" style="margin:0">${esc(S.P.subtitle || '')}</p>
    <div class="panel stack"><label class="field" for="nickIn">Your first name <small class="muted">(optional)</small></label><input id="nickIn" maxlength="16" autocomplete="given-name" value="${esc(S.nick)}" placeholder="Your first name">
    <div><b>Your team</b></div>${n ? `<div class="rp-teamgrid">${Array.from({ length: n }, (_, i) => `<button class="rp-tbig" data-a="team" data-n="${i + 1}">Team ${i + 1}</button>`).join('')}</div>` : `<p class="muted">Looking for the room…</p>`}
    <small class="muted">No accounts. Your name only shows on your team’s role list.</small></div></div>`;
}
function hubHtml() {
  const st = myStation(), tab = S.tab === 'take' ? 'role' : S.tab;
  if (!st) return `<div class="panel">Getting your team’s cards…</div>`;
  return `<nav class="rp-tabs"><button class="${tab === 'brief' ? 'on' : ''}" data-a="tab" data-t="brief">1. Briefing</button><button class="${tab === 'role' ? 'on' : ''}" data-a="tab" data-t="role">2. ${S.seat == null ? 'Claim your role' : 'Your role'}</button></nav>
    ${tab === 'brief' ? briefingHtml(S.P, st) + `<button class="btn primary big rp-wide" data-a="tab" data-t="role">${S.seat == null ? 'Go to role selection →' : 'Back to your role →'}</button>` : roleTabHtml(st)}
    <p class="rp-foot"><button class="btn small ghost" data-a="leave">Change team</button></p>`;
}
function roleTabHtml(st) {
  const P = S.P, size = mySize(), seats = seatsFor(P, size), t = myTeamPub(), claims = (t && t.claims) || {}, onStage = S.pub && S.pub.active === S.team && ROUND.includes(S.pub.phase);
  const sizePills = `<div class="rp-size"><span>Team size</span>${sizesOf(P).map(n => `<button class="${n === size ? 'on' : ''}" data-a="size" data-n="${n}" ${onStage ? 'disabled' : ''}>${n}</button>`).join('')}</div>`;
  const seatList = `<div class="rp-seatlist">${seats.map((roles, i) => { const c = claims[i], me = S.seat === i, rs = roles.map(id => roleOf(P, id));
    return `<div class="rp-seatrow${me ? ' me' : ''}${c && !me ? ' taken' : ''}"><span class="ic">${rs.map(r => r.icon).join('')}</span><span class="nm"><b>${rs.map(r => esc(r.name)).join(' + ')}</b>${rs.length > 1 ? `<small>${esc(rs[1].name)} after the ${esc(words(P).scene)}</small>` : ''}${rs.some(r => r.kind === 'secret') ? '<small>🤫 secret card</small>' : ''}</span>
      ${me ? '<span class="who me">You</span>' : c ? `<span class="who">${esc(c.nick || 'Taken')}</span>` : `<button class="btn small primary" data-a="claim" data-i="${i}">Claim</button>`}</div>`; }).join('')}</div>`;
  if (S.seat == null) return `<div class="stack">${sizePills}<p class="muted" style="margin:0">Choose together: everyone in your team picks the same size. Then claim one role each.</p>${seatList}</div>`;
  const R = myRoles(); if (!R.length) return `<div class="stack">${sizePills}${seatList}</div>`;
  let now = R, later = [];
  const kinds = R.map(id => roleOf(P, id).kind), post = k => k === 'observer' || k === 'debriefer';
  if (R.length > 1 && !post(kinds[0]) && post(kinds[1])) { if (sceneDone()) now = R.slice(1); else { now = [R[0]]; later = R.slice(1); } }
  else if (R.length > 1 && S.pub && S.pub.phase === 'debrief' && S.pub.active === S.team) now = R.slice().reverse();
  const ticks = S.ticks[st.id] || {}, flipped = R.length > 1 && sceneDone() && !post(kinds[0]), fk = st.id + ':' + S.seat + ':' + ((S.pub && S.pub.round) || 0);
  const flipNow = flipped && S.flipShown !== fk; if (flipped) S.flipShown = fk; // the flip animation plays once, not on every redraw
  return `<div class="stack">${R.length > 1 && sceneDone() && !post(kinds[0]) ? `<div class="rp-flip">🔄 Card flipped: you are now the ${esc(roleOf(P, R[1]).name)}</div>` : ''}
    ${now.map(id => `<div class="${flipNow ? 'rp-flipin' : ''}">${roleCardHtml(P, st, id, { plan: { phases: (S.pub && S.pub.phases) || planFor(P).phases }, ticks })}</div>`).join('')}
    ${later.length ? `<details class="rp-later"><summary>After the ${esc(words(P).scene)}: ${later.map(id => esc(roleOf(P, id).name)).join(' + ')}</summary>${later.map(id => roleCardHtml(P, st, id, { plan: { phases: (S.pub && S.pub.phases) || planFor(P).phases }, ticks })).join('')}</details>` : ''}
    <details class="rp-team-d"><summary>Your team’s roles · size ${size}</summary>${sizePills}${seatList}<button class="btn small ghost" data-a="unclaim">Give up my role</button></details></div>`;
}
function ballotHtml() {
  const p = S.pub, P = S.P, W = words(P);
  return `<div class="rp-ballot"><div class="rp-kicker">Vote · one tap</div><h2>${esc(((P.vote || {}).question || 'Which {station} did {team} show?').replace('{team}', 'Team ' + p.active).replace('{station}', W.station))}</h2>
    ${P.stations.map((st, i) => `<button class="rp-opt" data-a="vote" data-i="${i}"><span>${st.icon || ''}</span>${esc(st.vote)}</button>`).join('')}</div>`;
}
function standbyHtml() {
  const p = S.pub, v = S.votes[p.round], P = S.P;
  if (p.phase === 'vote') return `<div class="rp-standby"><div class="rp-big">✓</div><h2>Vote recorded!</h2><p>You chose <b>${esc((P.stations[v] || {}).vote || '')}</b>.</p><p class="muted">${p.voted} votes so far.</p></div>`;
  return `<div class="rp-standby"><div class="rp-big">👀</div><h2>Watch Team ${p.active} closely</h2><p>Voting opens in a moment…</p><p class="muted">${esc((P.vote || {}).hint || '')}</p></div>`;
}
function resultHtml() {
  const p = S.pub, P = S.P, r = p.result, st = P.stations[r.station], v = S.votes[p.round], ok = v === r.station;
  return `<div class="stack"><div class="rp-res ${v == null ? '' : ok ? 'ok' : 'no'}">${v == null ? 'You didn’t vote this time.' : ok ? '✓ You spotted it!' : `✗ You chose ${esc((P.stations[v] || {}).vote || '')}`}</div>
    <div class="rp-hero"><span class="rp-ico">${st.icon || '🎭'}</span><div><small>Team ${p.active} · ${esc(st.moment || '')}</small><h2>${esc(st.title)}</h2></div></div>
    <div class="rp-move"><b>The move</b><p>${esc(st.move || '')}</p></div>${scienceHtml(P, st)}</div>`;
}
function takeawayHtml() {
  const p = S.pub, P = S.P, f = p && p.final, me = f ? f.teams.find(t => t.team === S.team) : null;
  return `<div class="stack"><nav class="rp-tabs"><button class="on" data-a="tab" data-t="take">Takeaway</button><button data-a="tab" data-t="role">My team’s cards</button></nav>
    ${me && me.total ? `<div class="rp-res ok">Team ${S.team} spotted ${me.right} of ${me.total} (${Math.round(me.right / me.total * 100)}%)</div>` : ''}
    ${P.commit ? `<div class="panel stack"><b>${esc(P.commit.prompt)}</b><textarea id="commitIn" rows="2" placeholder="${esc(P.commit.example || '')}">${esc(S.commit)}</textarea><small class="muted">Stays on this phone only.</small></div>` : ''}
    ${overviewHtml(P)}
    ${P.stations.map(st => `<details class="rp-tk"><summary>${st.icon || ''} <b>${esc(st.title)}</b> <small>${esc(st.moment || '')}</small></summary>${briefingHtml(P, st)}</details>`).join('')}
    ${P.anchor ? `<blockquote class="rp-anchor">${esc(P.anchor.quote)}<cite>${esc(P.anchor.who)}</cite><p>${esc(P.anchor.line || '')}</p></blockquote>` : ''}
    <a class="btn rp-wide" href="${PAGE}?mode=cards&pack=${encodeURIComponent(P.id)}" target="_blank" rel="noopener">Open every card (to keep)</a></div>`;
}
/* ---- observer tools: ticks, tallies, stopwatch ---- */
function restoreTools() {
  Object.entries(S.sw).forEach(([ti, w]) => { const ol = $(`[data-laps="${ti}"]`); if (!ol) return; $$('li', ol).forEach((li2, i) => { const b = $('b', li2); if (b) b.textContent = w.laps[i] != null ? (w.laps[i] / 1000).toFixed(1) + ' s' : '–'; }); const g = $(`[data-a="sw"][data-op="go"][data-t="${ti}"]`); if (g) g.textContent = w.run ? 'Stop' : 'Start'; });
}
function devClick(e) {
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  const a = b.dataset.a; Sound.ensure();
  if (a === 'team') { S.team = +b.dataset.n; S.seat = null; S.station = null; S.tab = 'brief'; S.nick = ($('#nickIn') || {}).value ? $('#nickIn').value.replace(/\s+/g, ' ').trim().slice(0, 16) : S.nick; sSave(); sSend({ type: 'hello', nick: S.nick, team: S.team, seat: null }); sfx('chime'); return render(); }
  if (a === 'leave') { if (S.seat != null) sSend({ type: 'unclaim' }); S.team = null; S.seat = null; S.station = null; sSave(); return render(); }
  if (a === 'tab') { S.tab = b.dataset.t; sSave(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  if (a === 'size') { S.lastSize = +b.dataset.n; sSend({ type: 'size', n: +b.dataset.n }); sfx('step'); return; }
  if (a === 'claim') { S.seat = +b.dataset.i; S.claimAt = Date.now(); sSave(); sSend({ type: 'claim', seat: S.seat }); sfx('chime'); buzz(60); return render(); }
  if (a === 'unclaim') { S.seat = null; S.claimAt = Date.now(); sSave(); sSend({ type: 'unclaim' }); return render(); }
  if (a === 'vote') { const p = S.pub; if (!p || p.phase !== 'vote') return; S.votes[p.round] = +b.dataset.i; sSave(); sSend({ type: 'vote', round: p.round, opt: +b.dataset.i }); sfx('cash'); buzz(40); return render(); }
  const st = myStation(); if (!st) return;
  const tk = (S.ticks[st.id] ||= {});
  if (a === 'tick') { const k = b.dataset.k, i = +b.dataset.i, L = (tk[k] ||= []); const j = L.indexOf(i); if (j < 0) L.push(i); else L.splice(j, 1); sSave(); sfx('step'); b.classList.toggle('on', j < 0); $('span', b).textContent = j < 0 ? '✓' : ''; settle(); sendTicks(st); return; }
  if (a === 'tally') { const t = (tk['t' + b.dataset.t] ||= {}); t[b.dataset.i] = (t[b.dataset.i] || 0) + 1; sSave(); sfx('blip'); $('b', b).textContent = t[b.dataset.i]; settle(); return; }
  if (a === 'tally-reset') { delete tk['t' + b.dataset.t]; sSave(); $$(`[data-a="tally"][data-t="${b.dataset.t}"] b`).forEach(x => { x.textContent = '0'; }); settle(); return; }
  if (a === 'sw') {
    const ti = b.dataset.t, w = (S.sw[ti] ||= { run: false, t0: 0, stopped: 0, laps: [] }), op = b.dataset.op;
    if (op === 'go') { if (w.run) { w.run = false; w.stopped = Date.now() - w.t0; } else { w.run = true; w.t0 = Date.now() - (w.stopped || 0); } }
    else if (op === 'lap') { if (!w.run) return toast('Start the stopwatch first.'); w.laps.push(Date.now() - w.t0); w.run = false; w.stopped = 0; w.t0 = 0; }
    else { S.sw[ti] = { run: false, t0: 0, stopped: 0, laps: [] }; }
    sfx('step'); restoreTools(); tick(); return;
  }
}

const sendTicks = st => {}; // filled in when self-appraisal scores go to the console
/* ---- every card, to browse or print (no room needed) ---- */
function cardsBoot() {
  document.documentElement.dataset.theme = 'light';
  const P = packById(PARAMS.get('pack') || '') || packFor(PARAMS.get('pack') || '') || RP_PACKS[0]; applyTheme(P);
  const plan = planFor(P);
  document.body.classList.add('rp-cards');
  document.body.innerHTML = shell(`<header class="topbar"><span class="brand">${esc(P.icon || '🎭')} ${esc(P.title)}</span><span class="chip">All cards</span><span class="spacer"></span><button class="btn small ghost rp-topbtn" id="pr">🖨 Print</button></header>
    <main id="printArea" class="wrap stack rp-allcards">${P.objectives ? `<div class="panel"><b>Objectives</b><ol class="rp-mini">${li(P.objectives)}</ol></div>` : ''}${overviewHtml(P)}
    ${P.anchor ? `<blockquote class="rp-anchor">${esc(P.anchor.quote)}<cite>${esc(P.anchor.who)}</cite><p>${esc(P.anchor.line || '')}</p></blockquote>` : ''}${allCardsHtml(P, plan, false)}</main>`);
  $('#pr').onclick = () => window.print();
}
(function boot() {
  const mode = PARAMS.get('mode') || (PARAMS.get('room') ? 'student' : 'home');
  if (mode === 'teacher') teacherBoot(); else if (mode === 'student') studentBoot(); else if (mode === 'cards') cardsBoot();
  else location.replace('index.html' + (PARAMS.get('t') ? '?t=' + PARAMS.get('t') : ''));
})();

</script>
