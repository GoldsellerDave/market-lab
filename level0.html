<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chợ Lớp 9: EcoLogic Market Lab Level 0</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧋</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root {
  --cocoa: #3a2217;
  --cocoa-2: #5b3826;
  --ink: #23170f;
  --muted: #6d6158;
  --paper: #f3f4f7;
  --panel: #ffffff;
  --line: #dcd8de;
  --foil: #d8a21f;
  --foil-2: #f2cf6b;
  --buyer: #12648c;
  --buyer-soft: #e2eff6;
  --seller: #b02a3f;
  --seller-soft: #f8e5e8;
  --mint: #22805a;
  --mint-soft: #e1f2e9;
  --warn: #9a5b00;
  --warn-soft: #fbf0dc;
  --shadow: 0 1px 2px rgba(35, 23, 15, .08), 0 6px 18px rgba(35, 23, 15, .06);
  --r-sm: 8px;
  --r-md: 14px;
  --buyer-card: #12648c;
  --seller-card: #b02a3f;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --font-display: "Bricolage Grotesque", "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #f3ebe4; --muted: #b8aca2; --paper: #17120f; --panel: #221b16; --line: #3c322b;
    --buyer: #5fb3dc; --buyer-soft: #16303d; --seller: #ec7a8c; --seller-soft: #3d1c22;
    --mint: #5cc79a; --mint-soft: #16332a; --warn: #f0b85a; --warn-soft: #3a2c12;
    --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #f3ebe4; --muted: #b8aca2; --paper: #17120f; --panel: #221b16; --line: #3c322b;
  --buyer: #5fb3dc; --buyer-soft: #16303d; --seller: #ec7a8c; --seller-soft: #3d1c22;
  --mint: #5cc79a; --mint-soft: #16332a; --warn: #f0b85a; --warn-soft: #3a2c12;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  margin: 0; min-height: 100%; background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; margin: 0 0 .4em; letter-spacing: -.01em; }
h1 { font-size: clamp(1.6rem, 4vw, 2.3rem); font-weight: 800; }
h2 { font-size: 1.3rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0 0 .8em; max-width: 68ch; }
small, .muted { color: var(--muted); }
a { color: var(--buyer); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--foil); outline-offset: 2px; }

.wrap { max-width: 1180px; margin: 0 auto; padding: 16px; }
.narrow { max-width: 520px; margin: 0 auto; padding: 16px; }

.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--cocoa); color: #fbf3ea;
}
.topbar .brand { font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; }
.topbar .spacer { flex: 1; }
.topbar .chip { background: rgba(255,255,255,.12); color: #fbf3ea; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px; box-shadow: var(--shadow); }
.panel + .panel { margin-top: 14px; }
.stack > * + * { margin-top: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }

.btn {
  appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 999px; padding: 10px 18px; font-weight: 700; cursor: pointer; min-height: 44px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
}
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--cocoa); border-color: var(--cocoa); color: #fbf3ea; }
:root[data-theme="dark"] .btn.primary { background: var(--foil); border-color: var(--foil); color: #23170f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { background: var(--foil); border-color: var(--foil); color: #23170f; } }
.btn.buyer { background: var(--buyer-card); border-color: var(--buyer-card); color: #fff; }
.btn.seller { background: var(--seller-card); border-color: var(--seller-card); color: #fff; }
.btn.small { min-height: 34px; padding: 5px 12px; font-size: .9rem; }
.btn.block { width: 100%; }
.btn.ghost { background: transparent; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: .88rem; background: var(--paper); border: 1px solid var(--line); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; }
.dot.ok { background: var(--mint); } .dot.bad { background: var(--seller); } .dot.wait { background: var(--foil); }

label.field { display: block; font-weight: 700; margin-bottom: 4px; }
input[type=text], input[type=number], select, textarea {
  width: 100%; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; background: var(--panel); min-height: 44px;
}
textarea { min-height: 120px; resize: vertical; line-height: 1.45; }
.code-input { font-family: var(--font-display); font-size: 1.6rem; letter-spacing: .25em; text-transform: uppercase; text-align: center; }

.note { padding: 10px 12px; border-radius: var(--r-sm); background: var(--warn-soft); color: var(--ink); border-left: 4px solid var(--warn); }
.good { padding: 10px 12px; border-radius: var(--r-sm); background: var(--mint-soft); border-left: 4px solid var(--mint); }
.bad { padding: 10px 12px; border-radius: var(--r-sm); background: var(--seller-soft); border-left: 4px solid var(--seller); }

/* Home */
.home-hero { padding: 40px 0 20px; }
.home-choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.choice { text-align: left; padding: 22px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--panel); cursor: pointer; box-shadow: var(--shadow); }
.choice h2 { margin-bottom: .2em; }

/* The chocolate bar card: the one bold element */
.bar {
  position: relative; border-radius: 16px; overflow: hidden; color: #fff; box-shadow: 0 10px 28px rgba(35,23,15,.25);
  background: var(--buyer-card);
}
.bar.seller { background: var(--seller-card); }
.bar .foil { height: 14px; background: linear-gradient(90deg, var(--foil), var(--foil-2), var(--foil), var(--foil-2)); }
.bar .body { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 16px 18px 18px; }
.bar .role { font-family: var(--font-display); font-size: 1.5rem; font-weight: 800; }
.bar .say { font-size: 1rem; opacity: .95; margin: 2px 0 0; }
.bar .slab {
  width: 112px; height: 112px; border-radius: 10px; display: grid; place-items: center;
  background:
    linear-gradient(var(--cocoa) 0 0) padding-box,
    var(--cocoa);
  background-image:
    linear-gradient(90deg, transparent 47%, rgba(0,0,0,.35) 47% 53%, transparent 53%),
    linear-gradient(0deg, transparent 47%, rgba(0,0,0,.35) 47% 53%, transparent 53%),
    linear-gradient(145deg, var(--cocoa-2), var(--cocoa));
  box-shadow: inset 0 2px 0 rgba(255,255,255,.12), inset 0 -3px 0 rgba(0,0,0,.25);
}
.bar .slab span { font-family: var(--font-display); font-size: 3.4rem; font-weight: 800; color: var(--foil-2); text-shadow: 0 2px 0 rgba(0,0,0,.4); line-height: 1; }
.bar .slab small { display: block; color: #f6e2b0; text-align: center; font-size: .78rem; margin-top: 2px; }

/* Market */
.quotes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.quote { border-radius: var(--r-sm); padding: 10px 12px; border: 1px solid var(--line); background: var(--panel); }
.quote .q-label { font-size: .88rem; color: var(--muted); }
.quote .q-val { font-family: var(--font-display); font-size: 1.8rem; font-weight: 800; }
.quote.bid .q-val { color: var(--buyer); } .quote.ask .q-val { color: var(--seller); }
.stepper { display: grid; grid-template-columns: 56px 1fr 56px; align-items: center; gap: 8px; }
.stepper button { min-height: 56px; border-radius: 12px; font-size: 1.6rem; font-weight: 800; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
.stepper .val { text-align: center; font-family: var(--font-display); font-size: 2.4rem; font-weight: 800; }
.tape { display: flex; flex-wrap: wrap; gap: 6px; }
.tape .chip { font-weight: 700; }
.timer { font-family: var(--font-display); font-weight: 800; font-variant-numeric: tabular-nums; }
.big-timer { font-size: 2.2rem; }

/* Tables */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: right; }
th:first-child, td:first-child { text-align: left; }
th { font-weight: 700; color: var(--muted); font-size: .9rem; }
tr.eq td { background: var(--mint-soft); font-weight: 700; }

/* Teacher stepper */
ol.steps { list-style: none; padding: 0; margin: 0; counter-reset: s; }
ol.steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); }
ol.steps li::before { content: counter(s); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: .9rem; background: var(--paper); border: 1px solid var(--line); }
ol.steps li.done::before { content: "✓"; background: var(--mint); border-color: var(--mint); color: #fff; }
ol.steps li.now::before { background: var(--foil); border-color: var(--foil); color: #23170f; }
ol.steps li .btn { justify-self: start; }

.roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.roster .who { padding: 6px 8px; border-radius: var(--r-sm); border: 1px solid var(--line); font-size: .9rem; display: flex; justify-content: space-between; gap: 6px; }
.roster .who.buyer { border-left: 4px solid var(--buyer); } .roster .who.seller { border-left: 4px solid var(--seller); }
.roster .who.done { background: var(--mint-soft); }

.chart-box { position: relative; width: 100%; aspect-ratio: 16 / 9; min-height: 220px; }
.chart-box canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

/* Projector overlay */
.projector { position: fixed; inset: 0; z-index: 50; background: var(--paper); display: grid; grid-template-columns: 1fr 340px; gap: 20px; padding: calc(16px + env(safe-area-inset-top, 0px)) 20px calc(16px + env(safe-area-inset-bottom, 0px)); }
.projector .chart-box { aspect-ratio: auto; height: 100%; }
.projector .side { display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
.projector .code { font-family: var(--font-display); font-size: 3.4rem; font-weight: 800; letter-spacing: .12em; line-height: 1; }
@media (max-width: 900px) { .projector { grid-template-columns: 1fr; grid-template-rows: 1fr auto; } }

.envelope { border-radius: var(--r-md); padding: 18px; background: var(--cocoa); color: #fbf3ea; text-align: center; }
.envelope .seal { width: 54px; height: 54px; border-radius: 50%; background: var(--foil); margin: 0 auto 8px; display: grid; place-items: center; font-weight: 800; color: #23170f; }
.envelope.open { animation: openup .9s cubic-bezier(.2,.8,.2,1); }
.envelope .pred { font-family: var(--font-display); font-size: 2.2rem; font-weight: 800; color: var(--foil-2); }
@keyframes openup { 0% { transform: rotateX(70deg) scale(.9); opacity: 0; } 100% { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .envelope.open { animation: none; } }

.qr { background: #fff; padding: 8px; border-radius: 8px; width: max-content; }
.qr img, .qr canvas { display: block; }

/* Tasks */
.tier { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; margin: 18px 0 8px; display: flex; align-items: center; gap: 8px; }
.tier .chip { font-family: var(--font-body); font-weight: 400; }
.task { border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px; background: var(--panel); }
.task + .task { margin-top: 10px; }
.task.solved { border-color: var(--mint); }
.task .ref { font-size: .82rem; color: var(--muted); }
.opts { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.opt { min-width: 48px; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font-weight: 700; cursor: pointer; padding: 6px 12px; }
.opt.sel { border-color: var(--cocoa); background: var(--cocoa); color: #fbf3ea; }
.frames { font-size: .95rem; color: var(--muted); margin: 6px 0; padding-left: 18px; }
.plot svg { width: 100%; max-width: 420px; height: auto; touch-action: manipulation; user-select: none; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 8px 14px; font-weight: 700; cursor: pointer; min-height: 40px; }
.seg button.on.d { background: var(--buyer); color: #fff; } .seg button.on.s { background: var(--seller); color: #fff; }

/* Glossary */
.term { border: 0; background: none; padding: 0; font: inherit; color: inherit; text-decoration: underline dotted 2px; text-underline-offset: 3px; cursor: help; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 80; background: var(--panel); border-top: 3px solid var(--foil); padding: 16px 18px calc(18px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -8px 24px rgba(0,0,0,.18); max-width: 640px; margin: 0 auto; border-radius: 16px 16px 0 0; }
.sheet .vi { color: var(--muted); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 90; background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font-weight: 700; max-width: 92vw; text-align: center; }

.poll-bar { height: 12px; border-radius: 6px; background: var(--paper); border: 1px solid var(--line); overflow: hidden; }
.poll-bar > i { display: block; height: 100%; background: var(--foil); }

details summary { cursor: pointer; font-weight: 700; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }
.hidden { display: none !important; }
.topbar .btn.primary { background: var(--foil); border-color: var(--foil); color: #23170f; }
.dot.ok, .dot.bad, .dot.wait { padding: 0; border: 0; border-radius: 50%; width: 9px; height: 9px; }
.dot.bad { background: var(--seller); }

/* ===== Level 0 additions ===== */
.fx { position: fixed; inset: 0; pointer-events: none; z-index: 95; width: 100vw; height: 100vh; }
.lead { font-size: 1.15rem; }
.code-big { font-family: var(--font-display); font-size: 2rem; font-weight: 800; letter-spacing: .12em; line-height: 1.1; }
.art-join { width: 90px; }
.art-join svg, .art svg, .art-big svg { width: 100%; height: auto; display: block; }
kbd { font-family: var(--font-body); font-size: .72em; font-weight: 700; padding: 1px 6px; border-radius: 5px; border: 1px solid currentColor; opacity: .6; margin-left: 4px; }
@media (hover: none) { kbd { display: none; } }

/* student two-column layout for tablets and laptops */
.sgrid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .sgrid { grid-template-columns: 1fr; } }
.ask-mini { position: relative; }
.ask-mini .art { width: 92px; float: right; margin: 0 0 6px 12px; }
.ask-mini.demand { border-top: 6px solid var(--buyer-card); }
.ask-mini.supply { border-top: 6px solid var(--seller-card); }
.yn { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; clear: both; }
.yn .btn { min-height: 72px; font-size: 1.5rem; border-radius: 16px; border-width: 2px; }
.yn .btn.yes.sel { background: var(--mint); border-color: var(--mint); color: #fff; }
.yn .btn.no.sel { background: var(--seller-card); border-color: var(--seller-card); color: #fff; }
.opt.big { min-height: 60px; font-size: 1.15rem; padding: 8px 20px; }
tr.cur td { background: var(--warn-soft); font-weight: 700; }

.bdg { font-size: 1.6rem; line-height: 1; display: inline-block; }
.bdg.off { filter: grayscale(1); opacity: .3; }
.bdg.big { font-size: 2.6rem; }
.badgewall { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.bw { border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; background: var(--panel); }
.bw.locked { opacity: .45; filter: grayscale(1); }
.meter { height: 16px; border-radius: 8px; background: var(--paper); border: 1px solid var(--line); overflow: hidden; margin-top: 4px; }
.meter > i { display: block; height: 100%; background: linear-gradient(90deg, var(--foil), var(--foil-2)); transition: width .6s ease; }
.feed-item { padding: 4px 0; border-bottom: 1px dashed var(--line); }

/* robot deals */
.chat { max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px; }
.msg { max-width: 82%; padding: 8px 12px; border-radius: 14px; background: var(--paper); border: 1px solid var(--line); }
.msg .who { display: block; font-size: .78rem; color: var(--muted); font-weight: 700; }
.msg.y { align-self: flex-end; background: var(--buyer-soft); }
.dline { width: 100%; max-width: 460px; height: auto; display: block; margin: 4px 0; }

/* projector, Level 0 */
.projector.l0 { grid-template-columns: 1fr 320px; }
.pmain { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.news { display: flex; align-items: center; gap: 14px; background: var(--cocoa); color: #fbf3ea; border-radius: var(--r-md); padding: 12px 16px; font-size: clamp(1.05rem, 1.6vw, 1.4rem); }
.news .flag { background: var(--foil); color: #23170f; font-weight: 800; padding: 4px 10px; border-radius: 6px; white-space: nowrap; font-family: var(--font-display); }
.news.slide { animation: slidein .6s cubic-bezier(.2,.8,.2,1); }
@keyframes slidein { from { transform: translateY(-30px); opacity: 0; } to { transform: none; opacity: 1; } }
.pstage { flex: 1; min-height: 0; display: flex; }
.pstage > * { flex: 1; min-height: 0; }
.lobby-stage { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; }
.lobby-stage h1 { font-size: clamp(2rem, 4vw, 3.4rem); }
.art-big { width: clamp(120px, 14vw, 200px); }
.bubbles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 900px; }
.bubble { padding: 6px 14px; border-radius: 999px; background: var(--panel); border: 2px solid var(--foil); font-weight: 700; animation: pop .4s ease; }
.ask-stage { display: grid; grid-template-columns: minmax(260px, 34%) 1fr; gap: 18px; min-height: 0; }
.ask-stage.wide { grid-template-columns: 1fr minmax(240px, 30%); }
.ask-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); padding: 18px; display: flex; flex-direction: column; gap: 10px; overflow: auto; }
.ask-card.demand { border-top: 8px solid var(--buyer-card); } .ask-card.supply { border-top: 8px solid var(--seller-card); }
.ask-card .art { width: 46%; max-width: 170px; align-self: center; }
.ask-card h2 { font-size: clamp(1.3rem, 2.2vw, 2rem); }
.ask-card .story { font-size: 1.05rem; margin: 0; }
.pricetag { align-self: center; font-family: var(--font-display); font-weight: 800; font-size: clamp(2.2rem, 4.5vw, 3.8rem); background: var(--foil); color: #23170f; padding: 4px 22px; border-radius: 14px; transform: rotate(-3deg); box-shadow: 0 6px 0 rgba(0,0,0,.18); }
.yescount { display: flex; align-items: baseline; gap: 10px; justify-content: center; }
.yescount span { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.4rem, 5vw, 4.4rem); line-height: 1; }
.yescount.pop span { animation: pop .35s ease; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
.chart-box.tall { aspect-ratio: auto; height: 100%; min-height: 300px; }
.chart-box.mid { aspect-ratio: 16 / 7; }
.meet-text { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px; overflow: auto; }
.selfpace, .finish { display: flex; flex-direction: column; gap: 12px; overflow: auto; }
.roster.big .who { font-size: 1.05rem; padding: 10px; }

.fx-pod-who { opacity: 0; transform: translateY(30px) scale(.8); transition: all .6s cubic-bezier(.2,1.4,.4,1); padding-bottom: 8px; }
.fx-pod.in .fx-pod-who { opacity: 1; transform: none; }
.fx-pod-av { font-size: clamp(2.6rem, min(8vw, 9vh), 6rem); line-height: 1; }
.fx-pod-nick { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.2rem, 2.6vw, 2rem); }
.fx-pod-val { color: var(--muted); font-size: clamp(1rem, 1.8vw, 1.4rem); }
.fx-pod-step { border-radius: 14px 14px 0 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 8px; font-size: clamp(1.4rem, 3vh, 2.2rem); color: #23170f; line-height: 1.1; }
.fx-pod-step b { font-family: var(--font-display); font-size: clamp(1.6rem, min(5vw, 6vh), 3.6rem); line-height: 1; }
.fx-pod.p1 .fx-pod-step { height: min(230px, 24vh); background: linear-gradient(var(--foil-2), var(--foil)); }
.fx-pod.p2 .fx-pod-step { height: min(170px, 18vh); background: linear-gradient(#e8e8ee, #b9bcc6); }
.fx-pod.p3 .fx-pod-step { height: min(120px, 13vh); background: linear-gradient(#f0c9a0, #c58a52); }
.fx-podium-teams { width: min(700px, 100%); text-align: left; }
@media (max-width: 640px) { .fx-pod.p1 .fx-pod-step { height: 150px; } .fx-pod.p2 .fx-pod-step { height: 110px; } .fx-pod.p3 .fx-pod-step { height: 80px; } }

/* prediction cards */
.fx-predict { border: 3px solid var(--foil); border-radius: var(--r-md); background: var(--warn-soft); padding: 12px 14px; }
.fx-predict h3 { margin: 0 0 6px; }
.fx-arrows { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.fx-arrow { min-height: 72px; border-radius: 14px; border: 2px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; font-weight: 800; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 1rem; }
.fx-arrow span { font-size: 2rem; line-height: 1; }
.fx-arrow.sel { border-color: var(--foil); box-shadow: inset 0 0 0 2px var(--foil); background: #fff8e1; color: #23170f; }

/* replay and floor charts on the projector */
.fx-replay { position: absolute; right: 10px; top: 8px; z-index: 2; }
.fx-chart-wrap { position: relative; }

/* grids never grow wider than the screen (a long ticker scrolls inside its panel instead) */
.sgrid > *, .tradegrid > *, .grid2 > *, .deal-grid > * { min-width: 0; }
.fx-ticker { max-width: 100%; }
@media (max-width: 900px) { .topbar #hConn, .topbar #sConn { font-size: 0; gap: 0; padding: 6px 8px; } .topbar .fx-lab { display: none; } }
</style><!--/FX-CSS-->
</head>
<body>
<noscript>This activity needs JavaScript turned on.</noscript>
<!--FX-JS--><script id="fx-js">
/* =====================================================================
   EcoLogic Market Lab: shared game layer (FX), used by every level.
   Sounds are synthesised (no audio files); pictures are drawn in code.
   Every effect is short (under about a second) and can be switched off
   on each device with the ✨ button (or the system "reduce motion" setting).
   ===================================================================== */
const FX = (() => {
  const LS = 'ecologic-market:';
  const get = (k, d) => { try { const v = localStorage.getItem(LS + k); return v == null ? d : JSON.parse(v); } catch { return d; } };
  const set = (k, v) => { try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch { } };
  const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const sysReduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const calm = () => sysReduced || !!get('calm', false);

  /* ---------- avatars, teams, titles ---------- */
  const AVATARS = ['🐼', '🦊', '🐯', '🐸', '🐵', '🐨', '🐙', '🦄', '🐲', '🐧', '🦁', '🐰', '🐻', '🐱', '🐶', '🦉', '🐢', '🐬', '🐝', '🦋', '🌟', '🚀', '🎸', '⚽'];
  const TEAMS = {
    r: { icon: '🔴', name: 'Red table', vi: 'Bàn Đỏ', color: '#d64545' },
    b: { icon: '🔵', name: 'Blue table', vi: 'Bàn Xanh dương', color: '#2f74c0' },
    g: { icon: '🟢', name: 'Green table', vi: 'Bàn Xanh lá', color: '#2e9a5c' },
    y: { icon: '🟡', name: 'Yellow table', vi: 'Bàn Vàng', color: '#d9a400' }
  };
  const TITLES = [
    { icon: '🧺', en: 'Street Vendor', vi: 'Người bán rong' },
    { icon: '🛒', en: 'Market Trader', vi: 'Tiểu thương' },
    { icon: '🏪', en: 'Merchant', vi: 'Nhà buôn' },
    { icon: '👑', en: 'Tycoon', vi: 'Đại gia' }
  ];
  const SHOP_COLORS = { A: '#c0392b', B: '#16768a', C: '#7b4fbf', D: '#b86b00', E: '#2a7f4f' };
  const myAvatar = () => { const a = get('avatar', null); return AVATARS.includes(a) ? a : null; };
  const avOf = a => AVATARS.includes(a) ? a : '🙂';
  const teamOf = t => TEAMS[t] || null;

  /** Title from a score and 3 thresholds (for titles 2, 3, 4) */
  function title(score, th) { let i = 0; th.forEach((t, k) => { if (score >= t) i = k + 1; }); return { i, ...TITLES[i] }; }
  const titleMem = {};
  /** Returns the title and celebrates a promotion (not the first time it is seen) */
  function titleWatch(key, score, th, onUp) {
    const t = title(score, th), prev = titleMem[key];
    titleMem[key] = t.i;
    if (prev != null && t.i > prev) { levelUp(t); onUp && onUp(t); }
    return t;
  }
  const titleChip = t => `<span class="chip fx-title" title="${h(t.vi)}">${t.icon} ${h(t.en)}</span>`;

  /* ---------- sound: extra synthesised sounds added to each level's Sound ---------- */
  let gain = 1, installed = false, gate = null;
  /** Play a sound if this device allows it (students choose; the teacher's switch can mute all students) */
  const snd = (n, o) => { if (typeof Sound === 'undefined' || (gate && !gate())) return; Sound.play(n, o); };
  const EXTRA = {
    coin(c, t, o) { const up = Math.min(6, Math.max(0, (o && o.big) || 0)); [1319, 1760, 2349].slice(0, 2 + (up > 2 ? 1 : 0)).forEach((f, i) => this.note(f * (1 + up * .02), t + i * .055, .16, 'triangle', .06)); },
    bonk(c, t) { this.note(170, t, .2, 'sine', .14, 80); this.note(95, t, .12, 'triangle', .06); },
    tick(c, t) { this.note(1900, t, .03, 'square', .025); },
    tock(c, t) { this.note(1250, t, .04, 'square', .03); },
    pop(c, t) { this.note(520, t, .09, 'sine', .08, 980); },
    jar(c, t) { this.note(2637, t, .08, 'sine', .05); this.note(3136, t + .05, .12, 'sine', .04); },
    badge(c, t) { [1319, 1568, 2093, 2637].forEach((f, i) => this.note(f, t + i * .06, .3, 'sine', .07)); },
    levelup(c, t) { [523, 659, 784, 1047, 1319].forEach((f, i) => this.note(f, t + i * .07, .25, 'square', .035)); this.note(262, t, .5, 'triangle', .06); },
    news(c, t) { [[784, 0], [988, .1], [1175, .2], [1568, .32]].forEach(([f, d]) => { this.note(f, t + d, .22, 'triangle', .08); this.note(f / 2, t + d, .22, 'sine', .05); }); this.note(392, t + .5, .6, 'sawtooth', .03); },
    whoosh(c, t) { noise.call(this, c, t, .45, 400, 3200, .05); },
    storm(c, t) { noise.call(this, c, t, 1.4, 900, 160, .08); this.note(70, t + .2, 1, 'sine', .08, 45); },
    spooky(c, t) { [659, 622, 587, 554].forEach((f, i) => this.note(f, t + i * .18, .3, 'triangle', .05)); this.note(110, t, .9, 'sawtooth', .02); },
    harvest(c, t) { noise.call(this, c, t, .8, 1600, 600, .04); [392, 349, 330].forEach((f, i) => this.note(f, t + .1 + i * .15, .25, 'triangle', .05)); },
    money(c, t) { [1568, 2093, 1568, 2093, 2637].forEach((f, i) => this.note(f, t + i * .06, .1, 'square', .03)); },
    factory(c, t) { [0, .18, .36].forEach(d => { this.note(110, t + d, .12, 'square', .04); noise.call(this, c, t + d, .1, 2000, 800, .04); }); },
    health(c, t) { [523, 659, 784].forEach((f, i) => this.note(f, t + i * .1, .35, 'sine', .07)); },
    podium(c, t) { [[392, 0], [523, .15], [659, .3], [784, .45], [1047, .65]].forEach(([f, d]) => { this.note(f, t + d, .55, 'triangle', .09); this.note(f / 2, t + d, .55, 'sine', .05); }); }
  };
  function noise(c, t, dur, f1, f2, vol) {
    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = this.noiseBuf(); f.type = 'bandpass'; f.Q.value = 1.2;
    f.frequency.setValueAtTime(f1, t); f.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol * gain, t + .05); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(c.destination); src.start(t); src.stop(t + dur + .05);
  }
  /** Call once when the page starts. opts.gain scales every sound (students are quieter than the projector). */
  function install(opts = {}) {
    gain = opts.gain ?? 1; gate = opts.gate || null;
    if (installed || typeof Sound === 'undefined') return; installed = true;
    const note = Sound.note, play = Sound.play;
    Sound.note = function (f, t0, dur, type, vol = .12, f2) { return note.call(this, f, t0, dur, type, vol * gain, f2); };
    Sound.play = function (name, o) {
      if (!EXTRA[name]) return play.call(this, name);
      if (!this.on) return; const c = this.ensure(); if (!c) return;
      try { EXTRA[name].call(this, c, c.currentTime + .01, o); } catch (e) { /* audio is optional */ }
    };
    document.addEventListener('pointerdown', () => { try { Sound.ensure(); } catch { } }, { once: true });
  }
  const setGain = g => { gain = g; };

  /* ---------- change tracking: lets an animation carry on across re-renders ---------- */
  const chg = {};
  /** ms since `val` last changed for `key` (Infinity the first time a key is seen) */
  function since(key, val) {
    const now = performance.now(), c = chg[key];
    if (!c) { chg[key] = { v: val, from: val, t: -1e9 }; return Infinity; }
    if (c.v !== val) { c.from = c.v; c.v = val; c.t = now; }
    return now - c.t;
  }
  const fromOf = key => chg[key] ? chg[key].from : null;
  /** style for an element whose animation started `ms` ago (so a re-render continues it) */
  const late = (ms, extra = 0) => `animation-delay:${Math.round(extra - ms)}ms`;

  /* ---------- small helpers ---------- */
  function pt(at) {
    if (!at) return { x: innerWidth / 2, y: innerHeight * .4 };
    if (typeof at === 'string') at = document.querySelector(at);
    if (at && at.getBoundingClientRect) { const r = at.getBoundingClientRect(); if (!r.width && !r.height) return { x: innerWidth / 2, y: innerHeight * .4 }; return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }
    return at;
  }
  function layer() { let el = document.getElementById('fxLayer'); if (!el) { el = document.createElement('div'); el.id = 'fxLayer'; el.className = 'fx-layer'; el.setAttribute('aria-hidden', 'true'); document.body.appendChild(el); } return el; }

  /** "+3k" floating up from an element */
  function float(text, at, cls = 'good') {
    if (calm()) return;
    const p = pt(at), el = document.createElement('div');
    el.className = 'fx-float ' + cls; el.textContent = text; el.style.left = p.x + 'px'; el.style.top = p.y + 'px';
    layer().appendChild(el); setTimeout(() => el.remove(), 1300);
  }
  /** Coins flying from one element to another */
  function coins(from, to, n = 6, kind = 'coin') {
    if (calm()) return;
    const a = pt(from), b = pt(to), L = layer();
    for (let i = 0; i < n; i++) {
      const el = document.createElement('div'); el.className = 'fx-coin ' + kind;
      el.style.left = a.x + 'px'; el.style.top = a.y + 'px'; L.appendChild(el);
      const dx = b.x - a.x + (Math.random() - .5) * 20, dy = b.y - a.y + (Math.random() - .5) * 10, arc = -60 - Math.random() * 60;
      const anim = el.animate([
        { transform: 'translate(-50%,-50%) scale(.5)', opacity: 0 },
        { transform: `translate(calc(-50% + ${dx * .45}px), calc(-50% + ${dy * .45 + arc}px)) scale(1.15)`, opacity: 1, offset: .45 },
        { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(.6)`, opacity: .3 }
      ], { duration: 620 + i * 55, delay: i * 45, easing: 'cubic-bezier(.3,.7,.4,1)', fill: 'forwards' });
      anim.onfinish = () => el.remove(); setTimeout(() => el.remove(), 1600);
    }
  }
  /** Shake an element (a blocked move) */
  function shake(el) { if (typeof el === 'string') el = document.querySelector(el); if (!el || calm()) return; el.classList.remove('fx-shake'); void el.offsetWidth; el.classList.add('fx-shake'); setTimeout(() => el.classList.remove('fx-shake'), 450); }
  function pulse(el) { if (typeof el === 'string') el = document.querySelector(el); if (!el || calm()) return; el.classList.remove('fx-pulse'); void el.offsetWidth; el.classList.add('fx-pulse'); }

  /* ---------- breaking news ---------- */
  const THEMES = {
    cacao: { sound: 'storm', bits: ['🌧️', '💧', '⛈️', '💧'], cls: 'storm' },
    sugar: { sound: 'harvest', bits: ['🌾', '💨', '🌾', '☀️'], cls: 'harvest' },
    halloween: { sound: 'spooky', bits: ['🎃', '🦇', '👻', '🍬'], cls: 'spooky' },
    pocket: { sound: 'money', bits: ['💵', '💰', '💵'], cls: 'money' },
    factory: { sound: 'factory', bits: ['🏭', '⚙️', '📦'], cls: 'factory' },
    health: { sound: 'health', bits: ['🥗', '🍎', '🥦'], cls: 'health' },
    round: { sound: null, bits: ['✨', '⭐', '✨'], cls: 'round' },
    reveal: { sound: null, bits: ['🎉', '✨', '✉️', '⭐'], cls: 'money' }
  };
  let newsT = null;
  /** Full-screen headline. o: {icon, title, detail, vi, theme, ms, kicker, sound} */
  function news(o) {
    const th = THEMES[o.theme] || THEMES.round, quiet = calm();
    let el = document.getElementById('fxNews');
    if (!el) { el = document.createElement('div'); el.id = 'fxNews'; document.body.appendChild(el); el.onclick = () => el.classList.add('hidden'); }
    el.className = 'fx-news ' + th.cls + (quiet ? ' calm' : '');
    const bits = quiet ? '' : Array.from({ length: 18 }, (_, i) => `<span class="fx-bit" style="left:${(i * 37 + 7) % 100}%;animation-delay:${(i % 6) * .18}s;animation-duration:${2.2 + (i % 4) * .5}s">${th.bits[i % th.bits.length]}</span>`).join('');
    el.innerHTML = `<div class="fx-bits">${bits}</div><div class="fx-news-strip"><span>${h(o.kicker || 'BREAKING NEWS · TIN NÓNG')}</span></div>
      <div class="fx-news-body"><div class="fx-news-icon">${o.icon || '📣'}</div><div class="fx-news-title">${h(o.title)}</div>${o.vi ? `<div class="fx-news-vi">${h(o.vi)}</div>` : ''}${o.detail ? `<div class="fx-news-detail">${h(o.detail)}</div>` : ''}<div class="fx-news-tap">Tap to close</div></div>`;
    el.classList.remove('hidden');
    if (o.sound !== false) { snd('news'); if (th.sound) setTimeout(() => snd(th.sound), 550); }
    clearTimeout(newsT); newsT = setTimeout(() => el.classList.add('hidden'), o.ms || 4500);
  }

  /* ---------- badges and promotions ---------- */
  const popQ = []; let popBusy = false;
  function pop(icon, head, title, sub, sound) {
    popQ.push({ icon, head, title, sub, sound }); if (!popBusy) nextPop();
  }
  function nextPop() {
    const x = popQ.shift(); if (!x) { popBusy = false; return; }
    popBusy = true;
    const el = document.createElement('div'); el.className = 'fx-pop' + (calm() ? ' calm' : '');
    el.innerHTML = `<div class="fx-pop-icon">${x.icon}</div><div><div class="fx-pop-head">${h(x.head)}</div><div class="fx-pop-title">${h(x.title)}</div>${x.sub ? `<div class="fx-pop-sub">${h(x.sub)}</div>` : ''}</div>`;
    document.body.appendChild(el);
    if (x.sound) snd(x.sound);
    if (!calm() && typeof confetti === 'function') confetti(40);
    setTimeout(() => { el.classList.add('out'); setTimeout(() => { el.remove(); nextPop(); }, 300); }, 2600);
  }
  /** New badge: icon, name, what it is for. sound: name of the sound, or false */
  const badge = (icon, name, desc, sound = 'badge') => pop(icon, 'New badge', name, desc, sound);
  function levelUp(t, sound = 'levelup') { pop(t.icon, 'New title', t.en, t.vi, sound); }

  /* ---------- prize jar (sweets) or coin jar (points) ---------- */
  const SWEET_COLS = ['#e74c3c', '#f1c40f', '#2ecc71', '#3498db', '#9b59b6', '#e67e22', '#ff6fa8'];
  /** SVG jar with n sweets. opt: {key, kind:'sweet'|'coin', cap, label} */
  function jar(n, opt = {}) {
    n = Math.max(0, Math.round(n || 0));
    const key = 'jar:' + (opt.key || 'jar'), cap = opt.cap || 36, shown = Math.min(n, cap);
    const el = since(key, n), prev = fromOf(key);
    const fresh = el < 1600 && prev != null && n > prev && !calm() ? Math.min(n - prev, 12, shown) : 0;
    const coin = opt.kind === 'coin', per = 6, r = 7.2;
    let s = '';
    for (let i = 0; i < shown; i++) {
      const row = Math.floor(i / per), col = i % per, off = row % 2 ? 6 : 0;
      const inRow = Math.min(per, shown - row * per), x = 65 + (col - (inRow - 1) / 2) * 14 + (row % 2 ? 3 : -3), y = 124 - row * 12.5;
      const isNew = i >= shown - fresh, st = isNew ? late(el, (i - (shown - fresh)) * 70) : '';
      s += coin ? `<g class="${isNew ? 'fx-drop' : ''}" style="${st}"><circle cx="${x}" cy="${y}" r="${r}" fill="#e9b32a" stroke="#a87412" stroke-width="1.6"/><text x="${x}" y="${y + 3}" font-size="8" font-weight="800" text-anchor="middle" fill="#7a5408">đ</text></g>`
        : `<g class="${isNew ? 'fx-drop' : ''}" style="${st}"><path d="M${x - r - 4} ${y - 3} l4 3 -4 3z M${x + r + 4} ${y - 3} l-4 3 4 3z" fill="${SWEET_COLS[(i * 3) % 7]}" opacity=".8"/><circle cx="${x}" cy="${y}" r="${r}" fill="${SWEET_COLS[(i * 3) % 7]}"/><path d="M${x - 4} ${y - 2} q4 -4 8 0" stroke="#fff" stroke-width="1.6" fill="none" opacity=".7"/></g>`;
    }
    const lab = opt.label != null ? opt.label : (coin ? `${n} point${n === 1 ? '' : 's'}` : `${n} sweet${n === 1 ? '' : 's'}`);
    return `<div class="fx-jar ${opt.size || ''}" ${fresh ? 'data-fresh="1"' : ''}><svg viewBox="0 0 130 150" role="img" aria-label="${h(lab)}">
      <rect x="34" y="6" width="62" height="14" rx="5" fill="${coin ? '#5b3826' : '#d8a21f'}"/>
      <path d="M30 22 h70 q8 0 8 10 v6 q10 6 10 20 v68 q0 16 -16 16 h-64 q-16 0 -16 -16 v-68 q0 -14 10 -20 v-6 q0 -10 8 -10z" fill="rgba(200,225,240,.25)" stroke="var(--muted)" stroke-width="2.5"/>
      <g>${s}</g>${n > cap ? `<text x="65" y="40" font-size="14" font-weight="800" text-anchor="middle" fill="var(--ink)">+${n - cap}</text>` : ''}
      <path d="M22 60 q-3 30 0 60" stroke="#fff" stroke-width="4" opacity=".45" fill="none" stroke-linecap="round"/></svg><div class="fx-jar-lab">${h(lab)}</div></div>`;
  }
  const jarGrew = html => html.includes('data-fresh="1"');

  /* ---------- tap-to-price tag ---------- */
  /** o: {key, val, min, max, fmt, minus, plus (attribute strings for the − and + buttons), label, sub, role} */
  function priceTag(o) {
    const fmt = o.fmt || (v => v), min = Math.min(o.min, o.val), max = Math.max(o.max, o.val);

      <div class="fx-tag-row"><button type="button" class="fx-step" ${o.minus} aria-label="Lower price">−${o.stepLabel || ''}</button>
        <div class="fx-tag-card"><span class="fx-hole"></span><b class="fx-tag-val" data-fx-val="${h(o.key)}">${fmt(o.val)}</b>${o.sub ? `<small>${o.sub}</small>` : ''}</div>
        <button type="button" class="fx-step" ${o.plus} aria-label="Raise price">+${o.stepLabel || ''}</button></div>
      ${max > min ? `<input type="range" class="fx-range" min="${min}" max="${max}" step="1" value="${o.val}" data-fx-range="${h(o.key)}" aria-label="Price">
      <div class="fx-range-ends"><span>${fmt(min)}</span><span>${fmt(max)}</span></div>` : ''}</div>`;
  }
  let rangeFn = null, holding = false, deferred = new Set();
  const onRange = fn => { rangeFn = fn; };
  document.addEventListener('input', e => { const r = e.target.closest && e.target.closest('.fx-range'); if (r && rangeFn) rangeFn(r.dataset.fxRange, +r.value, false, r); });
  document.addEventListener('change', e => { const r = e.target.closest && e.target.closest('.fx-range'); if (r && rangeFn) rangeFn(r.dataset.fxRange, +r.value, true, r); });

// demand map / supply map: {price: quantity} for the prices asked so far
// A.ans[pid][k] = quantity chosen at step k. A missed step carries the last answer forward.
function qtyAt(ans, k) { if (!ans) return 0; for (let j = k; j >= 0; j--) if (ans[j] != null) return ans[j]; return 0; }

  return map;
}
function crossing(dMap, sMap) {

  if (prices.length < 2) return null;
  for (const p of prices) if (dMap[p] === sMap[p] && dMap[p] > 0) return { exact: p, q: dMap[p] };
  for (let i = 0; i < prices.length - 1; i++) {
    const a = prices[i], b = prices[i + 1];
    if (dMap[a] > sMap[a] && dMap[b] < sMap[b]) {

      const ga = dMap[a] - sMap[a], gb = dMap[b] - sMap[b], f = ga / (ga - gb);

}
const predCorrect = (c, p) => !!c && (c.exact != null ? p === c.exact : c.lo != null ? (p === c.lo || p === c.hi) : false);
function crossText(c) {

  if (c.exact != null) return `The curves cross at ${vnd(c.exact)}. Quantity demanded and quantity supplied are both ${c.q}.`;
  if (c.lo != null) return `The curves cross between ${vnd(c.lo)} and ${vnd(c.hi)}, at about ${vnd(Math.round(c.p))}, where about ${Math.round(c.q)} are bought and sold.`;
  return c.none === 'shortage' ? `The curves don't cross at any price we asked. At every price, quantity demanded is greater than quantity supplied, so the market price would be above ${vnd(c.max)}. Ask: would anyone sell at a higher price?` : `The curves don't cross at any price we asked. At every price, quantity supplied is greater than quantity demanded, so the market price would be below ${vnd(c.min)}. Ask: would anyone buy at a lower price?`;
}

function tSend(m) { T.tr && T.tr.send({ ...m, from: 'teacher', room: T.s.room }); }
function tOnMsg(m) {
  if (!m || m.from === 'teacher') return;
  if (m.type === 'whois') return tBroadcast(true); // the join page asking which lesson this room is
  const s = T.s;
  if (m.type === 'hello') {
    if (!s.humans.find(h => h.pid === m.pid)) { s.humans.push({ pid: m.pid, nick: String(m.nick || 'Student').slice(0, 18), at: Date.now() }); Sound.play('blip'); }
    if (s.prof[m.pid] == null) s.prof[m.pid] = s.nextProf++;
    { const hu = human(m.pid); if (FX.AVATARS.includes(m.av)) hu.av = m.av; if (FX.TEAMS[m.team]) hu.team = m.team; }
    if (s.classOpened) award(m.pid, 'classopen');
    tSave(); renderTBody(); tYou(m.pid); tBroadcast(true); return;
  }
  if (!s.humans.find(h => h.pid === m.pid)) return;
  if (m.type === 'vote') {
    const A = s[m.kind];
    if (s.act !== m.kind || m.step !== A.step) return tSend({ type: 'ack', to: m.pid, ok: false, error: 'This question has closed. Look at the new price.' });
    const i = s.prof[m.pid], max = m.kind === 'demand' ? 2 : sellerCard(G(), i).cap;
    const q = Math.max(0, Math.min(max, Math.round(Number(m.qty) || 0)));
    const mine = (A.ans[m.pid] ||= {});
    if (mine[m.step] == null) addPoints(m.pid, 1);
    mine[m.step] = q;
    award(m.pid, 'opening');
    Sound.play('blip');
  } else if (m.type === 'pred') {
    if (!s.meet.open || s.meet.revealed) return;
    s.meet.preds[m.pid] = m.price; Sound.play('blip');
  } else if (m.type === 'award') {
    if (m.points) addPoints(m.pid, Math.max(0, Math.min(20, m.points | 0)));
    if (m.badge && BADGES[m.badge]) award(m.pid, m.badge);
    if (m.progress) (s.progress[m.pid] ||= {})[m.progress.kind] = { done: m.progress.done, total: m.progress.total, score: m.progress.score };
    if (m.points) Sound.play('cash');

    const mode = m.mode === 'pre' ? 'pre' : 'post';
    ((s.checks ||= {})[mode] ||= {})[m.pid] = { score: m.score | 0, total: m.total | 0, items: (m.items || []).slice(0, 12).map(x => ({ id: String(x.id), correct: !!x.correct })), at: Date.now() };
    Sound.play('chime');

    (s.texts ||= {})[m.pid] = { text: String(m.text || '').slice(0, 1500), at: Date.now() };
  }
  checkClassBadge();
  tSave(); tYou(m.pid); tBroadcast(); renderLive();
}

function curveBadges() {
  const s = T.s, g = G(), n = g.ladder.length;

  s.humans.forEach(h => {

    if (s.done.supply && all(sa) && sOrd.every((p, k) => sa[k] === smartMake(sellerCard(g, i), p))) award(h.pid, 'profitmaker');

const BLUEPRINT = { def: 1, sum: 1, law: 2, eq: 1, gap: 2, cost: 1, data: 2 };
const CHECK_LABELS = Object.fromEntries(QBANK.map(q => [q[1], q[3]]).concat([['x1', 'Class data: equilibrium'], ['x2', 'Class data: shortage']]));

// Two questions built from the class's own schedule (if both curves are complete)
function dataQuestions(pub) {
  const g = GOODS[pub.good], d = pub.demand.map, s = pub.supply.map;
  if (!pub.done || !pub.done.demand || !pub.done.supply) return [];
  const prices = g.ladder.filter(p => d[p] != null && s[p] != null);
  const rows = prices.map(p => [p, d[p], s[p]]);
  const table = tbl(rows, ['Price (thousand đồng)', 'Quantity demanded', 'Quantity supplied']);
  const out = [], c = crossing(d, s);
  if (c && (c.exact != null || c.lo != null)) {
    let right, wrong;
    if (c.exact != null) { right = vnd(c.exact); wrong = prices.filter(p => p !== c.exact).sort((a, b) => Math.abs(a - c.exact) - Math.abs(b - c.exact)).slice(0, 2).map(vnd).concat([vnd(prices.reduce((a, p) => Math.abs(d[p] - s[p]) > Math.abs(d[a] - s[a]) ? p : a, prices[0]))]); }
    else { const pair = (a, b) => `Between ${vnd(a)} and ${vnd(b)}`; right = pair(c.lo, c.hi); const i = prices.indexOf(c.lo); wrong = [[i - 1, i], [i + 1, i + 2], [0, prices.length - 1]].filter(([a, b]) => prices[a] != null && prices[b] != null && a !== i).map(([a, b]) => pair(prices[a], prices[b])); }
    wrong = [...new Set(wrong)].filter(w => w !== right).slice(0, 3);
    while (wrong.length < 3) wrong.push(['A price where demand is highest', 'A price where supply is highest', 'There is no equilibrium'][wrong.length]);
    out.push(['data', 'x1', '2.4.2', CHECK_LABELS.x1, 'This is your class\'s market schedule. Where is the equilibrium price?' + table, [right, ...wrong],
      c.exact != null ? `Quantity demanded equals quantity supplied (${c.q}) at ${vnd(c.exact)}.` : `Demand is greater than supply at ${vnd(c.lo)} but less than supply at ${vnd(c.hi)}, so the curves cross between them.`]);
  }
  const low = prices.find(p => d[p] > s[p]);
  if (low != null) {
    const gap = d[low] - s[low];
    out.push(['data', 'x2', '2.4.3', CHECK_LABELS.x2, `Using your class's schedule, what is there at ${vnd(low)}?` + table,
      [`A shortage of ${gap}`, `A surplus of ${gap}`, `A shortage of ${d[low] + s[low]}`, 'Equilibrium'],
      `At ${vnd(low)}, quantity demanded (${d[low]}) is greater than quantity supplied (${s[low]}): a shortage of ${gap}.`]);
  }
  return out;
}
function buildPaper(pub) {
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const bp = { ...BLUEPRINT }, data = dataQuestions(pub).slice(0, bp.data);
  if (data.length < bp.data) { bp.eq += 1; if (data.length === 0) bp.sum += 1; }
  const pick = [];
  Object.entries(bp).forEach(([cat, n]) => { if (cat !== 'data') pick.push(...shuffle(QBANK.filter(q => q[0] === cat)).slice(0, n)); });
  pick.push(...data);
  const order = ['def', 'sum', 'law', 'eq', 'data', 'gap', 'cost'];
  pick.sort((a, b) => order.indexOf(a[0]) - order.indexOf(b[0]));
  return { qs: pick.map(q => ({ id: q[1], ref: q[2], text: q[4], opts: shuffle(q[5].map((t, i) => ({ t, ok: i === 0 }))), why: q[6] })), ans: {}, submitted: false, started: Date.now() };
}

function tickCheck() {

function checkClick(b) {
  const mode = S.pub.checkMode || 'post', P = S.check[mode];

    if (P.submitted) return;
    const i = +b.dataset.i, k = +b.dataset.k;

    $$(`#mcq-${i} .mopt`).forEach((x, j) => x.classList.toggle('sel', j === k));
    const cnt = $('.paper .row .muted:last-child'); if (cnt) cnt.textContent = `${Object.keys(P.ans).length} of ${P.qs.length} answered`;
  } else if (b.dataset.s === 'cksubmit') {
    const missing = P.qs.length - Object.keys(P.ans).length;
    if (missing && !confirm(`You have ${missing} unanswered question${missing > 1 ? 's' : ''}. Submit anyway?`)) return;
    P.submitted = true; clearInterval(S.ckTimer);
    const items = P.qs.map((q, i) => ({ id: q.id, correct: P.ans[i] != null && q.opts[P.ans[i]].ok }));
    const score = items.filter(x => x.correct).length;
    sSend({ type: 'check', mode, score, total: P.qs.length, items });
    if (mode === 'post') sSend({ type: 'award', points: score * 2, badge: score === P.qs.length ? 'perfect' : null });
    if (mode === 'post' && score >= 8) sSend({ type: 'award', badge: 'examready' });
    sfx(score >= 8 ? 'fanfare' : 'chime'); if (score >= 8) confetti();

  }
}

function checkStats(mode) {
  const res = (T.s.checks || {})[mode] || {}, byQ = {};
  Object.values(res).forEach(r => r.items.forEach(it => { const q = (byQ[it.id] ||= { n: 0, ok: 0 }); q.n++; if (it.correct) q.ok++; }));
  const scores = Object.values(res).map(r => r.score / r.total);
  return { res, byQ, n: scores.length, avg: scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : null };
}
function checkPanelHtml() {
  const s = T.s, mode = s.checkMode || 'post', st = checkStats(mode), pre = checkStats('pre');

  return `<div class="stack"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${mode === 'pre' ? 'Diagnostic check' : 'Knowledge check'}: ${st.n} of ${nHumans()} submitted</h3>

function checkCsv() {

/* ---------------- Profile decisions ---------------- */
const myBuyer = () => buyerCard(GOODS[S.pub.good], (S.me || {}).prof || 0);
const mySeller = () => sellerCard(GOODS[S.pub.good], (S.me || {}).prof || 0);
const tick = ok => ok ? '<span class="ok">✓</span>' : '<span class="no">✗</span>';
function buyerDecision(g, p, chosen) {
  const c = myBuyer();
  const rows = [[1, c.v1], [2, c.v2]].map(([n, v]) => `<tr><td>${n === 1 ? '1st' : '2nd'} ${esc(g.unit1)} today</td><td>${vnd(v)}</td><td>${tick(v > p)} ${v > p ? 'worth more than the price' : 'worth less than the price'}</td></tr>`).join('');
  const btn = n => { const afford = n * p <= c.budget; return `<button class="btn qty ${chosen === n ? 'sel' : ''}" data-s="qty" data-q="${n}" ${afford ? '' : 'disabled'}>${n}<small>${n === 0 ? 'none' : afford ? vnd(n * p) : 'over budget'}</small><kbd>${n}</kbd></button>`; };
  return `<div class="panel stack ask-mini demand">
    ${(() => { const el = FX.since('l0basket' + p, chosen ?? -1); return FX.wallet({ name: c.name, avatar: FX.avOf(S.av), sub: `Your buyer card. It stands for ${CUSTOMERS_PER_CARD} customers like you.`,
      items: [{ label: `${term('budget', 'Budget')} today`, art: '<span class="purse">👛</span>', worth: vnd(c.budget), tag: 'budget' }],
      basket: Array.from({ length: chosen || 0 }, (_, i) => ({ art: ART[S.pub.good], fresh: i === chosen - 1 && el < 900 ? el : null })), empty: chosen === 0 ? 'You chose to buy none' : 'Choose how many to buy' }); })()}
    <h2 style="margin-bottom:0">${esc(g.name.charAt(0).toUpperCase() + g.name.slice(1))} costs ${vnd(p)} today. How many will you buy?</h2>
    <div class="table-wrap"><table class="helper"><tr><th></th><th>Your ${term('satisfaction')}</th><th>Price ${vnd(p)}</th></tr>${rows}</table></div>
    <div class="yn three">${[0, 1, 2].map(btn).join('')}</div>
    <!--check-->
    <p class="muted" style="margin:0">${chosen != null ? 'Saved. You can change it until the next price.' : 'Buy an item only if your satisfaction is worth more than the price, and you can afford it.'}</p></div>`;
}
function sellerDecision(g, p, chosen) {
  const c = mySeller(), per = p - c.cost;
  const opts = sellerChoices(c);
  const rows = opts.map(q => { const prof = q * per - c.rent; return `<tr class="${chosen === q ? 'cur' : ''}"><td>Make ${q}</td><td>${q ? (per >= 0 ? '+' : '') + vnd(q * per) : vnd(0)}</td><td>${vnd(c.rent)}</td><td><b>${prof >= 0 ? '' : '−'}${vnd(Math.abs(prof))}</b></td></tr>`; }).join('');
  return `<div class="panel stack ask-mini supply">
    ${FX.stall({ name: c.name, color: '#b02a3f', avatars: FX.avOf(S.av), sub: 'Your business card',

function makeDeals() {
  const v1 = ri(9, 11), c1 = ri(3, 5), c2 = ri(3, 5), v2 = ri(9, 11), v3 = ri(5, 6), c3 = v3 + 2;
  const mk = (role, card, rLimit, start, floorOrCeil, open) => ({ role, card, rLimit, robot: start, bound: floorOrCeil, round: 0, status: 'open', price: null, gain: null, mine: role === 'buyer' ? Math.max(1, card - 4) : Math.min(14, card + 4), log: [{ who: 'r', text: open }] });
  return { i: 0, list: [
    mk('buyer', v1, c1, c1 + 6, c1 + 1, `Hello! I'm selling ${gName()} for ${tok(c1 + 6)}.`),
    mk('seller', c2, v2, v2 - 6, v2 - 1, `Hello! I'd like to buy your ${GOODS[S.pub.good].unit1}. I'll pay ${tok(v2 - 6)}.`),
    mk('buyer', v3, c3, c3 + 3, c3, `Hello! Very special ${GOODS[S.pub.good].name} for sale. Only ${tok(c3 + 3)}.`)
  ] };
}
function renderDeal(main) {
  const D = S.deals, n = D.list.length;
  if (D.i >= n) {
    const tot = D.list.reduce((a, d) => a + Math.max(0, d.gain || 0), 0);
    main.innerHTML = `<div class="panel stack"><h2 style="margin:0">All deals done</h2><p style="margin:0">Total gain and profit: <b>${tok(tot)}</b>.</p>
      <div class="table-wrap"><table><tr><th>Deal</th><th>You were</th><th>Result</th></tr>${D.list.map((d, k) => `<tr><td>${k + 1}</td><td>${d.role === 'buyer' ? 'Buyer' : 'Seller'}</td><td>${d.status === 'deal' ? (d.role === 'buyer' ? 'Bought' : 'Sold') + ' at ' + tok(d.price) + ', +' + tok(d.gain) : d.status === 'walk' ? 'Walked away' : 'No deal'}</td></tr>`).join('')}</table></div>
      <p class="muted" style="margin:0">In Level 1, you will trade with the whole class instead of one robot.</p></div>`;
    return;
  }
  const d = D.list[D.i], buyer = d.role === 'buyer', open = d.status === 'open';
  const canAccept = open && (buyer ? d.robot <= d.card : d.robot >= d.card);
  const chatHtml = `<div class="chat" id="chat">${d.log.map(m => `<div class="msg ${m.who}">${m.who === 'r' ? '<span class="who">🤖 Robo-Trader</span>' : '<span class="who">You</span>'}${esc(m.text)}</div>`).join('')}</div>`;
  const controls = open ? `
      <button class="btn block ${buyer ? 'buyer' : 'seller'}" data-s="daccept" ${canAccept ? '' : 'disabled'}>${canAccept ? `${buyer ? 'Buy' : 'Sell'} at ${tok(d.robot)} <kbd>A</kbd>` : buyer ? `${tok(d.robot)} is more than it's worth to you` : `${tok(d.robot)} is less than your cost`}</button>
      <div><label class="field">${buyer ? 'Or offer a lower price' : 'Or ask for a higher price'}</label>
        ${FX.priceTag({ key: 'd', val: d.mine, min: buyer ? 1 : d.card, max: buyer ? d.card : 14, fmt: tok, stepLabel: tk(1), minus: 'data-s="dminus"', plus: 'data-s="dplus"', role: buyer ? 'buyer' : 'seller', sub: buyer ? 'your offer' : 'your asking price' })}
        ${dealLine(d.role, d.card, [d.mine], null, true, { fmt: tk })}</div>
      <div class="row"><button class="btn primary" data-s="doffer">${buyer ? 'Offer' : 'Ask for'} <span data-fx-val="d">${tok(d.mine)}</span> <kbd>Enter</kbd></button><button class="btn" data-s="dwalk">Walk away <kbd>W</kbd></button></div>`
    : `<div class="${dealVerdict(d).cls}">${dealVerdict(d).text}</div><button class="btn primary" data-s="dnext">${D.i + 1 < n ? 'Next deal' : 'See results'} <kbd>Enter</kbd></button>`;
  main.innerHTML = `<div class="panel stack"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Deal ${D.i + 1} of ${n}</h2><span class="muted">${buyer ? 'You are buying' : 'You are selling'}</span></div>
    <div class="deal-grid"><div class="stack">${barCard(d.role, d.card)}${controls}</div>${chatHtml}</div></div>`;
  const chat = $('#chat'); if (chat) chat.scrollTop = chat.scrollHeight;
}
function dealVerdict(d) {
  const buyer = d.role === 'buyer', possible = buyer ? d.rLimit < d.card : d.rLimit > d.card;
  if (d.status === 'deal') return { cls: 'good', text: `${buyer ? 'You bought' : 'You sold'} at ${tok(d.price)}. ${buyer ? 'Gain' : 'Profit'}: ${tok(d.gain)}. ${d.gain >= 3 ? 'Great bargaining.' : 'A deal where you both gain. Could you have bargained more?'}` };
  if (d.status === 'walk' && !possible) return { cls: 'good', text: `Smart. Robo-Trader would never sell below ${tok(d.rLimit)}, but it is worth only ${tok(d.card)} to you. Any deal would lose you money. No trade is the right result.` };
  if (d.status === 'walk') return { cls: 'note', text: `You walked away. A deal was possible: Robo-Trader would have ${buyer ? 'sold' : 'bought'} for ${tok(d.rLimit + (buyer ? 1 : -1))}. Next time, keep bargaining.` };
  return { cls: possible ? 'note' : 'good', text: possible ? 'Robo-Trader left. A deal was possible, so try to meet in the middle sooner.' : `No deal. Robo-Trader's lowest price was ${tok(d.rLimit)}, more than it is worth to you. No trade was the right result.` };
}
function dealAction(a) {
  const D = S.deals, d = D.list[D.i], buyer = d.role === 'buyer';
  if (a === 'dnext') { D.i++; sSave(); return renderDeal($('#sMain')); }
  if (d.status !== 'open') return;
  if (a === 'dminus' || a === 'dplus') {
    d.mine = Math.max(1, Math.min(14, d.mine + (a === 'dplus' ? 1 : -1)));
    if (buyer && d.mine > d.card) { d.mine = d.card; toast(`It's worth ${tok(d.card)} to you. You can't offer more.`); sfx('bonk'); }
    if (!buyer && d.mine < d.card) { d.mine = d.card; toast(`It costs you ${tok(d.card)}. You can't ask for less.`); sfx('bonk'); }
    return renderDeal($('#sMain'));
  }
  const close = (price) => { d.status = 'deal'; d.price = price; d.gain = buyer ? d.card - price : price - d.card; d.log.push({ who: 'r', text: `Deal! ${tok(price)}.` }); sfx('coin'); finishDeal(); FX.float('+' + tok(d.gain), '#sMain .deal-grid', d.gain > 0 ? 'good' : 'bad'); };
  if (a === 'daccept') { d.log.push({ who: 'y', text: `OK, I ${buyer ? 'will buy' : 'will sell'} at ${tok(d.robot)}.` }); return close(d.robot); }
  if (a === 'dwalk') { d.log.push({ who: 'y', text: 'No thanks. I am walking away.' }); d.status = 'walk'; d.log.push({ who: 'r', text: 'OK. Maybe next time!' }); return finishDeal(); }
  if (a === 'doffer') {
    const p = d.mine; d.round++;
    d.log.push({ who: 'y', text: buyer ? `I'll pay ${tok(p)}.` : `I want ${tok(p)}.` });
    if (buyer) {
      if (p >= d.robot) return close(d.robot);
      if (p < d.rLimit) { d.robot = Math.max(d.bound, d.robot - 1); d.log.push({ who: 'r', text: `That's less than it costs me to make. ${d.robot === d.bound ? `My lowest price is ${tok(d.robot)}.` : `I can do ${tok(d.robot)}.`}` }); }
      else if (p >= d.bound && d.round >= 3) return close(p);
      else { d.robot = Math.max(d.bound, d.robot - 1); d.log.push({ who: 'r', text: d.robot === d.bound ? `${tok(d.robot)} is my lowest price.` : `Hmm. How about ${tok(d.robot)}?` }); }
    } else {
      if (p <= d.robot) return close(d.robot);
      if (p > d.rLimit) { d.robot = Math.min(d.bound, d.robot + 1); d.log.push({ who: 'r', text: `That's more than it's worth to me. ${d.robot === d.bound ? `${tok(d.robot)} is my best offer.` : `I can pay ${tok(d.robot)}.`}` }); }
      else if (p <= d.bound && d.round >= 3) return close(p);
      else { d.robot = Math.min(d.bound, d.robot + 1); d.log.push({ who: 'r', text: d.robot === d.bound ? `${tok(d.robot)} is my best offer.` : `OK, I can pay ${tok(d.robot)}.` }); }
    }
    sfx('blip');
    if (d.round >= 7) { d.status = 'robot'; d.log.push({ who: 'r', text: 'I have to go. No deal today.' }); return finishDeal(); }
    sSave(); renderDeal($('#sMain'));
  }
}
function finishDeal() {
  const D = S.deals, d = D.list[D.i];
  const possible = d.role === 'buyer' ? d.rLimit < d.card : d.rLimit > d.card;
  let pts = d.status === 'deal' ? Math.max(0, d.gain) : 0, badge = null;
  if (d.status === 'walk' && !possible) { pts = 3; badge = 'walkaway'; }
  if (!badge && D.list[0].status === 'deal' && D.list[1].status === 'deal' && D.list[0].gain > 0 && D.list[1].gain > 0 && D.i === 1) badge = 'haggler';
  if (pts && !badge) sfx('chime');
  const done = D.list.filter(x => x.status !== 'open').length;
  sSend({ type: 'award', points: pts, badge, progress: { kind: 'deals', done, total: D.list.length } });
  sSave(); renderDeal($('#sMain'));
}

/* ---------------- Home and boot ---------------- */
function homeBoot() { location.replace('index.html' + (PARAMS.get('t') ? '?t=' + PARAMS.get('t') : '')); }
(function boot() {
  const mode = PARAMS.get('mode') || (PARAMS.get('room') ? 'student' : 'home');
  if (mode === 'teacher') teacherBoot(); else if (mode === 'student') studentBoot(); else homeBoot();
})();

</script>
