<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chợ Lớp 9 trading floor: EcoLogic Market Lab Level 1</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤝</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root {
  --cocoa: #3a2217;
  --cocoa-2: #5b3826;
  --ink: #23170f;
  --muted: #6d6158;
  --paper: #f3f4f7;
  --panel: #ffffff;
  --line: #dcd8de;
  --foil: #d8a21f;
  --foil-2: #f2cf6b;
  --buyer: #12648c;
  --buyer-soft: #e2eff6;
  --seller: #b02a3f;
  --seller-soft: #f8e5e8;
  --mint: #22805a;
  --mint-soft: #e1f2e9;
  --warn: #9a5b00;
  --warn-soft: #fbf0dc;
  --shadow: 0 1px 2px rgba(35, 23, 15, .08), 0 6px 18px rgba(35, 23, 15, .06);
  --r-sm: 8px;
  --r-md: 14px;
  --buyer-card: #12648c;
  --seller-card: #b02a3f;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --font-display: "Bricolage Grotesque", "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #f3ebe4; --muted: #b8aca2; --paper: #17120f; --panel: #221b16; --line: #3c322b;
    --buyer: #5fb3dc; --buyer-soft: #16303d; --seller: #ec7a8c; --seller-soft: #3d1c22;
    --mint: #5cc79a; --mint-soft: #16332a; --warn: #f0b85a; --warn-soft: #3a2c12;
    --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #f3ebe4; --muted: #b8aca2; --paper: #17120f; --panel: #221b16; --line: #3c322b;
  --buyer: #5fb3dc; --buyer-soft: #16303d; --seller: #ec7a8c; --seller-soft: #3d1c22;
  --mint: #5cc79a; --mint-soft: #16332a; --warn: #f0b85a; --warn-soft: #3a2c12;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  margin: 0; min-height: 100%; background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; margin: 0 0 .4em; letter-spacing: -.01em; }
h1 { font-size: clamp(1.6rem, 4vw, 2.3rem); font-weight: 800; }
h2 { font-size: 1.3rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0 0 .8em; max-width: 68ch; }
small, .muted { color: var(--muted); }
a { color: var(--buyer); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--foil); outline-offset: 2px; }

.wrap { max-width: 1180px; margin: 0 auto; padding: 16px; }
.narrow { max-width: 520px; margin: 0 auto; padding: 16px; }

.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--cocoa); color: #fbf3ea;
}
.topbar .brand { font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; }
.topbar .spacer { flex: 1; }
.topbar .chip { background: rgba(255,255,255,.12); color: #fbf3ea; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px; box-shadow: var(--shadow); }
.panel + .panel { margin-top: 14px; }
.stack > * + * { margin-top: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }

.btn {
  appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 999px; padding: 10px 18px; font-weight: 700; cursor: pointer; min-height: 44px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
}
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--cocoa); border-color: var(--cocoa); color: #fbf3ea; }
:root[data-theme="dark"] .btn.primary { background: var(--foil); border-color: var(--foil); color: #23170f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { background: var(--foil); border-color: var(--foil); color: #23170f; } }
.btn.buyer { background: var(--buyer-card); border-color: var(--buyer-card); color: #fff; }
.btn.seller { background: var(--seller-card); border-color: var(--seller-card); color: #fff; }
.btn.small { min-height: 34px; padding: 5px 12px; font-size: .9rem; }
.btn.block { width: 100%; }
.btn.ghost { background: transparent; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: .88rem; background: var(--paper); border: 1px solid var(--line); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; }
.dot.ok { background: var(--mint); } .dot.bad { background: var(--seller); } .dot.wait { background: var(--foil); }

label.field { display: block; font-weight: 700; margin-bottom: 4px; }
input[type=text], input[type=number], select, textarea {
  width: 100%; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; background: var(--panel); min-height: 44px;
}
textarea { min-height: 120px; resize: vertical; line-height: 1.45; }
.code-input { font-family: var(--font-display); font-size: 1.6rem; letter-spacing: .25em; text-transform: uppercase; text-align: center; }

.note { padding: 10px 12px; border-radius: var(--r-sm); background: var(--warn-soft); color: var(--ink); border-left: 4px solid var(--warn); }
.good { padding: 10px 12px; border-radius: var(--r-sm); background: var(--mint-soft); border-left: 4px solid var(--mint); }
.bad { padding: 10px 12px; border-radius: var(--r-sm); background: var(--seller-soft); border-left: 4px solid var(--seller); }

/* Home */
.home-hero { padding: 40px 0 20px; }
.home-choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.choice { text-align: left; padding: 22px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--panel); cursor: pointer; box-shadow: var(--shadow); }
.choice h2 { margin-bottom: .2em; }

/* The chocolate bar card: the one bold element */
.bar {
  position: relative; border-radius: 16px; overflow: hidden; color: #fff; box-shadow: 0 10px 28px rgba(35,23,15,.25);
  background: var(--buyer-card);
}
.bar.seller { background: var(--seller-card); }
.bar .foil { height: 14px; background: linear-gradient(90deg, var(--foil), var(--foil-2), var(--foil), var(--foil-2)); }
.bar .body { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 16px 18px 18px; }
.bar .role { font-family: var(--font-display); font-size: 1.5rem; font-weight: 800; }
.bar .say { font-size: 1rem; opacity: .95; margin: 2px 0 0; }
.bar .slab {
  width: 112px; height: 112px; border-radius: 10px; display: grid; place-items: center;
  background:
    linear-gradient(var(--cocoa) 0 0) padding-box,
    var(--cocoa);
  background-image:
    linear-gradient(90deg, transparent 47%, rgba(0,0,0,.35) 47% 53%, transparent 53%),
    linear-gradient(0deg, transparent 47%, rgba(0,0,0,.35) 47% 53%, transparent 53%),
    linear-gradient(145deg, var(--cocoa-2), var(--cocoa));
  box-shadow: inset 0 2px 0 rgba(255,255,255,.12), inset 0 -3px 0 rgba(0,0,0,.25);
}
.bar .slab span { font-family: var(--font-display); font-size: 3.4rem; font-weight: 800; color: var(--foil-2); text-shadow: 0 2px 0 rgba(0,0,0,.4); line-height: 1; }
.bar .slab small { display: block; color: #f6e2b0; text-align: center; font-size: .78rem; margin-top: 2px; }

/* Market */
.quotes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.quote { border-radius: var(--r-sm); padding: 10px 12px; border: 1px solid var(--line); background: var(--panel); }
.quote .q-label { font-size: .88rem; color: var(--muted); }
.quote .q-val { font-family: var(--font-display); font-size: 1.8rem; font-weight: 800; }
.quote.bid .q-val { color: var(--buyer); } .quote.ask .q-val { color: var(--seller); }
.stepper { display: grid; grid-template-columns: 56px 1fr 56px; align-items: center; gap: 8px; }
.stepper button { min-height: 56px; border-radius: 12px; font-size: 1.6rem; font-weight: 800; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
.stepper .val { text-align: center; font-family: var(--font-display); font-size: 2.4rem; font-weight: 800; }
.tape { display: flex; flex-wrap: wrap; gap: 6px; }
.tape .chip { font-weight: 700; }
.timer { font-family: var(--font-display); font-weight: 800; font-variant-numeric: tabular-nums; }
.big-timer { font-size: 2.2rem; }

/* Tables */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: right; }
th:first-child, td:first-child { text-align: left; }
th { font-weight: 700; color: var(--muted); font-size: .9rem; }
tr.eq td { background: var(--mint-soft); font-weight: 700; }

/* Teacher stepper */
ol.steps { list-style: none; padding: 0; margin: 0; counter-reset: s; }
ol.steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); }
ol.steps li::before { content: counter(s); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: .9rem; background: var(--paper); border: 1px solid var(--line); }
ol.steps li.done::before { content: "✓"; background: var(--mint); border-color: var(--mint); color: #fff; }
ol.steps li.now::before { background: var(--foil); border-color: var(--foil); color: #23170f; }
ol.steps li .btn { justify-self: start; }

.roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.roster .who { padding: 6px 8px; border-radius: var(--r-sm); border: 1px solid var(--line); font-size: .9rem; display: flex; justify-content: space-between; gap: 6px; }
.roster .who.buyer { border-left: 4px solid var(--buyer); } .roster .who.seller { border-left: 4px solid var(--seller); }
.roster .who.done { background: var(--mint-soft); }

.chart-box { position: relative; width: 100%; aspect-ratio: 16 / 9; min-height: 220px; }
.chart-box canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

/* Projector overlay */
.projector { position: fixed; inset: 0; z-index: 50; background: var(--paper); display: grid; grid-template-columns: 1fr 340px; gap: 20px; padding: calc(16px + env(safe-area-inset-top, 0px)) 20px calc(16px + env(safe-area-inset-bottom, 0px)); }
.projector .chart-box { aspect-ratio: auto; height: 100%; }
.projector .side { display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
.projector .code { font-family: var(--font-display); font-size: 3.4rem; font-weight: 800; letter-spacing: .12em; line-height: 1; }
@media (max-width: 900px) { .projector { grid-template-columns: 1fr; grid-template-rows: 1fr auto; } }

.envelope { border-radius: var(--r-md); padding: 18px; background: var(--cocoa); color: #fbf3ea; text-align: center; }
.envelope .seal { width: 54px; height: 54px; border-radius: 50%; background: var(--foil); margin: 0 auto 8px; display: grid; place-items: center; font-weight: 800; color: #23170f; }
.envelope.open { animation: openup .9s cubic-bezier(.2,.8,.2,1); }
.envelope .pred { font-family: var(--font-display); font-size: 2.2rem; font-weight: 800; color: var(--foil-2); }
@keyframes openup { 0% { transform: rotateX(70deg) scale(.9); opacity: 0; } 100% { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .envelope.open { animation: none; } }

.qr { background: #fff; padding: 8px; border-radius: 8px; width: max-content; }
.qr img, .qr canvas { display: block; }

/* Tasks */
.tier { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; margin: 18px 0 8px; display: flex; align-items: center; gap: 8px; }
.tier .chip { font-family: var(--font-body); font-weight: 400; }
.task { border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px; background: var(--panel); }
.task + .task { margin-top: 10px; }
.task.solved { border-color: var(--mint); }
.task .ref { font-size: .82rem; color: var(--muted); }
.opts { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.opt { min-width: 48px; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font-weight: 700; cursor: pointer; padding: 6px 12px; }
.opt.sel { border-color: var(--cocoa); background: var(--cocoa); color: #fbf3ea; }
.frames { font-size: .95rem; color: var(--muted); margin: 6px 0; padding-left: 18px; }
.plot svg { width: 100%; max-width: 420px; height: auto; touch-action: manipulation; user-select: none; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 8px 14px; font-weight: 700; cursor: pointer; min-height: 40px; }
.seg button.on.d { background: var(--buyer); color: #fff; } .seg button.on.s { background: var(--seller); color: #fff; }

/* Glossary */
.term { border: 0; background: none; padding: 0; font: inherit; color: inherit; text-decoration: underline dotted 2px; text-underline-offset: 3px; cursor: help; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 80; background: var(--panel); border-top: 3px solid var(--foil); padding: 16px 18px calc(18px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -8px 24px rgba(0,0,0,.18); max-width: 640px; margin: 0 auto; border-radius: 16px 16px 0 0; }
.sheet .vi { color: var(--muted); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 90; background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font-weight: 700; max-width: 92vw; text-align: center; }

.poll-bar { height: 12px; border-radius: 6px; background: var(--paper); border: 1px solid var(--line); overflow: hidden; }
.poll-bar > i { display: block; height: 100%; background: var(--foil); }

details summary { cursor: pointer; font-weight: 700; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }
.hidden { display: none !important; }
.topbar .btn.primary { background: var(--foil); border-color: var(--foil); color: #23170f; }
.dot.ok, .dot.bad, .dot.wait { padding: 0; border: 0; border-radius: 50%; width: 9px; height: 9px; }
.dot.bad { background: var(--seller); }

/* ===== Level 0 additions ===== */
.fx { position: fixed; inset: 0; pointer-events: none; z-index: 95; width: 100vw; height: 100vh; }
.lead { font-size: 1.15rem; }
.code-big { font-family: var(--font-display); font-size: 2rem; font-weight: 800; letter-spacing: .12em; line-height: 1.1; }
.art-join { width: 90px; }
.art-join svg, .art svg, .art-big svg { width: 100%; height: auto; display: block; }
kbd { font-family: var(--font-body); font-size: .72em; font-weight: 700; padding: 1px 6px; border-radius: 5px; border: 1px solid currentColor; opacity: .6; margin-left: 4px; }
@media (hover: none) { kbd { display: none; } }

/* student two-column layout for tablets and laptops */
.sgrid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .sgrid { grid-template-columns: 1fr; } }
.ask-mini { position: relative; }
.ask-mini .art { width: 92px; float: right; margin: 0 0 6px 12px; }
.ask-mini.demand { border-top: 6px solid var(--buyer-card); }
.ask-mini.supply { border-top: 6px solid var(--seller-card); }
.yn { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; clear: both; }
.yn .btn { min-height: 72px; font-size: 1.5rem; border-radius: 16px; border-width: 2px; }
.yn .btn.yes.sel { background: var(--mint); border-color: var(--mint); color: #fff; }
.yn .btn.no.sel { background: var(--seller-card); border-color: var(--seller-card); color: #fff; }
.opt.big { min-height: 60px; font-size: 1.15rem; padding: 8px 20px; }
tr.cur td { background: var(--warn-soft); font-weight: 700; }

.bdg { font-size: 1.6rem; line-height: 1; display: inline-block; }
.bdg.off { filter: grayscale(1); opacity: .3; }
.bdg.big { font-size: 2.6rem; }
.badgewall { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.bw { border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; background: var(--panel); }
.bw.locked { opacity: .45; filter: grayscale(1); }
.meter { height: 16px; border-radius: 8px; background: var(--paper); border: 1px solid var(--line); overflow: hidden; margin-top: 4px; }
.meter > i { display: block; height: 100%; background: linear-gradient(90deg, var(--foil), var(--foil-2)); transition: width .6s ease; }
.feed-item { padding: 4px 0; border-bottom: 1px dashed var(--line); }

/* robot deals */
.chat { max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px; }
.msg { max-width: 82%; padding: 8px 12px; border-radius: 14px; background: var(--paper); border: 1px solid var(--line); }
.msg .who { display: block; font-size: .78rem; color: var(--muted); font-weight: 700; }
.msg.y { align-self: flex-end; background: var(--buyer-soft); }
.dline { width: 100%; max-width: 460px; height: auto; display: block; margin: 4px 0; }

/* projector, Level 0 */
.projector.l0 { grid-template-columns: 1fr 320px; }
.pmain { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.news { display: flex; align-items: center; gap: 14px; background: var(--cocoa); color: #fbf3ea; border-radius: var(--r-md); padding: 12px 16px; font-size: clamp(1.05rem, 1.6vw, 1.4rem); }
.news .flag { background: var(--foil); color: #23170f; font-weight: 800; padding: 4px 10px; border-radius: 6px; white-space: nowrap; font-family: var(--font-display); }
.news.slide { animation: slidein .6s cubic-bezier(.2,.8,.2,1); }
@keyframes slidein { from { transform: translateY(-30px); opacity: 0; } to { transform: none; opacity: 1; } }
.pstage { flex: 1; min-height: 0; display: flex; }
.pstage > * { flex: 1; min-height: 0; }
.lobby-stage { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; }
.lobby-stage h1 { font-size: clamp(2rem, 4vw, 3.4rem); }
.art-big { width: clamp(120px, 14vw, 200px); }
.bubbles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 900px; }
.bubble { padding: 6px 14px; border-radius: 999px; background: var(--panel); border: 2px solid var(--foil); font-weight: 700; animation: pop .4s ease; }
.ask-stage { display: grid; grid-template-columns: minmax(260px, 34%) 1fr; gap: 18px; min-height: 0; }
.ask-stage.wide { grid-template-columns: 1fr minmax(240px, 30%); }
.ask-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); padding: 18px; display: flex; flex-direction: column; gap: 10px; overflow: auto; }
.ask-card.demand { border-top: 8px solid var(--buyer-card); } .ask-card.supply { border-top: 8px solid var(--seller-card); }
.ask-card .art { width: 46%; max-width: 170px; align-self: center; }
.ask-card h2 { font-size: clamp(1.3rem, 2.2vw, 2rem); }
.ask-card .story { font-size: 1.05rem; margin: 0; }
.pricetag { align-self: center; font-family: var(--font-display); font-weight: 800; font-size: clamp(2.2rem, 4.5vw, 3.8rem); background: var(--foil); color: #23170f; padding: 4px 22px; border-radius: 14px; transform: rotate(-3deg); box-shadow: 0 6px 0 rgba(0,0,0,.18); }
.yescount { display: flex; align-items: baseline; gap: 10px; justify-content: center; }
.yescount span { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.4rem, 5vw, 4.4rem); line-height: 1; }
.yescount.pop span { animation: pop .35s ease; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
.chart-box.tall { aspect-ratio: auto; height: 100%; min-height: 300px; }
.chart-box.mid { aspect-ratio: 16 / 7; }
.meet-text { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px; overflow: auto; }
.selfpace, .finish { display: flex; flex-direction: column; gap: 12px; overflow: auto; }

.timer.late { color: #e0303a; animation: fxlate 1s steps(2) infinite; }

@media (max-width: 900px) { .topbar #hConn, .topbar #sConn { font-size: 0; gap: 0; padding: 6px 8px; } .topbar .fx-lab { display: none; } }

<!--FX-JS--><script id="fx-js">
/* =====================================================================
   EcoLogic Market Lab: shared game layer (FX), used by every level.
   Sounds are synthesised (no audio files); pictures are drawn in code.
   Every effect is short (under about a second) and can be switched off
   on each device with the ✨ button (or the system "reduce motion" setting).
   ===================================================================== */
const FX = (() => {
  const LS = 'ecologic-market:';
  const get = (k, d) => { try { const v = localStorage.getItem(LS + k); return v == null ? d : JSON.parse(v); } catch { return d; } };
  const set = (k, v) => { try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch { } };
  const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  /* ---------- avatars, teams, titles ---------- */
  const AVATARS = ['🐼', '🦊', '🐯', '🐸', '🐵', '🐨', '🐙', '🦄', '🐲', '🐧', '🦁', '🐰', '🐻', '🐱', '🐶', '🦉', '🐢', '🐬', '🐝', '🦋', '🌟', '🚀', '🎸', '⚽'];
  const TEAMS = {
    r: { icon: '🔴', name: 'Red table', vi: 'Bàn Đỏ', color: '#d64545' },
    b: { icon: '🔵', name: 'Blue table', vi: 'Bàn Xanh dương', color: '#2f74c0' },
    g: { icon: '🟢', name: 'Green table', vi: 'Bàn Xanh lá', color: '#2e9a5c' },
    y: { icon: '🟡', name: 'Yellow table', vi: 'Bàn Vàng', color: '#d9a400' }
  };
  const TITLES = [
    { icon: '🧺', en: 'Street Vendor', vi: 'Người bán rong' },
    { icon: '🛒', en: 'Market Trader', vi: 'Tiểu thương' },
    { icon: '🏪', en: 'Merchant', vi: 'Nhà buôn' },
    { icon: '👑', en: 'Tycoon', vi: 'Đại gia' }
  ];
  const SHOP_COLORS = { A: '#c0392b', B: '#16768a', C: '#7b4fbf', D: '#b86b00', E: '#2a7f4f' };
  const myAvatar = () => { const a = get('avatar', null); return AVATARS.includes(a) ? a : null; };
  const avOf = a => AVATARS.includes(a) ? a : '🙂';
  const teamOf = t => TEAMS[t] || null;

  /** Title from a score and 3 thresholds (for titles 2, 3, 4) */
  function title(score, th) { let i = 0; th.forEach((t, k) => { if (score >= t) i = k + 1; }); return { i, ...TITLES[i] }; }
  const titleMem = {};
  /** Returns the title and celebrates a promotion (not the first time it is seen) */
  function titleWatch(key, score, th, onUp) {
    const t = title(score, th), prev = titleMem[key];

    if (prev != null && t.i > prev) { levelUp(t); onUp && onUp(t); }
    return t;
  }
  const titleChip = t => `<span class="chip fx-title" title="${h(t.vi)}">${t.icon} ${h(t.en)}</span>`;

  /* ---------- sound: extra synthesised sounds added to each level's Sound ---------- */
  let gain = 1, installed = false, gate = null;
  /** Play a sound if this device allows it (students choose; the teacher's switch can mute all students) */
  const snd = (n, o) => { if (typeof Sound === 'undefined' || (gate && !gate())) return; Sound.play(n, o); };
  const EXTRA = {
    coin(c, t, o) { const up = Math.min(6, Math.max(0, (o && o.big) || 0)); [1319, 1760, 2349].slice(0, 2 + (up > 2 ? 1 : 0)).forEach((f, i) => this.note(f * (1 + up * .02), t + i * .055, .16, 'triangle', .06)); },
    bonk(c, t) { this.note(170, t, .2, 'sine', .14, 80); this.note(95, t, .12, 'triangle', .06); },
    tick(c, t) { this.note(1900, t, .03, 'square', .025); },
    tock(c, t) { this.note(1250, t, .04, 'square', .03); },
    pop(c, t) { this.note(520, t, .09, 'sine', .08, 980); },
    jar(c, t) { this.note(2637, t, .08, 'sine', .05); this.note(3136, t + .05, .12, 'sine', .04); },
    badge(c, t) { [1319, 1568, 2093, 2637].forEach((f, i) => this.note(f, t + i * .06, .3, 'sine', .07)); },
    levelup(c, t) { [523, 659, 784, 1047, 1319].forEach((f, i) => this.note(f, t + i * .07, .25, 'square', .035)); this.note(262, t, .5, 'triangle', .06); },

    whoosh(c, t) { noise.call(this, c, t, .45, 400, 3200, .05); },
    storm(c, t) { noise.call(this, c, t, 1.4, 900, 160, .08); this.note(70, t + .2, 1, 'sine', .08, 45); },
    spooky(c, t) { [659, 622, 587, 554].forEach((f, i) => this.note(f, t + i * .18, .3, 'triangle', .05)); this.note(110, t, .9, 'sawtooth', .02); },
    harvest(c, t) { noise.call(this, c, t, .8, 1600, 600, .04); [392, 349, 330].forEach((f, i) => this.note(f, t + .1 + i * .15, .25, 'triangle', .05)); },
    money(c, t) { [1568, 2093, 1568, 2093, 2637].forEach((f, i) => this.note(f, t + i * .06, .1, 'square', .03)); },
    factory(c, t) { [0, .18, .36].forEach(d => { this.note(110, t + d, .12, 'square', .04); noise.call(this, c, t + d, .1, 2000, 800, .04); }); },
    health(c, t) { [523, 659, 784].forEach((f, i) => this.note(f, t + i * .1, .35, 'sine', .07)); },
    podium(c, t) { [[392, 0], [523, .15], [659, .3], [784, .45], [1047, .65]].forEach(([f, d]) => { this.note(f, t + d, .55, 'triangle', .09); this.note(f / 2, t + d, .55, 'sine', .05); }); }
  };
  function noise(c, t, dur, f1, f2, vol) {
    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();

    f.frequency.setValueAtTime(f1, t); f.frequency.exponentialRampToValueAtTime(f2, t + dur);

  }
  /** Call once when the page starts. opts.gain scales every sound (students are quieter than the projector). */
  function install(opts = {}) {
    gain = opts.gain ?? 1; gate = opts.gate || null;
    if (installed || typeof Sound === 'undefined') return; installed = true;
    const note = Sound.note, play = Sound.play;

    };

  const setGain = g => { gain = g; };

  function pt(at) {
    if (!at) return { x: innerWidth / 2, y: innerHeight * .4 };
    if (typeof at === 'string') at = document.querySelector(at);
    if (at && at.getBoundingClientRect) { const r = at.getBoundingClientRect(); if (!r.width && !r.height) return { x: innerWidth / 2, y: innerHeight * .4 }; return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }

  /** Coins flying from one element to another */

  /* ---------- breaking news ---------- */
  const THEMES = {
    cacao: { sound: 'storm', bits: ['🌧️', '💧', '⛈️', '💧'], cls: 'storm' },
    sugar: { sound: 'harvest', bits: ['🌾', '💨', '🌾', '☀️'], cls: 'harvest' },
    halloween: { sound: 'spooky', bits: ['🎃', '🦇', '👻', '🍬'], cls: 'spooky' },
    pocket: { sound: 'money', bits: ['💵', '💰', '💵'], cls: 'money' },
    factory: { sound: 'factory', bits: ['🏭', '⚙️', '📦'], cls: 'factory' },
    health: { sound: 'health', bits: ['🥗', '🍎', '🥦'], cls: 'health' },
    round: { sound: null, bits: ['✨', '⭐', '✨'], cls: 'round' },
    reveal: { sound: null, bits: ['🎉', '✨', '✉️', '⭐'], cls: 'money' }
  };
  let newsT = null;
  /** Full-screen headline. o: {icon, title, detail, vi, theme, ms, kicker, sound} */
  function news(o) {
    const th = THEMES[o.theme] || THEMES.round, quiet = calm();
    let el = document.getElementById('fxNews');
    if (!el) { el = document.createElement('div'); el.id = 'fxNews'; document.body.appendChild(el); el.onclick = () => el.classList.add('hidden'); }

  }

  /* ---------- badges and promotions ---------- */
  const popQ = []; let popBusy = false;
  function pop(icon, head, title, sub, sound) {
    popQ.push({ icon, head, title, sub, sound }); if (!popBusy) nextPop();
  }
  function nextPop() {
    const x = popQ.shift(); if (!x) { popBusy = false; return; }
    popBusy = true;
    const el = document.createElement('div'); el.className = 'fx-pop' + (calm() ? ' calm' : '');
    el.innerHTML = `<div class="fx-pop-icon">${x.icon}</div><div><div class="fx-pop-head">${h(x.head)}</div><div class="fx-pop-title">${h(x.title)}</div>${x.sub ? `<div class="fx-pop-sub">${h(x.sub)}</div>` : ''}</div>`;

    setTimeout(() => { el.classList.add('out'); setTimeout(() => { el.remove(); nextPop(); }, 300); }, 2600);
  }
  /** New badge: icon, name, what it is for. sound: name of the sound, or false */
  const badge = (icon, name, desc, sound = 'badge') => pop(icon, 'New badge', name, desc, sound);
  function levelUp(t, sound = 'levelup') { pop(t.icon, 'New title', t.en, t.vi, sound); }

  /* ---------- prize jar (sweets) or coin jar (points) ---------- */
  const SWEET_COLS = ['#e74c3c', '#f1c40f', '#2ecc71', '#3498db', '#9b59b6', '#e67e22', '#ff6fa8'];
  /** SVG jar with n sweets. opt: {key, kind:'sweet'|'coin', cap, label} */
  function jar(n, opt = {}) {
    n = Math.max(0, Math.round(n || 0));

    const el = since(key, n), prev = fromOf(key);

<script>
/* ===== Market engine (pure logic, no DOM) ===== */
const Engine = (() => {
  const BASE_BUYERS = [12, 11, 11, 10, 9, 8, 7, 6, 5, 5, 4, 3, 3, 2, 1];
  const BASE_SELLERS = [1, 2, 2, 3, 4, 5, 6, 6, 7, 7, 8, 9, 10, 11, 12];
  // Pairs removed (buyer value, seller cost) when fewer than 30 traders.
  // Extramarginal pairs go first, so equilibrium price stays at 6.
  const REMOVE_ORDER = [[1, 12], [2, 11], [3, 10], [3, 9], [4, 8], [5, 7], [5, 7],
    [12, 1], [11, 2], [11, 2], [10, 3], [9, 4]];
  // Pairs added when more than 30 traders (all extramarginal at 6).
  const ADD_ORDER = [[5, 7], [4, 8], [3, 9], [2, 10], [1, 11]];

  function removeOne(arr, v) { const i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); }

  /** Card values for a market of n traders. Returns {buyers:[], sellers:[]} */
  function cardSet(n) {
    n = Math.max(2, n);
    const buyers = BASE_BUYERS.slice(), sellers = BASE_SELLERS.slice();
    let pairs = Math.floor(n / 2);
    let k = 0;
    while (buyers.length > pairs && k < REMOVE_ORDER.length) {
      removeOne(buyers, REMOVE_ORDER[k][0]); removeOne(sellers, REMOVE_ORDER[k][1]); k++;
    }
    k = 0;
    while (buyers.length < pairs) {
      const p = ADD_ORDER[k++ % ADD_ORDER.length];
      buyers.push(p[0]); sellers.push(p[1]);
    }
    if (n % 2 === 1) buyers.push(2); // odd class: one extra low-value buyer
    buyers.sort((a, b) => b - a); sellers.sort((a, b) => a - b);
    return { buyers, sellers };
  }

  /** Demand and supply schedule over integer prices */
  function schedule(values, costs, lo = 1, hi = 13) {
    const rows = [];
    for (let p = lo; p <= hi; p++) {
      rows.push({ price: p,
        qd: values.filter(v => v >= p).length,
        qs: costs.filter(c => c <= p).length });
    }
    return rows;
  }

  /** Competitive equilibrium from cards: quantity and price range */
  function equilibrium(values, costs) {
    const v = values.slice().sort((a, b) => b - a);
    const c = costs.slice().sort((a, b) => a - b);
    let q = 0;
    while (q < v.length && q < c.length && v[q] >= c[q]) q++;
    if (q === 0) return { qty: 0, lo: null, hi: null, price: null };
    const lo = Math.max(c[q - 1], q < v.length ? v[q] : -Infinity);
    const hi = Math.min(v[q - 1], q < c.length ? c[q] : Infinity);
    return { qty: q, lo, hi, price: (lo + hi) / 2 };
  }

  function shuffle(a, rnd = Math.random) {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  /**
   * Deal cards to traders. traders: [{pid, nick, bot}]
   * Humans are alternated buyer/seller; cards shuffled within each side.
   */
  function deal(traders, rnd = Math.random) {
    const { buyers, sellers } = cardSet(traders.length);
    const b = shuffle(buyers.slice(), rnd), s = shuffle(sellers.slice(), rnd);
    const humans = traders.filter(t => !t.bot), bots = traders.filter(t => t.bot);
    const order = humans.concat(bots);
    const players = [];
    let bi = 0, si = 0;
    order.forEach((t, i) => {
      // Alternate roles; fall back to whichever side still has cards.
      let wantBuyer = i % 2 === 0;
      if (wantBuyer && bi >= b.length) wantBuyer = false;
      if (!wantBuyer && si >= s.length) wantBuyer = true;
      if (wantBuyer) players.push({ ...t, role: 'buyer', card: b[bi++] });
      else players.push({ ...t, role: 'seller', card: s[si++] });
    });
    return players;
  }

  /** Continuous double auction for one round. */
  function createRound(players, roundNo) {
    const byId = new Map(players.map(p => [p.pid, p]));
    const bids = new Map(), asks = new Map(); // pid -> {price, t}
    const traded = new Set();
    const trades = [];
    let seq = 0;

    function best(map, dir) {
      let top = null;
      for (const [pid, o] of map) {
        if (!top || (dir > 0 ? o.price > top.price : o.price < top.price) ||
          (o.price === top.price && o.t < top.t)) top = { pid, ...o };
      }
      return top;
    }
    const bestBid = () => best(bids, +1);
    const bestAsk = () => best(asks, -1);

    function makeTrade(buyerId, sellerId, price) {
      const b = byId.get(buyerId), s = byId.get(sellerId);
      bids.delete(buyerId); asks.delete(buyerId);
      bids.delete(sellerId); asks.delete(sellerId);
      traded.add(buyerId); traded.add(sellerId);
      const tr = { round: roundNo, price, buyer: buyerId, seller: sellerId,
        gain: b.card - price, profit: price - s.card, i: trades.length };
      trades.push(tr);
      return tr;
    }

    /** Submit an order. Returns {ok, trade?, error?} */
    function submit(pid, price) {
      const p = byId.get(pid);
      if (!p) return { ok: false, error: 'not-in-market' };
      if (traded.has(pid)) return { ok: false, error: 'already-traded' };
      price = Math.round(Number(price));
      if (!Number.isFinite(price) || price < 1 || price > 20) return { ok: false, error: 'bad-price' };
      if (p.role === 'buyer') {
        if (price > p.card) return { ok: false, error: 'above-value' };
        const a = bestAsk();
        if (a && price >= a.price) return { ok: true, trade: makeTrade(pid, a.pid, a.price) };
        bids.set(pid, { price, t: ++seq });
      } else {
        if (price < p.card) return { ok: false, error: 'below-cost' };
        const b = bestBid();
        if (b && price <= b.price) return { ok: true, trade: makeTrade(b.pid, pid, b.price) };
        asks.set(pid, { price, t: ++seq });
      }
      return { ok: true };
    }

    function cancel(pid) { bids.delete(pid); asks.delete(pid); }
    function orderOf(pid) { const o = bids.get(pid) || asks.get(pid); return o ? o.price : null; }

    return { submit, cancel, bestBid, bestAsk, orderOf, trades,
      hasTraded: pid => traded.has(pid), byId };
  }

  /** Simple trading robot. Constrained random bids that narrow over rounds. */
  function botPrice(player, round, anchor, rnd = Math.random) {
    // Round 0-1: random within own limit (zero-intelligence). Later rounds:
    // bots centre on last round's average price with a narrowing band.
    const ri = (lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1));
    const band = round <= 1 ? 6 : round === 2 ? 3 : 2;
    const c = player.card;
    if (player.role === 'buyer') {
      if (anchor == null || round <= 1) return ri(Math.max(1, c - band), c);
      const a = Math.round(anchor);
      const hi = Math.min(c, a + band), lo = Math.max(1, Math.min(hi, a - band));
      return ri(lo, hi);
    } else {
      if (anchor == null || round <= 1) return ri(c, Math.min(20, c + band));
      const a = Math.round(anchor);
      const lo = Math.max(c, a - band), hi = Math.min(20, Math.max(lo, a + band));
      return ri(lo, hi);
    }
  }

  function stats(trades) {
    if (!trades.length) return { count: 0, mean: null, sd: null, min: null, max: null };
    const ps = trades.map(t => t.price);
    const mean = ps.reduce((a, b) => a + b, 0) / ps.length;
    const sd = Math.sqrt(ps.reduce((a, b) => a + (b - mean) ** 2, 0) / ps.length);
    return { count: ps.length, mean, sd, min: Math.min(...ps), max: Math.max(...ps) };
  }

  /** Fast bot-only simulation for the teacher's self-check. */
  function simulate(nTraders = 30, rounds = 4, rnd = Math.random) {
    const traders = Array.from({ length: nTraders }, (_, i) => ({ pid: 'b' + i, nick: 'Bot', bot: true }));

    }

      players.filter(p => p.role === 'seller').map(p => p.card));

/* ---- trade prices by round (dots, round averages, equilibrium line after the reveal) ---- */
function drawTrades(canvas, rounds, eq, revealed) {
  if (!canvas) return;
  const box = canvas.parentElement.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const W = Math.max(200, box.width), H = Math.max(140, box.height);
  canvas.width = W * dpr; canvas.height = H * dpr;
  const g = canvas.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);

    if (i > 0) { g.strokeStyle = muted; g.setLineDash([3, 4]); g.beginPath(); g.moveTo(x0, T); g.lineTo(x0, T + ph); g.stroke(); g.setLineDash([]); }
    g.fillStyle = muted; g.textAlign = 'center'; g.textBaseline = 'top'; g.fillText(r.practice ? 'Practice' : 'Round ' + r.n, x0 + w / 2, T + ph + 6);
    r.trades.forEach((t, k) => { g.fillStyle = r.practice ? muted : ink; g.beginPath(); g.arc(x0 + (k + 1) * sx, y(t.price), Math.min(7, Math.max(4, sx / 3)), 0, Math.PI * 2); g.fill(); });
    if (r.trades.length) { const m = r.trades.reduce((a, t) => a + t.price, 0) / r.trades.length; g.strokeStyle = foil; g.lineWidth = 3; g.beginPath(); g.moveTo(x0 + sx * .5, y(m)); g.lineTo(x0 + w - sx * .5, y(m)); g.stroke(); g.lineWidth = 1; }

}

/* ---- private cards: ECDH key agreement, AES-GCM encryption ---- */
async function initCrypto() {

function tSend(m) { T.tr && T.tr.send({ ...m, from: 'teacher', room: T.s.room }); }
function tOnMsg(m) {

    if (!s.humans.find(h => h.pid === m.pid)) {
      s.humans.push({ pid: m.pid, nick: String(m.nick || 'Student').slice(0, 18), at: Date.now() }); Sound.play('blip');
      if (s.players && !s.players.find(p => p.pid === m.pid)) s.queue.push({ pid: m.pid, nick: String(m.nick || 'Student').slice(0, 18) });

    { const hu = human(m.pid); if (FX.AVATARS.includes(m.av)) hu.av = m.av; if (FX.TEAMS[m.team]) hu.team = m.team; }

    case 'vote': if (s.poll && s.poll.open && s.poll.id === m.pollId) { s.poll.answers[m.pid] = m.choice; Sound.play('blip'); } break;
    case 'guess': if (s.guess && s.guess.open && Number.isFinite(+m.price)) { s.guess.answers[m.pid] = Math.round(+m.price); Sound.play('blip'); } break;
    case 'result': (s.results[m.pid] ||= {})[m.qid] = { correct: !!m.correct, tries: m.tries || 1 }; if (m.qid === 'plot' && m.correct && (m.tries || 1) === 1) award(m.pid, 'plotter'); if (m.correct) addPoints(m.pid, 2); break;

}
function onTrade(tr, aggressor) {
  const s = T.s, r = s.rounds[s.current.idx];
  r.trades.push({ price: tr.price, buyer: tr.buyer, seller: tr.seller, gain: tr.gain, profit: tr.profit, at: Date.now() });
  if (!r.practice) {
    s.totals[tr.buyer] = (s.totals[tr.buyer] || 0) + tr.gain; s.totals[tr.seller] = (s.totals[tr.seller] || 0) + tr.profit;
    addPoints(tr.buyer, 2 + Math.max(0, Math.min(6, tr.gain))); addPoints(tr.seller, 2 + Math.max(0, Math.min(6, tr.profit)));
    award(tr.buyer, 'firsttrade'); award(tr.seller, 'firsttrade');
    if (tr.gain >= 3) award(tr.buyer, 'bargain');
    if (tr.profit >= 3) award(tr.seller, 'profit');
    if (aggressor) award(aggressor === tr.buyer ? tr.seller : tr.buyer, 'maker');
    const eq = cardsEq();
    if (r.n === 3 && eq && Math.abs(tr.price - eq.price) <= 1) { award(tr.buyer, 'ontarget'); award(tr.seller, 'ontarget'); }
  }
  Sound.play('cash'); tickerAdd(tr.price, tr);
  checkClassBadge(); tSave(); tYou(tr.buyer); tYou(tr.seller); tBroadcast(); renderLive();
}

/* ---- robots ---- */
function startBots(lenSec, n) {
  stopBots();
  const s = T.s, prev = s.rounds.slice(0, -1).reverse().find(r => r.trades.length);
  const anchor = prev ? prev.trades.reduce((a, t) => a + t.price, 0) / prev.trades.length : null;
  const base = Math.max(1.2, lenSec / 40) * 1000;
  s.players.filter(p => p.bot).forEach(p => {
    const act = () => {
      if (!T.round || !s.current || !p.bot || T.round.hasTraded(p.pid)) return;
      const res = T.round.submit(p.pid, Engine.botPrice(p, n, anchor));
      if (res.trade) onTrade(res.trade, p.pid); else { tBroadcast(); renderLive(); }
      T.bots.set(p.pid, setTimeout(act, base * (0.5 + Math.random() * 1.5)));
    };
    T.bots.set(p.pid, setTimeout(act, 800 + Math.random() * base));
  });
}

  if (r1.sd == null || r2.sd == null) return;

/* ---- leaderboard, teams, podium, replay ---- */
function leaderRows() {
  const s = T.s, rr = realRounds();
  const gainIn = (pid, r) => (r.trades.find(t => t.buyer === pid || t.seller === pid) || {});
  const rows = s.humans.map(h => {
    const first = rr[0] ? gainIn(h.pid, rr[0]) : {}, last = rr.length > 1 ? gainIn(h.pid, rr[rr.length - 1]) : null;
    const g = t => t.buyer === h.pid ? t.gain : t.seller === h.pid ? t.profit : 0;
    return { pid: h.pid, nick: h.nick, av: h.av, team: h.team, points: s.points[h.pid] || 0, up: last ? g(last) - g(first) : null };
  }).filter(x => x.points > 0).sort((a, b) => b.points - a.points);
  const imp = rows.filter(x => x.up != null && x.up > 0 && !rows.slice(0, 3).includes(x)).sort((a, b) => b.up - a.up)[0];
  return { rows, improved: imp ? { nick: imp.nick, av: imp.av, value: '+' + money(imp.up) + ' more gain in the last round than in Round 1' } : null };
}
function teamsHtml() {
  const s = T.s, all = s.humans.map(h => ({ ...h, pts: s.points[h.pid] || 0, role: ((s.players || []).find(p => p.pid === h.pid) || {}).role }));
  const avg = xs => xs.length ? xs.reduce((a, x) => a + x.pts, 0) / xs.length : 0;

  const roleBars = B.length && S2.length ? FX.teamBars([{ icon: '🛍️', name: 'Buyers', n: B.length, value: avg(B), label: Math.round(avg(B)) + ' pts each', color: 'var(--buyer)' }, { icon: '🏪', name: 'Businesses', n: S2.length, value: avg(S2), label: Math.round(avg(S2)) + ' pts each', color: 'var(--seller)' }]) : '';

function showPodium() {
  const L = leaderRows(); if (!L.rows.length) return toast('No points yet.');

function replayPrices() {
  if (!T.projector) { T.projector = true; renderProj(true); }
  const rs = T.s.rounds, total = rs.reduce((a, r) => a + r.trades.length, 0); if (!total) return;
  setTimeout(() => FX.replay(f => { let left = Math.ceil(f * total); const cut = rs.map(r => { const n = Math.min(r.trades.length, Math.max(0, left)); left -= n; return { ...r, trades: r.trades.slice(0, n) }; }); drawTrades($('#cTradesP'), cut, cardsEq(), T.s.revealed); drawTrades($('#cTrades'), cut, cardsEq(), T.s.revealed); return Math.ceil(f * total); }, 6500), 300);
}

/* ---- lesson grades: Paper 2 style debrief + Paper 1 style check, outliers flagged ---- */
function lessonGrades() {
  const s = T.s, hasGap = realRounds().some(r => r.trades.length);
  return s.humans.map(h => {
    const m = s.marks[h.pid] || {}, inMkt = !!(s.players && s.players.find(p => p.pid === h.pid));
    const ids = DEBRIEF_IDS.filter(id => (id !== 'myLine' || inMkt) && (id !== 'gap' || hasGap));
    const p2 = ids.reduce((a, id) => a + (m[id] ? m[id].mark : 0), 0), p2max = ids.reduce((a, id) => a + DEBRIEF_MAX[id], 0);
    const p2done = ids.filter(id => m[id]).length, ck = (s.checks.post || {})[h.pid];
    const p1 = ck ? ck.score : 0, p1max = ck ? ck.total : 10, total = p2 + p1, max = p2max + p1max;
    return { pid: h.pid, nick: h.nick, m, ids, p2, p2max, p2done, p1: ck ? ck.score : null, p1max, total, max, pct: max ? total / max : 0, complete: p2done === ids.length && !!ck };
  });
}
function gradeStats(rows) {
  const done = rows.filter(r => r.complete), pcts = done.map(r => r.pct);
  if (!pcts.length) return { n: 0 };
  const mean = pcts.reduce((a, b) => a + b, 0) / pcts.length, sd = Math.sqrt(pcts.reduce((a, b) => a + (b - mean) ** 2, 0) / pcts.length);
  return { n: pcts.length, mean, sd, cut: mean - sd };
}
function gradesPanel() {
  const rows = lessonGrades(), st = gradeStats(rows);
  rows.forEach(r => { r.flag = r.complete && st.n >= 2 && st.sd > 0 && r.pct < st.cut; });
  rows.sort((a, b) => (b.flag - a.flag) || (a.complete === b.complete ? a.pct - b.pct : a.complete ? 1 : -1));
  const flagged = rows.filter(r => r.flag), incomplete = rows.filter(r => !r.complete);
  const ex = r => { const e = r.m.explain; return e ? `<input type="number" min="0" max="4" step="1" value="${e.mark}" data-override="${esc(r.pid)}" class="mini-in" title="Change the mark"> <small class="muted">${e.override ? 'teacher' : e.est ? 'estimate' : 'AI'}</small>` : '–'; };
  return `<div class="panel stack"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Lesson grades</h2><button class="btn small" data-act="gradecsv">Download grades (CSV)</button></div>
    <p style="margin:0">Debrief (Paper 2 style) <b>${rows[0] ? rows[0].p2max : 15}</b> marks + knowledge check (Paper 1 style) <b>10</b> marks = <b>${rows[0] ? rows[0].max : 25}</b>.</p>
    ${st.n ? `<p style="margin:0">Class average <b>${Math.round(100 * st.mean)}%</b> (standard deviation ${Math.round(100 * st.sd)} percentage points, ${st.n} complete). Students below <b>${Math.max(0, Math.round(100 * st.cut))}%</b> (1 SD below the average) are flagged for review.</p>` : '<p class="muted" style="margin:0">The class average appears when students have finished both the debrief and the knowledge check.</p>'}
    ${flagged.length || incomplete.length ? `<div class="note" style="margin:0"><b>For targeted review:</b> ${flagged.length ? `below the flag line: ${flagged.map(r => esc(r.nick)).join(', ')}` : 'nobody below the flag line'}${incomplete.length ? `. Not finished: ${incomplete.map(r => esc(r.nick)).join(', ')}` : ''}.</div>` : ''}
    <div class="table-wrap"><table class="grades"><tr><th>Student</th><th>Debrief</th><th>Check</th><th>Total</th><th>%</th><th>Explain /4</th><th>Status</th></tr>
    ${rows.map(r => `<tr class="${r.flag ? 'flag' : r.complete ? '' : 'inc'}"><td>${esc(r.nick)}</td><td>${r.p2} / ${r.p2max}${r.p2done < r.ids.length ? ` <small class="muted">(${r.p2done}/${r.ids.length})</small>` : ''}</td><td>${r.p1 == null ? '–' : r.p1 + ' / ' + r.p1max}</td><td><b>${r.total} / ${r.max}</b></td><td>${Math.round(100 * r.pct)}%</td><td>${ex(r)}</td><td>${r.flag ? '⚑ Below average' : r.complete ? 'OK' : '<span class="warn-t">Not finished</span>'}</td></tr>`).join('')}</table></div>
    <small class="muted">Explain marks come from the AI marker, or a keyword estimate if AI marking is not set up. You can change any of them.</small></div>`;
}
function gradesCsv() {
  const rows = lessonGrades(), st = gradeStats(rows);

const BLUEPRINT = { def: 1, pm: 3, eq: 1, gap: 3, data: 2 };
const CHECK_LABELS = Object.fromEntries(QBANK.map(q => [q[1], q[3]]).concat([['x1', 'Class data: equilibrium'], ['x2', 'Class data: which round converged']]));

// Two questions built from the class's own cards and trades
function dataQuestions(pub) {
  const out = [], d = pub.debrief; if (!d) return out;
  const P = d.eq.price, rows = d.rows.filter(r => r.price >= P - 2 && r.price <= P + 2);
  if (P != null && Number.isInteger(P)) {
    const table = tbl(rows.map(r => [money(r.price), r.qd, r.qs]), ['Price', 'Quantity demanded', 'Quantity supplied']);
    const wrong = rows.map(r => r.price).filter(p => p !== P).sort((a, b) => Math.abs(a - P) - Math.abs(b - P)).slice(0, 3).map(money);
    if (wrong.length === 3) out.push(['data', 'x1', '2.4.2', CHECK_LABELS.x1, 'This is your class\'s market schedule, built from everyone\'s cards. What is the equilibrium price?' + table, [money(P), ...wrong],
      `Quantity demanded equals quantity supplied (${rowAt(d.rows, P).qd}) at ${money(P)}.`]);
  }
  const real = (d.stats || []).filter(s => !s.practice && s.count >= 2);
  if (real.length >= 3) {
    const range = s => s.max - s.min, best = real.reduce((a, s) => range(s) < range(a) ? s : a, real[0]);
    const table = tbl(real.map(s => [`Round ${s.n}`, money(s.min), money(s.max)]), ['Round', 'Lowest price', 'Highest price']);
    const opts = real.slice(0, 3).map(s => `Round ${s.n}`);
    const right = `Round ${best.n}`, wrong = opts.filter(o => o !== right);
    out.push(['data', 'x2', '2.4.1', CHECK_LABELS.x2, 'The table shows your class\'s trades. In which round were prices closest together?' + table, [right, ...wrong, 'All rounds were the same'],
      `Round ${best.n} had the smallest gap between its highest and lowest prices (${money(range(best))}). As traders learn, prices usually move closer to equilibrium.`]);
  }
  return out;
}
const rowAt = (rows, p) => rows.find(r => r.price === p) || { price: p, qd: 0, qs: 0 };
function buildPaper(pub) {
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const bp = { ...BLUEPRINT }, data = dataQuestions(pub).slice(0, bp.data);
  if (data.length < 2) bp.pm += 2 - data.length;
  const pick = [];
  Object.entries(bp).forEach(([cat, n]) => { if (cat !== 'data') pick.push(...shuffle(QBANK.filter(q => q[0] === cat)).slice(0, n)); });
  pick.push(...data);
  const order = ['def', 'pm', 'eq', 'data', 'gap'];
  pick.sort((a, b) => order.indexOf(a[0]) - order.indexOf(b[0]));
  return { qs: pick.map(q => ({ id: q[1], ref: q[2], text: q[4], opts: shuffle(q[5].map((t, i) => ({ t, ok: i === 0 }))), why: q[6] })), ans: {}, submitted: false, started: Date.now() };
}

const MARK_POINTS = [
  'Businesses with costs below the market price could sell and make a profit',
  'Businesses with costs above the price would make a loss, so they did not sell',
  'Only buyers who valued the item at the price or more were willing to buy',
  'Links to the price mechanism or equilibrium (price signals, rationing, or class data)'
];
function estimateMark(text) {
  const t = text.toLowerCase();
  const has = [
    /(low|lower|lowest|cheap|small)\s+(ingredient\s+)?costs?/.test(t) || /costs?[^.]{0,40}(below|less than|lower than|under)[^.]{0,20}price/.test(t),
    (/(high|higher|highest|big)\s+(ingredient\s+)?costs?/.test(t) || /costs?[^.]{0,40}(above|more than|higher than|over)[^.]{0,20}price/.test(t)) && /(loss|lose|not sell|didn't sell|did not sell|couldn't sell|could not sell|no one|nobody)/.test(t),
    /(buyer|consumer|customer)s?[^.]{0,60}(willing|pay|value|worth|afford)/.test(t),
    /(price mechanism|equilibrium|signal|ration|quantity demanded|quantity supplied|\d{2}\.?000)/.test(t)
  ];
  const mark = has.filter(Boolean).length, miss = MARK_POINTS.filter((_, i) => !has[i]);
  return { mark, points: MARK_POINTS.map((p, i) => ({ text: p, awarded: has[i] })), feedback: mark === 4 ? 'All four points are covered.' : '', next_step: miss.length ? 'Add this point: ' + miss[0].toLowerCase() + '.' : '' };
}
async function aiMark(qid, answer, context) {
  const url = CONFIG.markerUrl || (CONFIG.supabaseUrl ? CONFIG.supabaseUrl.replace(/\/$/, '') + '/functions/v1/mark' : '');
  if (!url) return null;
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 25000);
  try {
    const headers = { 'content-type': 'application/json' };
    const key = String(CONFIG.supabaseAnonKey || '').trim();
    if (key) { headers.apikey = key; if (key.startsWith('eyJ')) headers.Authorization = 'Bearer ' + key; } // new sb_publishable_ keys must not go in Authorization
    const r = await fetch(url, { method: 'POST', headers, body: JSON.stringify({ qid, answer: answer.slice(0, 2000), context, room: S.room }), signal: ctl.signal });
    if (!r.ok) return null;
    const j = await r.json();
    if (typeof j.mark !== 'number') return null;
    j.mark = Math.max(0, Math.min(4, Math.round(j.mark)));
    return j;
  } catch { return null; } finally { clearTimeout(tm); }
}

/* ---- plotting task: tap to place, double-tap a point to remove it ---- */
const PL = { W: 340, H: 290, L: 46, R: 12, T: 12, B: 36, qMax: 16, pMax: 12 };
function plotHtml() {
  return `<div class="plot"><div class="row" style="margin-bottom:8px"><div class="seg"><button class="d" data-mode="d">Demand</button><button class="s" data-mode="s">Supply</button></div><button class="btn small ghost" data-plotclear>Clear this curve</button></div>
  <svg id="plotSvg" viewBox="0 0 ${PL.W} ${PL.H}" role="img" aria-label="Grid for plotting demand and supply"></svg>
  <div class="row"><button class="btn primary" data-plotcheck>Check my curves</button></div></div>`;
}
const px = q => PL.L + (q / PL.qMax) * (PL.W - PL.L - PL.R);
const py = p => PL.T + (PL.H - PL.T - PL.B) - (p / PL.pMax) * (PL.H - PL.T - PL.B);
function plotPrices() { const P = S.pub.debrief.eq.price; return [P - 2, P - 1, P, P + 1, P + 2].map(Math.round); }
function drawPlot(marks) {
  const svg = $('#plotSvg'); if (!svg) return;
  $$('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === S.plot.mode));
  const prices = plotPrices(), buyer = cssVar('--buyer'), seller = cssVar('--seller'), line = cssVar('--line'), muted = cssVar('--muted'), foil = cssVar('--foil');
  let h = '';
  for (let q = 0; q <= PL.qMax; q++) h += `<line x1="${px(q)}" y1="${py(0)}" x2="${px(q)}" y2="${py(PL.pMax)}" stroke="${line}" stroke-width="${q % 2 ? .5 : 1}"/>`;
  for (let p = 0; p <= PL.pMax; p++) h += `<line x1="${px(0)}" y1="${py(p)}" x2="${px(PL.qMax)}" y2="${py(p)}" stroke="${prices.includes(p) ? foil : line}" stroke-width="${prices.includes(p) ? 1.5 : .6}"/>`;
  for (let q = 0; q <= PL.qMax; q += 2) h += `<text x="${px(q)}" y="${py(0) + 16}" font-size="11" text-anchor="middle" fill="${muted}">${q}</text>`;
  for (let p = 0; p <= PL.pMax; p += 2) h += `<text x="${px(0) - 6}" y="${py(p) + 4}" font-size="11" text-anchor="end" fill="${muted}">${kk(p)}</text>`;
  h += `<text x="${(px(0) + px(PL.qMax)) / 2}" y="${PL.H - 4}" font-size="12" text-anchor="middle" fill="${muted}">Quantity</text>`;
  h += `<text x="10" y="${py(PL.pMax / 2)}" font-size="12" text-anchor="middle" fill="${muted}" transform="rotate(-90 10 ${py(PL.pMax / 2)})">Price</text>`;
  [['d', buyer], ['s', seller]].forEach(([k, col]) => {
    const pts = Object.entries(S.plot[k]).map(([p, q]) => [+p, q]).sort((a, b) => a[0] - b[0]);
    if (pts.length > 1) h += `<polyline fill="none" stroke="${col}" stroke-width="3" points="${pts.map(([p, q]) => px(q) + ',' + py(p)).join(' ')}"/>`;
    pts.forEach(([p, q]) => { const m = marks && marks[k] && marks[k][p]; h += `<circle cx="${px(q)}" cy="${py(p)}" r="7" fill="${col}" stroke="${m === false ? '#e0303a' : m === true ? '#22805a' : '#fff'}" stroke-width="${m == null ? 2 : 4}"/>`; });
    if (pts.length) { const top = pts[pts.length - 1]; h += `<text x="${px(top[1]) + 10}" y="${py(top[0]) - 8}" font-size="13" font-weight="700" fill="${col}">${k === 'd' ? 'D' : 'S'}</text>`; }
  });
  svg.innerHTML = h;
}
function plotPointer(e) {
  const svg = e.target.closest('#plotSvg'); if (!svg || S.solved.plot) return;
  const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) * (PL.W / r.width), y = (e.clientY - r.top) * (PL.H / r.height);
  // a double-tap (or double-click) on an existing point removes it
  // only points on the curve being drawn count, so D and S can share the equilibrium point
  let near = null, best = 15; const k = S.plot.mode;
  Object.entries(S.plot[k]).forEach(([p, q]) => { const dd = Math.hypot(px(q) - x, py(+p) - y); if (dd < best) { best = dd; near = { k, p: +p }; } });
  const now = Date.now(), last = S.lastTap;
  S.lastTap = { t: now, near: near && near.k + near.p };
  if (near && last && now - last.t < 450 && last.near === near.k + near.p) { delete S.plot[near.k][near.p]; S.lastTap = null; sfx('blip'); e.preventDefault(); return drawPlot(); }
  if (near) return; // first tap on a point: wait to see if it is a double-tap
  const prices = plotPrices(), pRaw = (PL.H - PL.B - y) / (PL.H - PL.T - PL.B) * PL.pMax;
  const p = prices.reduce((a, b) => Math.abs(b - pRaw) < Math.abs(a - pRaw) ? b : a);
  if (Math.abs(p - pRaw) > 0.8) return toast(`Tap on one of the gold lines: prices ${money(prices[0])} to ${money(prices[4])}.`);
  S.plot[S.plot.mode][p] = Math.max(0, Math.min(PL.qMax, Math.round((x - PL.L) / (PL.W - PL.L - PL.R) * PL.qMax)));
  drawPlot();
}

const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

    else if (m.trade) {
      const buyer = S.me && S.me.role === 'buyer', g = S.me ? (buyer ? S.me.card - m.trade.price : m.trade.price - S.me.card) : 0;
      toast(`${buyer ? 'You bought' : 'You sold'} for ${money(m.trade.price)}: ${buyer ? 'gain' : 'profit'} ${money(g)}`); sfx('coin'); flash();
      setTimeout(() => { FX.coins('#takeBtn, #sendBtn, #sMain', '#jarBox', Math.max(3, Math.min(10, g * 2))); FX.float('+' + money(g), '#sMain .profile, #sMain .fx-wallet, #sMain .fx-stall'); }, 60);
    }
  }
}
function flash() { const el = $('#sMain'); if (!el || REDUCED) return; el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
function errText(e) {
  const me = S.me || {};
  sfx('bonk'); FX.shake('#sMain');
  return ({ 'above-value': `You can't offer more than it is worth to you (${money(me.card)}).`, 'below-cost': `You can't ask for less than it costs you (${money(me.card)}).`,
    'already-traded': 'You have already traded in this round.', 'not-in-market': "You're not in this round. You'll get a card when it ends.", 'no-round': 'The round has not started yet.', 'bad-price': 'Choose a different price.' })[e] || 'That did not work. Try again.';
}
function tickTimer() {
  const el = $('#sTimer'); if (!el) return;
  if (!S.pub || !S.pub.round || !S.leftAt) { el.textContent = ''; FX.timer(el, null); return; }
  const left = Math.max(0, S.leftAt.left - Math.floor((Date.now() - S.leftAt.at) / 1000));
  el.textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0'); FX.timer(el, left, sfxOK());
}

/* ---- routing ---- */
function renderS() {
  const main = $('#sMain'); if (!main || !S.pub) return;
  const p = S.pub, me = S.me || {};
  const pts = $('#sPts'); if (pts) pts.textContent = (me.points || 0) + ' points';
  const br = $('#sBrand'); if (br) br.textContent = `${FX.avOf(S.av)} Chợ Lớp 9`;
  const tt = $('#sTitle'); if (tt) tt.innerHTML = FX.titleChip(FX.titleWatch('me', me.points || 0, TH1, null));
  if (FX.hold(renderS)) return;
  const solo = p.phase === 'debrief' || p.phase === 'check';
  const grid = $('.sgrid'); if (grid) grid.classList.toggle('solo', solo);
  const side = $('#sSide'); if (side) side.classList.toggle('hidden', solo);
  let key;
  if (p.phase === 'check') key = 'check|' + p.checkMode;
  else if (p.phase === 'debrief') key = 'debrief';
  else if (p.phase === 'finish') key = 'finish|' + (me.badges || []).length;
  else if (!me.inMarket) key = 'wait|' + (me.waiting ? 'late' : 'lobby');
  else key = ['mkt', p.phase, p.round ? p.round.n + (p.round.practice ? 'p' : '') : '-', me.role, me.card, me.traded, p.poll ? p.poll.id + p.poll.open + (p.poll.result ?? '') : '', p.revealed, p.guess ? p.guess.open + '' + (p.guess.result ?? '') + me.guess : ''].join('|');
  if (key !== S.key) {
    S.key = key;
    if (p.phase === 'check') renderCheck(main);
    else if (p.phase === 'debrief') renderDebriefStudent(main);
    else if (p.phase === 'finish') main.innerHTML = finishHtml();
    else if (key.startsWith('wait')) main.innerHTML = `<div class="panel stack"><h2 style="margin:0">${FX.avOf(S.av)} Hi ${esc(S.nick)}, you're in.</h2><p style="margin:0">${me.waiting ? 'This round has already started. You will get a card when it ends.' : `Look at the board. Your teacher will deal the cards. You will be a ${term('buyer')} or a business (${term('seller')}).`}</p>${FX.avatarPicker(S.av)}${FX.teamPicker(S.team)}</div>`;
    else main.innerHTML = marketHtml();
    main.onclick = studentClick;
    if (p.phase === 'debrief') { main.onclick = debriefClick; main.onpointerdown = plotPointer; }
  }
  updateMarket(); renderSide();
}
function finishHtml() {
  const b = (S.me || {}).badges || [], col = badgeCollection(), l0 = col.l0 || [];
  const dt = S.pub.debrief ? debriefTotals() : { got: 0, max: 15 }, ck = (S.check || {}).post, p1 = ck && ck.submitted ? ck.qs.filter((q, i) => ck.ans[i] != null && q.opts[ck.ans[i]].ok).length : null;
  const score = `<div class="scorebox big"><b>${dt.got + (p1 || 0)} / ${dt.max + 10}</b><small>Debrief ${dt.got} / ${dt.max}, knowledge check ${p1 == null ? 'not done' : p1 + ' / 10'}</small></div>`;
  return `<div class="panel stack"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Well done, trader</h2>${score}</div><p style="margin:0">You scored <b>${(S.me || {}).points || 0} points</b> and earned ${b.length} of ${Object.keys(BADGES1).length} Level 1 badges.</p>
    <div class="badgewall">${Object.entries(BADGES1).map(([id, x]) => `<div class="bw ${b.includes(id) ? '' : 'locked'}"><span class="bdg big">${x[0]}</span><b>${esc(x[1])}</b><small class="muted">${esc(x[2])}</small></div>`).join('')}</div>
    ${l0.length ? `<h3 style="margin:0">From Level 0</h3><div class="row" style="gap:6px">${l0.map(id => `<span class="bdg">${L0_BADGE_ICONS[id] || '⭐'}</span>`).join('')}</div>` : ''}</div>`;
}

/* ---- market screen ---- */
function marketHtml() {
  const p = S.pub, me = S.me, g = GOODS[p.good], buyer = me.role === 'buyer', running = !!p.round;
  const card = buyer ? FX.wallet({ name: me.persona || 'Buyer', avatar: FX.avOf(S.av), sub: `Your ${term('buyer')} card: you want one ${esc(g.unit1)}. Buy for less than this and you gain the difference.`,
      items: [{ label: `One ${esc(g.unit1)} is worth this to you (${term('satisfaction')})`, art: ART[p.good], worth: money(me.card), bought: !!me.traded, fresh: (() => { const el = FX.since('l1bought', !!me.traded); return me.traded && el < 900 ? el : null; })() }], empty: 'Nothing bought yet this round' })
    : FX.stall({ name: me.persona || 'Business', color: '#b02a3f', avatars: FX.avOf(S.av), sub: `Your business card: you can make one ${esc(g.unit1)}. Sell for more than your cost and you make a profit.`,
      rows: [{ art: ART[p.good], units: [{ tag: me.traded ? 'sold' : `cost ${money(me.card)}`, state: me.traded ? 'sold' : 'cur', fresh: (() => { const el = FX.since('l1sold', !!me.traded); return me.traded && el < 1300 ? el : null; })() }] }] });
  let body;
  if (!running) {
    const last = me.last;
    body = `<div class="panel stack"><h2 style="margin:0">${p.lastRound ? 'Round over' : 'Get ready'}</h2>
      ${last ? `<p class="good" style="margin:0">${buyer ? 'You bought' : 'You sold'} for <b>${money(last.price)}</b>. ${buyer ? 'Gain' : 'Profit'}: <b>${money(last.gain)}</b>${last.practice ? ' (practice)' : ''}.</p>` : p.lastRound ? '<p style="margin:0">You did not trade last round.</p>' : ''}
      <p style="margin:0">Wait for the next round. You keep the same card.</p>
      ${me.total ? `<p class="muted" style="margin:0">Total ${buyer ? 'gain' : 'profit'} so far: ${money(me.total)}</p>` : ''}</div>${pollHtml()}`;
  } else if (me.traded) {
    body = `<div class="panel stack"><h2 style="margin:0">Done for this round</h2><p class="good" style="margin:0" id="doneMsg"></p><p class="muted" style="margin:0">Watch the prices until the round ends.</p></div>`;
  } else {
    body = `<div class="panel stack">
      <div class="quotes"><div class="quote ask"><div class="q-label">Lowest price a business asks</div><div class="q-val" id="qAsk">–</div></div><div class="quote bid"><div class="q-label">Highest offer from a buyer</div><div class="q-val" id="qBid">–</div></div></div>
      <button class="btn block ${buyer ? 'buyer' : 'seller'}" id="takeBtn" data-s="take" disabled></button>
      <div><label class="field">${buyer ? 'Or make an offer' : 'Or set your asking price'}</label>
        ${FX.priceTag({ key: 'p', val: S.price, min: buyer ? 1 : me.card, max: buyer ? me.card : 16, fmt: money, stepLabel: kk(1), minus: 'data-s="minus"', plus: 'data-s="plus"', role: buyer ? 'buyer' : 'seller', sub: buyer ? 'your offer' : 'your asking price' })}
        <div id="zone"></div></div>
      <button class="btn primary block" data-s="send" id="sendBtn"></button>
      <div id="myOrder"></div>
      <small class="muted">Keys: ← → change the price, Enter sends, ${buyer ? 'B buys now' : 'S sells now'}, Esc cancels.</small></div>`;
  }
  return card + body;
}
function guessHtml() {
  const G2 = S.pub.guess, me = S.me || {}; if (!G2) return '';
  if (G2.open) return `<div class="fx-predict stack"><h3>✉️ Guess the envelope</h3><p style="margin:0">The equilibrium price is sealed in the envelope. It comes from everyone's cards. Where do you think it is? Within ${money(1)} cracks it: +5 points.</p>
    <div class="guess-opts">${Array.from({ length: 9 }, (_, i) => i + 3).map(v => `<button class="opt ${me.guess === v ? 'sel' : ''}" data-s="guess" data-v="${v}">${money(v)}</button>`).join('')}</div><small class="muted">Tip: look at where the prices settled in Round 3.</small></div>`;
  if (G2.result != null && me.guess != null) return `<div class="fx-predict"><h3>✉️ Your guess</h3><p style="margin:0">You guessed ${money(me.guess)}. The envelope said <b>${money(G2.result)}</b>. ${Math.abs(me.guess - G2.result) <= 1 ? '<b class="okt">You cracked it! +5 points</b>' : 'Close the gap next time: watch the average price.'}</p></div>`;
  return '';
}
function pollHtml() {
  const gh = guessHtml(); if (gh) return gh;
  const poll = S.pub.poll; if (!poll) return '';
  const mine = S.answers['poll:' + poll.id];
  if (poll.open) return `<div class="panel stack"><h3 style="margin:0">Predict</h3><p style="margin:0">${esc(poll.q)}</p><div class="opts">${poll.options.map((o, i) => `<button class="opt ${mine === i ? 'sel' : ''}" data-s="vote" data-i="${i}">${esc(o)}</button>`).join('')}</div>${mine != null ? '<small class="muted">Saved. You can change it until your teacher closes it.</small>' : ''}</div>`;
  if (!poll.tally) return '';
  return `<div class="panel stack"><h3 style="margin:0">Class prediction</h3>${poll.options.map((o, i) => `<div class="row" style="justify-content:space-between"><span>${esc(o)}${mine === i ? ' (you)' : ''}${poll.result === i ? ' ✓' : ''}</span><b>${poll.tally[i]}</b></div>`).join('')}${poll.result != null ? '<small class="muted">✓ shows what happened in Round 2.</small>' : '<small class="muted">We will find out after Round 2.</small>'}</div>`;
}
function updateMarket() {
  const p = S.pub, me = S.me; if (!me || !me.inMarket || !p) return;
  const buyer = me.role === 'buyer';
  const done = $('#doneMsg'); if (done && me.last) done.innerHTML = `${buyer ? 'You bought' : 'You sold'} for <b>${money(me.last.price)}</b>. ${buyer ? 'Gain' : 'Profit'}: <b>${money(me.last.gain)}</b>.`;
  const qa = $('#qAsk'); if (!qa) return;
  qa.textContent = money(p.ask); $('#qBid').textContent = money(p.bid);
  const rg = $('#sMain .fx-range'); if (rg && +rg.value !== S.price) rg.value = S.price;
  const best = buyer ? p.ask : p.bid, take = $('#takeBtn');
  const can = best != null && (buyer ? best <= me.card : best >= me.card);
  take.disabled = !can;
  take.innerHTML = best == null ? (buyer ? 'No business is asking yet' : 'No buyer is offering yet') : can ? `${buyer ? 'Buy now' : 'Sell now'} for ${money(best)} <kbd>${buyer ? 'B' : 'S'}</kbd>` : (buyer ? `${money(best)} is more than it's worth to you` : `${money(best)} is less than your cost`);
  FX.setVal('p', money(S.price));
  $('#sendBtn').innerHTML = `${buyer ? 'Offer' : 'Ask for'} ${money(S.price)} <kbd>Enter</kbd>`;
  const fmt = v => kk(v);
  $('#zone').innerHTML = dealLine(me.role, me.card, [S.price], null, true, { max: 14, step: 2, fmt, lab: buyer ? 'worth' : 'cost' });
  $('#myOrder').innerHTML = me.order != null ? `<div class="row" style="justify-content:space-between"><span>Your ${buyer ? 'offer' : 'asking price'}: <b>${money(me.order)}</b>. Waiting for a ${buyer ? 'business' : 'buyer'}.</span><button class="btn small" data-s="cancel">Cancel <kbd>Esc</kbd></button></div>` : '';
}
function studentClick(e) {
  const b = e.target.closest('[data-s]'); if (!b || b.disabled) return;
  const me = S.me, p = S.pub, a = b.dataset.s;
  if (a === 'minus' || a === 'plus') {
    S.price = Math.max(1, Math.min(16, S.price + (a === 'plus' ? 1 : -1)));
    if (me.role === 'buyer' && S.price > me.card) { S.price = me.card; toast(`It is worth ${money(me.card)} to you, so you can't offer more.`); sfx('bonk'); FX.shake(b.closest('.fx-tag')); return updateMarket(); }
    if (me.role === 'seller' && S.price < me.card) { S.price = me.card; toast(`It costs you ${money(me.card)}, so you can't ask for less.`); sfx('bonk'); FX.shake(b.closest('.fx-tag')); return updateMarket(); }
    sfx('blip'); updateMarket();
  } else if (a === 'send') { sfx('blip'); sSend({ type: 'order', price: S.price }); }
  else if (a === 'take') sSend({ type: 'order', price: me.role === 'buyer' ? p.ask : p.bid });
  else if (a === 'cancel') sSend({ type: 'cancel' });
  else if (a === 'guess') { const v = +b.dataset.v; sSend({ type: 'guess', price: v }); $$('[data-s=guess]').forEach(x => x.classList.toggle('sel', x === b)); sfx('pop'); }
  else if (a === 'vote') { const i = +b.dataset.i; S.answers['poll:' + p.poll.id] = i; sSave(); sSend({ type: 'vote', pollId: p.poll.id, choice: i }); S.key = ''; renderS(); }
  else if (a === 'ck' || a === 'cksubmit') checkClick(b);
}
function sKeys(e) {
  if (e.target.matches('input,textarea,select') || !S.pub || !S.me || !S.me.inMarket || !S.pub.round) return;
  const k = e.key.toLowerCase(), click = sel => { const b = $(sel); if (b && !b.disabled) { b.click(); e.preventDefault(); } };
  if (k === 'arrowup' || k === 'arrowright') click('[data-s=plus]');
  else if (k === 'arrowdown' || k === 'arrowleft') click('[data-s=minus]');
  else if (k === 'enter') click('[data-s=send]');
  else if ((k === 'b' && S.me.role === 'buyer') || (k === 's' && S.me.role === 'seller')) click('[data-s=take]');
  else if (k === 'escape') click('[data-s=cancel]');
}

/* ---- side panel: live market, your badges ---- */
function renderSide() {
  const side = $('#sSide'); if (!side || !S.pub) return;
  const p = S.pub, me = S.me || {}, showChart = !!(me.inMarket && ['dealt', 'running', 'between'].includes(p.phase));
  const k = (showChart ? 'c' : '') + p.phase;
  if (side.dataset.k !== k) {
    side.dataset.k = k;
    side.innerHTML = `${showChart ? `<div class="panel"><h3 style="margin:0 0 6px">Live market</h3><div class="chart-box"><canvas id="cMini"></canvas></div><small class="muted" id="miniNote"></small></div><div class="panel"><h3 style="margin:0 0 6px">Prices this round <small class="muted">▲ higher, ▼ lower than the trade before</small></h3><div id="tape"></div></div>` : ''}<div class="panel jar-panel" id="jarBox"></div><div class="panel" id="myBadges"></div>`;
  }
  drawMini();
  const tape = $('#tape'); if (tape) tape.innerHTML = FX.ticker((p.prices || []).map((x, i) => ({ id: p.roundN + '-' + i, price: x, art: ART[p.good] })), money, 'tape');
  const jb = $('#jarBox'); if (jb) { const t = FX.title(me.points || 0, TH1), nx = TH1[t.i]; jb.innerHTML = `<div class="stack" style="gap:4px"><h3 style="margin:0">Your points</h3>${FX.titleChip(t)}<small class="muted">${nx != null ? `${nx - (me.points || 0)} more for the next title` : 'Top title!'}</small></div>${FX.jar(me.points || 0, { key: 'pts', kind: 'coin', size: 'small', label: (me.points || 0) + ' pts' })}`; }
  const b = me.badges || [], l0 = (badgeCollection().l0 || []);
  $('#myBadges').innerHTML = `<h3 style="margin:0 0 6px">Your badges</h3><div class="row" style="gap:6px">${Object.entries(BADGES1).map(([id, x]) => `<span class="bdg ${b.includes(id) ? '' : 'off'}" title="${esc(x[1])}: ${esc(x[2])}">${x[0]}</span>`).join('')}</div>${l0.length ? `<div class="muted" style="margin-top:6px;font-size:.9rem">From Level 0: ${l0.map(id => L0_BADGE_ICONS[id] || '⭐').join(' ')}</div>` : ''}`;
}
function drawMini() {
  const c = $('#cMini'); if (!c || !S.pub) return;
  const p = S.pub, me = S.me || {};
  drawAuction(c, { bids: (p.book || {}).bids || [], asks: (p.book || {}).asks || [], revealed: false, qMax: p.nTraders || 15, pMax: 14, qLabel: `Quantity (${GOODS[p.good].unitName})`,
    mine: me.order, mineRole: me.role, empty: 'Offers and asks appear here' });
  const n = $('#miniNote'); if (n) n.textContent = me.order != null ? 'The gold dot is your offer. Trades happen where the blue and red steps meet.' : 'Blue steps: buyers\' offers. Red steps: businesses\' asks.';
}

/* ---- word collector ---- */
document.addEventListener('click', e => {
  const tm = e.target.closest && e.target.closest('.term'); if (!tm || !S.pid || !S.tr) return;
  if (!S.words.includes(tm.dataset.term)) { S.words.push(tm.dataset.term); sSave(); if (S.words.length === 5) sSend({ type: 'award', points: 2, badge: 'words' }); }
});

// Number line comparing a card value with a price. opt: max, step, fmt, lab (marker label)
function dealLine(role, card, prices, chosen, show, opt = {}) {
  const max = opt.max || 14, stepT = opt.step || 2, fmt = opt.fmt || (v => v), lab = opt.lab || (role === 'buyer' ? 'worth' : 'cost');
  const W = 340, H = 112, Lm = 18, Rm = 18, x = v => Lm + v / max * (W - Lm - Rm), LY = 48;
  const buyerC = cssVar('--buyer'), sellerC = cssVar('--seller'), mint = cssVar('--mint'), ink = cssVar('--ink'), muted = cssVar('--muted');
  const roleC = role === 'buyer' ? buyerC : sellerC;
  let h = `<line x1="${x(0)}" y1="${LY}" x2="${x(max)}" y2="${LY}" stroke="${muted}" stroke-width="2"/>`;
  for (let v = 0; v <= max + 1e-9; v += stepT) h += `<line x1="${x(v)}" y1="${LY - 4}" x2="${x(v)}" y2="${LY + 4}" stroke="${muted}"/><text x="${x(v)}" y="${LY + 22}" font-size="11" text-anchor="middle" fill="${muted}">${fmt(v)}</text>`;
  if (show) prices.forEach(p => {
    if (chosen != null && p !== chosen) return;
    const gain = role === 'buyer' ? card - p : p - card, col = gain >= 0 ? mint : '#e0303a';
    h += `<rect x="${x(Math.min(card, p))}" y="${LY - 8}" width="${Math.max(2, Math.abs(x(card) - x(p)))}" height="16" rx="4" fill="${col}" opacity=".85"/>`;
    h += `<text x="${(x(card) + x(p)) / 2}" y="${LY + 54}" font-size="14" font-weight="800" text-anchor="middle" fill="${col}">${gain > 0 ? '+' + fmt(gain) + (role === 'buyer' ? ' gain' : ' per item') : gain === 0 ? 'no gain' : '−' + fmt(-gain) + ' loss'}</text>`;
  });
  h += `<circle cx="${x(card)}" cy="${LY}" r="9" fill="${roleC}"/><text x="${x(card)}" y="${LY + 36}" font-size="11" font-weight="700" text-anchor="middle" fill="${roleC}">${lab}</text>`;
  prices.forEach(p => { h += `<path d="M${x(p) - 8} 22 L${x(p) + 8} 22 L${x(p)} 36 Z" fill="${ink}"/><text x="${x(p)}" y="16" font-size="12" font-weight="700" text-anchor="middle" fill="${ink}">price ${fmt(p)}</text>`; });
  return `<svg class="dline" viewBox="0 0 ${W} ${H}" role="img" aria-label="Number line comparing your card with the price">${h}</svg>`;
}


/* ---- home and boot ---- */
function homeBoot() { location.replace('index.html' + (PARAMS.get('t') ? '?t=' + PARAMS.get('t') : '')); }
(function boot() {
  const mode = PARAMS.get('mode') || (PARAMS.get('room') ? 'student' : 'home');
  if (mode === 'teacher') teacherBoot(); else if (mode === 'student') studentBoot(); else homeBoot();
})();

</script>
