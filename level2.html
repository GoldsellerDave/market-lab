<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Market Town with prizes: EcoLogic Market Lab Level 2</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍬</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root {
  --cocoa: #3a2217;
  --cocoa-2: #5b3826;
  --ink: #23170f;
  --muted: #6d6158;
  --paper: #f3f4f7;
  --panel: #ffffff;
  --line: #dcd8de;
  --foil: #d8a21f;
  --foil-2: #f2cf6b;
  --buyer: #12648c;
  --buyer-soft: #e2eff6;
  --seller: #b02a3f;
  --seller-soft: #f8e5e8;
  --mint: #22805a;
  --mint-soft: #e1f2e9;
  --warn: #9a5b00;
  --warn-soft: #fbf0dc;
  --shadow: 0 1px 2px rgba(35, 23, 15, .08), 0 6px 18px rgba(35, 23, 15, .06);
  --r-sm: 8px;
  --r-md: 14px;
  --buyer-card: #12648c;
  --seller-card: #b02a3f;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --font-display: "Bricolage Grotesque", "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #f3ebe4; --muted: #b8aca2; --paper: #17120f; --panel: #221b16; --line: #3c322b;
    --buyer: #5fb3dc; --buyer-soft: #16303d; --seller: #ec7a8c; --seller-soft: #3d1c22;
    --mint: #5cc79a; --mint-soft: #16332a; --warn: #f0b85a; --warn-soft: #3a2c12;
    --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #f3ebe4; --muted: #b8aca2; --paper: #17120f; --panel: #221b16; --line: #3c322b;
  --buyer: #5fb3dc; --buyer-soft: #16303d; --seller: #ec7a8c; --seller-soft: #3d1c22;
  --mint: #5cc79a; --mint-soft: #16332a; --warn: #f0b85a; --warn-soft: #3a2c12;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  margin: 0; min-height: 100%; background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; margin: 0 0 .4em; letter-spacing: -.01em; }
h1 { font-size: clamp(1.6rem, 4vw, 2.3rem); font-weight: 800; }
h2 { font-size: 1.3rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0 0 .8em; max-width: 68ch; }
small, .muted { color: var(--muted); }
a { color: var(--buyer); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--foil); outline-offset: 2px; }

.wrap { max-width: 1180px; margin: 0 auto; padding: 16px; }
.narrow { max-width: 520px; margin: 0 auto; padding: 16px; }

.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--cocoa); color: #fbf3ea;
}
.topbar .brand { font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; }
.topbar .spacer { flex: 1; }
.topbar .chip { background: rgba(255,255,255,.12); color: #fbf3ea; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px; box-shadow: var(--shadow); }
.panel + .panel { margin-top: 14px; }
.stack > * + * { margin-top: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }

.btn {
  appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 999px; padding: 10px 18px; font-weight: 700; cursor: pointer; min-height: 44px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
}
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--cocoa); border-color: var(--cocoa); color: #fbf3ea; }
:root[data-theme="dark"] .btn.primary { background: var(--foil); border-color: var(--foil); color: #23170f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { background: var(--foil); border-color: var(--foil); color: #23170f; } }
.btn.buyer { background: var(--buyer-card); border-color: var(--buyer-card); color: #fff; }
.btn.seller { background: var(--seller-card); border-color: var(--seller-card); color: #fff; }
.btn.small { min-height: 34px; padding: 5px 12px; font-size: .9rem; }
.btn.block { width: 100%; }
.btn.ghost { background: transparent; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: .88rem; background: var(--paper); border: 1px solid var(--line); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; }
.dot.ok { background: var(--mint); } .dot.bad { background: var(--seller); } .dot.wait { background: var(--foil); }

label.field { display: block; font-weight: 700; margin-bottom: 4px; }
input[type=text], input[type=number], select, textarea {
  width: 100%; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; background: var(--panel); min-height: 44px;
}
textarea { min-height: 120px; resize: vertical; line-height: 1.45; }
.code-input { font-family: var(--font-display); font-size: 1.6rem; letter-spacing: .25em; text-transform: uppercase; text-align: center; }

.note { padding: 10px 12px; border-radius: var(--r-sm); background: var(--warn-soft); color: var(--ink); border-left: 4px solid var(--warn); }
.good { padding: 10px 12px; border-radius: var(--r-sm); background: var(--mint-soft); border-left: 4px solid var(--mint); }
.bad { padding: 10px 12px; border-radius: var(--r-sm); background: var(--seller-soft); border-left: 4px solid var(--seller); }

/* Home */
.home-hero { padding: 40px 0 20px; }
.home-choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.choice { text-align: left; padding: 22px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--panel); cursor: pointer; box-shadow: var(--shadow); }
.choice h2 { margin-bottom: .2em; }

/* The chocolate bar card: the one bold element */
.bar {
  position: relative; border-radius: 16px; overflow: hidden; color: #fff; box-shadow: 0 10px 28px rgba(35,23,15,.25);
  background: var(--buyer-card);
}
.bar.seller { background: var(--seller-card); }
.bar .foil { height: 14px; background: linear-gradient(90deg, var(--foil), var(--foil-2), var(--foil), var(--foil-2)); }
.bar .body { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 16px 18px 18px; }
.bar .role { font-family: var(--font-display); font-size: 1.5rem; font-weight: 800; }
.bar .say { font-size: 1rem; opacity: .95; margin: 2px 0 0; }
.bar .slab {
  width: 112px; height: 112px; border-radius: 10px; display: grid; place-items: center;
  background:
    linear-gradient(var(--cocoa) 0 0) padding-box,
    var(--cocoa);
  background-image:
    linear-gradient(90deg, transparent 47%, rgba(0,0,0,.35) 47% 53%, transparent 53%),
    linear-gradient(0deg, transparent 47%, rgba(0,0,0,.35) 47% 53%, transparent 53%),
    linear-gradient(145deg, var(--cocoa-2), var(--cocoa));
  box-shadow: inset 0 2px 0 rgba(255,255,255,.12), inset 0 -3px 0 rgba(0,0,0,.25);
}
.bar .slab span { font-family: var(--font-display); font-size: 3.4rem; font-weight: 800; color: var(--foil-2); text-shadow: 0 2px 0 rgba(0,0,0,.4); line-height: 1; }
.bar .slab small { display: block; color: #f6e2b0; text-align: center; font-size: .78rem; margin-top: 2px; }

/* Market */
.quotes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.quote { border-radius: var(--r-sm); padding: 10px 12px; border: 1px solid var(--line); background: var(--panel); }
.quote .q-label { font-size: .88rem; color: var(--muted); }
.quote .q-val { font-family: var(--font-display); font-size: 1.8rem; font-weight: 800; }
.quote.bid .q-val { color: var(--buyer); } .quote.ask .q-val { color: var(--seller); }
.stepper { display: grid; grid-template-columns: 56px 1fr 56px; align-items: center; gap: 8px; }
.stepper button { min-height: 56px; border-radius: 12px; font-size: 1.6rem; font-weight: 800; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
.stepper .val { text-align: center; font-family: var(--font-display); font-size: 2.4rem; font-weight: 800; }
.tape { display: flex; flex-wrap: wrap; gap: 6px; }
.tape .chip { font-weight: 700; }
.timer { font-family: var(--font-display); font-weight: 800; font-variant-numeric: tabular-nums; }
.big-timer { font-size: 2.2rem; }

/* Tables */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: right; }
th:first-child, td:first-child { text-align: left; }
th { font-weight: 700; color: var(--muted); font-size: .9rem; }
tr.eq td { background: var(--mint-soft); font-weight: 700; }

/* Teacher stepper */
ol.steps { list-style: none; padding: 0; margin: 0; counter-reset: s; }
ol.steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); }
ol.steps li::before { content: counter(s); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: .9rem; background: var(--paper); border: 1px solid var(--line); }
ol.steps li.done::before { content: "✓"; background: var(--mint); border-color: var(--mint); color: #fff; }
ol.steps li.now::before { background: var(--foil); border-color: var(--foil); color: #23170f; }
ol.steps li .btn { justify-self: start; }

.roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.roster .who { padding: 6px 8px; border-radius: var(--r-sm); border: 1px solid var(--line); font-size: .9rem; display: flex; justify-content: space-between; gap: 6px; }
.roster .who.buyer { border-left: 4px solid var(--buyer); } .roster .who.seller { border-left: 4px solid var(--seller); }
.roster .who.done { background: var(--mint-soft); }

.chart-box { position: relative; width: 100%; aspect-ratio: 16 / 9; min-height: 220px; }
.chart-box canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

/* Projector overlay */
.projector { position: fixed; inset: 0; z-index: 50; background: var(--paper); display: grid; grid-template-columns: 1fr 340px; gap: 20px; padding: calc(16px + env(safe-area-inset-top, 0px)) 20px calc(16px + env(safe-area-inset-bottom, 0px)); }
.projector .chart-box { aspect-ratio: auto; height: 100%; }
.projector .side { display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
.projector .code { font-family: var(--font-display); font-size: 3.4rem; font-weight: 800; letter-spacing: .12em; line-height: 1; }
@media (max-width: 900px) { .projector { grid-template-columns: 1fr; grid-template-rows: 1fr auto; } }

.envelope { border-radius: var(--r-md); padding: 18px; background: var(--cocoa); color: #fbf3ea; text-align: center; }
.envelope .seal { width: 54px; height: 54px; border-radius: 50%; background: var(--foil); margin: 0 auto 8px; display: grid; place-items: center; font-weight: 800; color: #23170f; }
.envelope.open { animation: openup .9s cubic-bezier(.2,.8,.2,1); }
.envelope .pred { font-family: var(--font-display); font-size: 2.2rem; font-weight: 800; color: var(--foil-2); }
@keyframes openup { 0% { transform: rotateX(70deg) scale(.9); opacity: 0; } 100% { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .envelope.open { animation: none; } }

.qr { background: #fff; padding: 8px; border-radius: 8px; width: max-content; }
.qr img, .qr canvas { display: block; }

/* Tasks */
.tier { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; margin: 18px 0 8px; display: flex; align-items: center; gap: 8px; }
.tier .chip { font-family: var(--font-body); font-weight: 400; }
.task { border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px; background: var(--panel); }
.task + .task { margin-top: 10px; }
.task.solved { border-color: var(--mint); }
.task .ref { font-size: .82rem; color: var(--muted); }
.opts { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.opt { min-width: 48px; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font-weight: 700; cursor: pointer; padding: 6px 12px; }
.opt.sel { border-color: var(--cocoa); background: var(--cocoa); color: #fbf3ea; }
.frames { font-size: .95rem; color: var(--muted); margin: 6px 0; padding-left: 18px; }
.plot svg { width: 100%; max-width: 420px; height: auto; touch-action: manipulation; user-select: none; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 8px 14px; font-weight: 700; cursor: pointer; min-height: 40px; }
.seg button.on.d { background: var(--buyer); color: #fff; } .seg button.on.s { background: var(--seller); color: #fff; }

/* Glossary */
.term { border: 0; background: none; padding: 0; font: inherit; color: inherit; text-decoration: underline dotted 2px; text-underline-offset: 3px; cursor: help; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 80; background: var(--panel); border-top: 3px solid var(--foil); padding: 16px 18px calc(18px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -8px 24px rgba(0,0,0,.18); max-width: 640px; margin: 0 auto; border-radius: 16px 16px 0 0; }
.sheet .vi { color: var(--muted); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 90; background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font-weight: 700; max-width: 92vw; text-align: center; }

.poll-bar { height: 12px; border-radius: 6px; background: var(--paper); border: 1px solid var(--line); overflow: hidden; }
.poll-bar > i { display: block; height: 100%; background: var(--foil); }

details summary { cursor: pointer; font-weight: 700; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }
.hidden { display: none !important; }
.topbar .btn.primary { background: var(--foil); border-color: var(--foil); color: #23170f; }
.dot.ok, .dot.bad, .dot.wait { padding: 0; border: 0; border-radius: 50%; width: 9px; height: 9px; }
.dot.bad { background: var(--seller); }

/* ===== Level 0 additions ===== */
.fx { position: fixed; inset: 0; pointer-events: none; z-index: 95; width: 100vw; height: 100vh; }
.lead { font-size: 1.15rem; }
.code-big { font-family: var(--font-display); font-size: 2rem; font-weight: 800; letter-spacing: .12em; line-height: 1.1; }
.art-join { width: 90px; }
.art-join svg, .art svg, .art-big svg { width: 100%; height: auto; display: block; }
kbd { font-family: var(--font-body); font-size: .72em; font-weight: 700; padding: 1px 6px; border-radius: 5px; border: 1px solid currentColor; opacity: .6; margin-left: 4px; }
@media (hover: none) { kbd { display: none; } }

/* student two-column layout for tablets and laptops */
.sgrid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .sgrid { grid-template-columns: 1fr; } }
.ask-mini { position: relative; }
.ask-mini .art { width: 92px; float: right; margin: 0 0 6px 12px; }
.ask-mini.demand { border-top: 6px solid var(--buyer-card); }
.ask-mini.supply { border-top: 6px solid var(--seller-card); }
.yn { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; clear: both; }
.yn .btn { min-height: 72px; font-size: 1.5rem; border-radius: 16px; border-width: 2px; }
.yn .btn.yes.sel { background: var(--mint); border-color: var(--mint); color: #fff; }
.yn .btn.no.sel { background: var(--seller-card); border-color: var(--seller-card); color: #fff; }
.opt.big { min-height: 60px; font-size: 1.15rem; padding: 8px 20px; }
tr.cur td { background: var(--warn-soft); font-weight: 700; }

.bdg { font-size: 1.6rem; line-height: 1; display: inline-block; }
.bdg.off { filter: grayscale(1); opacity: .3; }
.bdg.big { font-size: 2.6rem; }
.badgewall { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.bw { border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; background: var(--panel); }
.bw.locked { opacity: .45; filter: grayscale(1); }
.meter { height: 16px; border-radius: 8px; background: var(--paper); border: 1px solid var(--line); overflow: hidden; margin-top: 4px; }
.meter > i { display: block; height: 100%; background: linear-gradient(90deg, var(--foil), var(--foil-2)); transition: width .6s ease; }
.feed-item { padding: 4px 0; border-bottom: 1px dashed var(--line); }

/* robot deals */
.chat { max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px; }
.msg { max-width: 82%; padding: 8px 12px; border-radius: 14px; background: var(--paper); border: 1px solid var(--line); }
.msg .who { display: block; font-size: .78rem; color: var(--muted); font-weight: 700; }
.msg.y { align-self: flex-end; background: var(--buyer-soft); }
.dline { width: 100%; max-width: 460px; height: auto; display: block; margin: 4px 0; }

/* projector, Level 0 */
.projector.l0 { grid-template-columns: 1fr 320px; }
.pmain { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.news { display: flex; align-items: center; gap: 14px; background: var(--cocoa); color: #fbf3ea; border-radius: var(--r-md); padding: 12px 16px; font-size: clamp(1.05rem, 1.6vw, 1.4rem); }
.news .flag { background: var(--foil); color: #23170f; font-weight: 800; padding: 4px 10px; border-radius: 6px; white-space: nowrap; font-family: var(--font-display); }
.news.slide { animation: slidein .6s cubic-bezier(.2,.8,.2,1); }
@keyframes slidein { from { transform: translateY(-30px); opacity: 0; } to { transform: none; opacity: 1; } }
.pstage { flex: 1; min-height: 0; display: flex; }
.pstage > * { flex: 1; min-height: 0; }
.lobby-stage { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; }
.lobby-stage h1 { font-size: clamp(2rem, 4vw, 3.4rem); }
.art-big { width: clamp(120px, 14vw, 200px); }
.bubbles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 900px; }
.bubble { padding: 6px 14px; border-radius: 999px; background: var(--panel); border: 2px solid var(--foil); font-weight: 700; animation: pop .4s ease; }
.ask-stage { display: grid; grid-template-columns: minmax(260px, 34%) 1fr; gap: 18px; min-height: 0; }
.ask-stage.wide { grid-template-columns: 1fr minmax(240px, 30%); }
.ask-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); padding: 18px; display: flex; flex-direction: column; gap: 10px; overflow: auto; }
.ask-card.demand { border-top: 8px solid var(--buyer-card); } .ask-card.supply { border-top: 8px solid var(--seller-card); }
.ask-card .art { width: 46%; max-width: 170px; align-self: center; }
.ask-card h2 { font-size: clamp(1.3rem, 2.2vw, 2rem); }
.ask-card .story { font-size: 1.05rem; margin: 0; }
.pricetag { align-self: center; font-family: var(--font-display); font-weight: 800; font-size: clamp(2.2rem, 4.5vw, 3.8rem); background: var(--foil); color: #23170f; padding: 4px 22px; border-radius: 14px; transform: rotate(-3deg); box-shadow: 0 6px 0 rgba(0,0,0,.18); }
.yescount { display: flex; align-items: baseline; gap: 10px; justify-content: center; }
.yescount span { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.4rem, 5vw, 4.4rem); line-height: 1; }
.yescount.pop span { animation: pop .35s ease; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
.chart-box.tall { aspect-ratio: auto; height: 100%; min-height: 300px; }
.chart-box.mid { aspect-ratio: 16 / 7; }
.meet-text { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px; overflow: auto; }
.selfpace, .finish { display: flex; flex-direction: column; gap: 12px; overflow: auto; }
.roster.big .who { font-size: 1.05rem; padding: 10px; }

.fx-news-vi { font-size: clamp(1.2rem, 3.4vw, 2.4rem); color: var(--foil-2); font-weight: 700; }
.fx-news-detail { font-size: clamp(1.1rem, 3vw, 2.1rem); max-width: 36ch; }
.fx-news-tap { font-size: .9rem; opacity: .6; margin-top: 10px; }
.fx-bits { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
.fx-bit { position: absolute; top: -10%; font-size: clamp(1.6rem, 4vw, 3rem); animation: fxfall linear infinite; opacity: .9; }
.fx-news.spooky .fx-bit, .fx-news.money .fx-bit, .fx-news.health .fx-bit { animation-name: fxdrift; }
.fx-news.factory .fx-bit { animation-name: fxrise; top: auto; bottom: -10%; }
@keyframes fxfall { from { transform: translateY(0) rotate(0); } to { transform: translateY(120vh) rotate(40deg); } }
@keyframes fxdrift { 0% { transform: translate(0, 0) rotate(0); } 50% { transform: translate(30px, 60vh) rotate(-15deg); } 100% { transform: translate(-20px, 120vh) rotate(10deg); } }
@keyframes fxrise { from { transform: translateY(0); opacity: .9; } to { transform: translateY(-120vh); opacity: 0; } }

/* badge and title pop-ups */
.fx-pop { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 98; display: flex; align-items: center; gap: 12px; background: var(--panel); color: var(--ink); border: 3px solid var(--foil); border-radius: 18px; padding: 10px 18px 10px 12px; box-shadow: 0 10px 30px rgba(0,0,0,.25); animation: fxpopin .5s cubic-bezier(.2,1.4,.4,1); max-width: 92vw; }
.fx-pop.out { animation: fxpopout .3s ease forwards; }
.fx-pop.calm { animation: none; }
@keyframes fxpopin { from { transform: translate(-50%, -140%) scale(.8); } to { transform: translate(-50%, 0) scale(1); } }
@keyframes fxpopout { to { transform: translate(-50%, -140%); opacity: 0; } }
.fx-pop-icon { font-size: 2.6rem; line-height: 1; animation: fxspin 1s ease; }
@keyframes fxspin { from { transform: rotate(-200deg) scale(.3); } to { transform: none; } }
.fx-pop-head { font-size: .8rem; text-transform: uppercase; letter-spacing: .1em; color: var(--warn); font-weight: 800; }
.fx-pop-title { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; line-height: 1.15; }
.fx-pop-sub { font-size: .9rem; color: var(--muted); }

/* prize jar */
.fx-jar { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; }
.fx-jar svg { width: 92px; height: auto; display: block; overflow: visible; }
.fx-jar.big svg { width: 150px; } .fx-jar.small svg { width: 54px; }
.fx-jar-lab { font-family: var(--font-display); font-weight: 800; font-size: 1rem; }
.fx-jar.small .fx-jar-lab { font-size: .85rem; }
.fx-drop { animation: fxdrop .7s cubic-bezier(.3,1.5,.5,1) both; transform-box: fill-box; transform-origin: center; }
@keyframes fxdrop { from { transform: translateY(-110px) rotate(-90deg); opacity: 0; } 60% { opacity: 1; } to { transform: none; opacity: 1; } }

/* tap-to-price tag */
.fx-tag { display: flex; flex-direction: column; gap: 6px; }
.fx-tag-label { font-weight: 700; }
.fx-tag-row { display: grid; grid-template-columns: 64px 1fr 64px; gap: 8px; align-items: center; }
.fx-step { min-height: 60px; border-radius: 14px; font-size: 1.25rem; font-weight: 800; border: 2px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; touch-action: manipulation; }
.fx-step:active { transform: scale(.94); background: var(--paper); }
.fx-tag-card { position: relative; background: #fff8e1; color: #23170f; border: 3px solid var(--foil); border-radius: 12px 26px 26px 12px; min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 10px 6px 26px; box-shadow: 0 3px 0 rgba(0,0,0,.08); }
.fx-tag-card .fx-hole { position: absolute; left: 9px; top: 50%; width: 11px; height: 11px; margin-top: -5.5px; border-radius: 50%; background: var(--paper); border: 2px solid var(--foil); }
.fx-tag-val { font-family: var(--font-display); font-size: 2.3rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.fx-tag-card small { font-size: .8rem; color: #6d6158; }
.fx-tag.buyer .fx-tag-card { border-color: var(--buyer); } .fx-tag.seller .fx-tag-card { border-color: var(--seller); }
.fx-range { width: 100%; height: 36px; accent-color: var(--foil); margin: 0; touch-action: pan-y; }
.fx-range-ends { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); margin-top: -6px; }

/* stall */
.fx-stall { border-radius: var(--r-md); overflow: hidden; background: var(--panel); border: 2px solid var(--stall); box-shadow: var(--shadow); }
.fx-awning { height: 34px; background: repeating-linear-gradient(90deg, var(--stall) 0 26px, #fff 26px 52px); position: relative; }
.fx-awning::after { content: ''; position: absolute; left: 0; right: 0; bottom: -10px; height: 12px; background: radial-gradient(circle at 13px 0, var(--stall) 12px, transparent 13px) 0 0 / 52px 12px repeat-x, radial-gradient(circle at 39px 0, #fff 12px, transparent 13px) 0 0 / 52px 12px repeat-x; }
.fx-stall-head { display: flex; gap: 10px; align-items: center; padding: 16px 14px 6px; }
.fx-avs { font-size: 2rem; line-height: 1; display: inline-flex; gap: 2px; }
.fx-stall-name { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; color: var(--stall); line-height: 1.1; }
:root[data-theme="dark"] .fx-stall-name { filter: brightness(1.6); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .fx-stall-name { filter: brightness(1.6); } }
.fx-stall-sub { font-size: .9rem; color: var(--muted); }
.fx-shelf { padding: 4px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.fx-shelf-label { font-weight: 800; font-size: .9rem; margin-bottom: 2px; }
.fx-units { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; border-bottom: 6px solid #8a5a22; padding-bottom: 4px; }
.fx-units:has(> :only-child) { grid-template-columns: minmax(0, 160px); }
.fx-unit { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 2px; border-radius: 8px; transition: opacity .3s; }
.fx-unit-art { width: 100%; max-width: 70px; } .fx-unit-art svg { width: 100%; height: auto; display: block; }
.fx-unit-tag { font-size: .82rem; font-weight: 700; color: var(--muted); text-align: center; line-height: 1.15; }
.fx-unit.cur { background: var(--warn-soft); outline: 2px dashed var(--foil); }
.fx-unit.cur .fx-unit-tag { color: var(--ink); }
.fx-unit.sold .fx-unit-art { opacity: .18; filter: grayscale(1); }
.fx-sold { position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%) rotate(-14deg); border: 2px solid var(--mint); color: var(--mint); font-weight: 800; font-size: .8rem; padding: 0 5px; border-radius: 4px; background: var(--panel); letter-spacing: .06em; }
.fx-unit.justsold .fx-unit-art { animation: fxslide .8s ease-in both; animation-delay: var(--fxd, 0ms); }
.fx-unit.justsold .fx-sold { animation: fxstamp .5s cubic-bezier(.2,1.6,.4,1) both; animation-delay: calc(var(--fxd, 0ms) + 500ms); }
@keyframes fxslide { 0% { opacity: 1; filter: none; transform: none; } 60% { opacity: .8; transform: translate(26px, -26px) rotate(14deg); } 100% { opacity: .18; filter: grayscale(1); transform: none; } }
@keyframes fxstamp { from { transform: translate(-50%, -50%) rotate(-14deg) scale(2.4); opacity: 0; } to { transform: translate(-50%, -50%) rotate(-14deg) scale(1); opacity: 1; } }
.fx-stall-foot { border-top: 1px solid var(--line); padding: 8px 14px; font-size: .92rem; }

/* buyer wallet */
.fx-wallet { border-radius: var(--r-md); overflow: hidden; background: var(--panel); border: 2px solid var(--buyer); box-shadow: var(--shadow); }
.fx-wallet-head { display: flex; gap: 10px; align-items: center; padding: 12px 14px; background: var(--buyer); color: #fff; }
.fx-wallet-name { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; line-height: 1.1; }
.fx-wallet-sub { font-size: .9rem; opacity: .92; }
.fx-wallet-head .term { color: #fff; }
.fx-wallet-items { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.fx-witem { display: grid; grid-template-columns: 58px 1fr auto; gap: 10px; align-items: center; }
.fx-witem-art svg { width: 100%; height: auto; display: block; }
.fx-witem-txt small { color: var(--muted); }
.fx-worth { position: relative; background: #fff8e1; color: #23170f; border: 3px solid var(--buyer); border-radius: 10px 22px 22px 10px; padding: 4px 14px 4px 12px; text-align: center; min-width: 96px; }
.fx-worth small { display: block; font-size: .7rem; color: #6d6158; line-height: 1; }
.fx-worth b { font-family: var(--font-display); font-size: 1.7rem; line-height: 1.05; }
.fx-witem.bought .fx-worth { opacity: .45; }
.fx-basket { display: flex; align-items: center; gap: 6px; min-height: 52px; padding: 6px 12px 10px; border-top: 1px dashed var(--line); }
.fx-basket-ico { font-size: 1.8rem; }
.fx-binit { width: 54px; display: inline-block; } .fx-binit svg { width: 100%; height: auto; display: block; }
.fx-binit.drop { animation: fxbasket .7s cubic-bezier(.3,1.5,.5,1) both; }
@keyframes fxbasket { from { transform: translateY(-80px) rotate(-30deg); opacity: 0; } to { transform: none; opacity: 1; } }
.fx-wallet-foot { border-top: 1px solid var(--line); padding: 8px 14px; font-size: .92rem; }

/* ticker */
.fx-ticker { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; min-height: 46px; align-items: center; }
.fx-ticker::-webkit-scrollbar { display: none; }
.fx-tk { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: var(--panel); border: 2px solid var(--line); white-space: nowrap; font-size: 1rem; }
.fx-tk b { font-family: var(--font-display); font-size: 1.1rem; }
.fx-tk i { font-style: normal; font-size: .8rem; color: var(--muted); }
.fx-tk.up { border-color: var(--mint); } .fx-tk.up i { color: var(--mint); }
.fx-tk.down { border-color: var(--seller); } .fx-tk.down i { color: var(--seller); }
.fx-tk small { color: var(--muted); }
.fx-tk-art { width: 22px; display: inline-block; } .fx-tk-art svg { width: 100%; height: auto; display: block; }
.fx-tk.new { animation: fxtk .5s cubic-bezier(.2,1.4,.4,1); }
@keyframes fxtk { from { transform: translateX(-30px) scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
.timer.late { color: #e0303a; animation: fxlate 1s steps(2) infinite; }
.topbar .timer.late { color: #ff8a8a; }
@keyframes fxlate { 50% { opacity: .55; } }

/* pickers */
.fx-pick-lab { font-weight: 700; margin-bottom: 6px; }
.fx-avgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 6px; }
.fx-av { font-size: 1.7rem; min-height: 50px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel); cursor: pointer; line-height: 1; }
.fx-av.sel { border-color: var(--foil); background: var(--warn-soft); transform: scale(1.06); }
.fx-teams { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.fx-team { min-height: 52px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.fx-team small { font-weight: 400; color: var(--muted); font-size: .8rem; }
.fx-team.sel { border-color: var(--team); box-shadow: inset 0 0 0 2px var(--team); }
.fx-title { font-weight: 700; }

/* leaderboard, teams, podium */
.fx-lb { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.fx-lb li { display: grid; grid-template-columns: 34px 34px 1fr auto; gap: 6px; align-items: center; padding: 6px 10px; border-radius: 10px; background: var(--paper); border: 1px solid var(--line); }
.fx-lb-rank { font-size: 1.3rem; text-align: center; font-weight: 800; color: var(--muted); }
.fx-lb-av { font-size: 1.5rem; }
.fx-lb-nick { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fx-lb-nick small { font-weight: 400; color: var(--muted); }
.fx-lb b { font-family: var(--font-display); }
.fx-improved { margin-top: 8px; padding: 6px 10px; border-radius: 10px; background: var(--mint-soft); }
.fx-improved.big { font-size: 1.4rem; padding: 10px 16px; }
.fx-teambars { display: flex; flex-direction: column; gap: 8px; }
.fx-tb-top { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; }
.fx-tb-top small { color: var(--muted); font-weight: 400; }
.fx-tb-bar { height: 14px; border-radius: 7px; background: var(--paper); border: 1px solid var(--line); overflow: hidden; }
.fx-tb-bar i { display: block; height: 100%; transition: width .6s ease; }
.fx-podium-wrap { position: fixed; inset: 0; z-index: 94; background: radial-gradient(ellipse at top, var(--panel), var(--paper)); display: flex; padding: 20px; overflow: auto; }
.fx-podium-inner { margin: auto; width: min(1100px, 100%); display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.fx-podium-inner h1 { font-size: clamp(1.8rem, min(5vw, 6vh), 3.8rem); margin: 0; }
.fx-podium-inner .lead { margin: 0; }
.fx-podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: end; width: min(900px, 100%); }
.fx-pod { display: flex; flex-direction: column; align-items: stretch; }
.fx-pod-who { opacity: 0; transform: translateY(30px) scale(.8); transition: all .6s cubic-bezier(.2,1.4,.4,1); padding-bottom: 8px; }
.fx-pod.in .fx-pod-who { opacity: 1; transform: none; }
.fx-pod-av { font-size: clamp(2.6rem, min(8vw, 9vh), 6rem); line-height: 1; }
.fx-pod-nick { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.2rem, 2.6vw, 2rem); }
.fx-pod-val { color: var(--muted); font-size: clamp(1rem, 1.8vw, 1.4rem); }
.fx-pod-step { border-radius: 14px 14px 0 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 8px; font-size: clamp(1.4rem, 3vh, 2.2rem); color: #23170f; line-height: 1.1; }
.fx-pod-step b { font-family: var(--font-display); font-size: clamp(1.6rem, min(5vw, 6vh), 3.6rem); line-height: 1; }
.fx-pod.p1 .fx-pod-step { height: min(230px, 24vh); background: linear-gradient(var(--foil-2), var(--foil)); }
.fx-pod.p2 .fx-pod-step { height: min(170px, 18vh); background: linear-gradient(#e8e8ee, #b9bcc6); }
.fx-pod.p3 .fx-pod-step { height: min(120px, 13vh); background: linear-gradient(#f0c9a0, #c58a52); }
.fx-podium-teams { width: min(700px, 100%); text-align: left; }
@media (max-width: 640px) { .fx-pod.p1 .fx-pod-step { height: 150px; } .fx-pod.p2 .fx-pod-step { height: 110px; } .fx-pod.p3 .fx-pod-step { height: 80px; } }

/* prediction cards */
.fx-predict { border: 3px solid var(--foil); border-radius: var(--r-md); background: var(--warn-soft); padding: 12px 14px; }
.fx-predict h3 { margin: 0 0 6px; }
.fx-arrows { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.fx-arrow { min-height: 72px; border-radius: 14px; border: 2px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; font-weight: 800; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 1rem; }
.fx-arrow span { font-size: 2rem; line-height: 1; }
.fx-arrow.sel { border-color: var(--foil); box-shadow: inset 0 0 0 2px var(--foil); background: #fff8e1; color: #23170f; }

/* replay and floor charts on the projector */
.fx-replay { position: absolute; right: 10px; top: 8px; z-index: 2; }
.fx-chart-wrap { position: relative; }

/* grids never grow wider than the screen (a long ticker scrolls inside its panel instead) */
.sgrid > *, .tradegrid > *, .grid2 > *, .deal-grid > * { min-width: 0; }
.fx-ticker { max-width: 100%; }
@media (max-width: 900px) { .topbar #hConn, .topbar #sConn { font-size: 0; gap: 0; padding: 6px 8px; } .topbar .fx-lab { display: none; } }

/* ===== news broadcast (three scenes) ===== */
.fx-bc { position: fixed; inset: 0; z-index: 98; display: flex; flex-direction: column; color: #fbf3ea; overflow: hidden; cursor: pointer; background: radial-gradient(ellipse at 50% 30%, #3a2a20, #120b07); animation: fxin .35s ease; }
.fx-bc.hidden { display: none; }
.fx-bc.storm { background: linear-gradient(180deg, #17222f 0%, #24384d 55%, #1d2b1f 100%); }
.fx-bc.spooky { background: linear-gradient(180deg, #120a24 0%, #3a1748 60%, #2a1406 100%); }
.fx-bc.harvest { background: linear-gradient(180deg, #f2b44a 0%, #b0661c 55%, #5c3a12 100%); }
.fx-bc.money, .fx-bc.health { background: linear-gradient(180deg, #0f4a33 0%, #1d6b4a 60%, #10301f 100%); }
.fx-bc.factory { background: linear-gradient(180deg, #3b3f46 0%, #5a5f68 55%, #26282c 100%); }
.fx-bc-top { display: flex; align-items: center; gap: 14px; padding: 10px 18px; background: rgba(0,0,0,.45); font-weight: 800; font-size: clamp(.9rem, 2vw, 1.25rem); position: relative; z-index: 3; }
.fx-bc-live { color: #ff4d4d; animation: fxlate 1.2s infinite; letter-spacing: .08em; }
.fx-bc-chan { flex: 1; }
.fx-bc-clock { font-variant-numeric: tabular-nums; opacity: .85; }
.fx-bc-strip { background: #c62828; color: #fff; font-family: var(--font-display); font-weight: 800; letter-spacing: .1em; padding: 9px 0; overflow: hidden; white-space: nowrap; position: relative; z-index: 3; font-size: clamp(1rem, 2.6vw, 1.7rem); }
.fx-bc-strip span { display: inline-block; padding-left: 100%; animation: fxmarquee 14s linear infinite; }
.fx-bc.calm .fx-bc-strip span { animation: none; padding-left: 16px; }
.fx-bc-stage { flex: 1; position: relative; min-height: 0; }
.fx-bc-scene { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 18px 20px; gap: 10px; }
.fx-bc-scene.on { display: flex; animation: fxin .45s ease; }
.fx-bc-icon { font-size: clamp(4.5rem, 16vw, 10rem); line-height: 1; animation: fxbounce 1s cubic-bezier(.3,1.6,.5,1); filter: drop-shadow(0 8px 20px rgba(0,0,0,.4)); }
.fx-bc-title { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.1rem, 7.5vw, 5.4rem); line-height: 1.05; max-width: 20ch; text-shadow: 0 4px 18px rgba(0,0,0,.45); }
.fx-bc-vi { font-size: clamp(1.25rem, 3.6vw, 2.5rem); color: #f7d36b; font-weight: 800; }
.fx-bc-scene.s2 { flex-direction: row; gap: clamp(12px, 3vw, 40px); align-items: stretch; justify-content: center; }
.fx-bc-art { position: relative; flex: 0 1 44%; min-width: 220px; border-radius: 22px; overflow: hidden; background: rgba(0,0,0,.25); box-shadow: inset 0 0 0 3px rgba(255,255,255,.12); display: flex; flex-direction: column; justify-content: space-between; padding: 14px 10px; }
.fx-bc-art > div { display: flex; justify-content: space-around; font-size: clamp(2rem, 6vw, 4.6rem); line-height: 1; position: relative; z-index: 1; }
.fx-bc-art .a-mid { font-size: clamp(1.4rem, 4vw, 3rem); }
.fx-bc-art .a-ground span { animation: fxbob 1.8s ease-in-out infinite; animation-delay: calc(var(--i) * .2s); display: inline-block; }
.fx-bc-art .a-flash { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
.art-storm { background: linear-gradient(180deg, #0e1620, #2c4560); }
.art-storm .a-sky span { animation: fxcloud 4s ease-in-out infinite alternate; animation-delay: calc(var(--i) * -.7s); display: inline-block; }
.art-storm .a-mid span { animation: fxrain 0.9s linear infinite; animation-delay: calc(var(--i) * .15s); display: inline-block; }
.art-storm .a-flash { background: #fff; opacity: 0; animation: fxlightning 3.2s infinite; }
.art-storm::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(105deg, rgba(180,210,255,.18) 0 2px, transparent 2px 14px); animation: fxsheet .5s linear infinite; z-index: 0; }
.art-spooky { background: radial-gradient(circle at 75% 20%, #3d2b63, #120a24 70%); }
.art-spooky .a-sky { justify-content: flex-end; padding-right: 8%; }
.art-spooky .a-sky span { animation: fxglow 2.4s ease-in-out infinite alternate; display: inline-block; }
.art-spooky .a-mid span { animation: fxbat 3.2s ease-in-out infinite; animation-delay: calc(var(--i) * -.8s); display: inline-block; }
.art-harvest { background: linear-gradient(180deg, #ffcf6b, #c9792a); }
.art-harvest .a-sky span { animation: fxsun 3s ease-in-out infinite alternate; display: inline-block; }
.art-harvest .a-mid span { animation: fxwind 1.6s linear infinite; animation-delay: calc(var(--i) * .5s); display: inline-block; }
.art-harvest .a-ground { filter: saturate(.6) sepia(.4); }
.art-money .a-sky span, .art-health .a-sky span { animation: fxrain 1.6s linear infinite; animation-delay: calc(var(--i) * .3s); display: inline-block; }

async function initCrypto() { if (!(window.crypto && crypto.subtle)) return; T.kp = await crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveKey']); T.pk = await crypto.subtle.exportKey('jwk', T.kp.publicKey); }
async function keyFor(pid) {
  if (!T.kp || !T.s.pks[pid]) return null;
  if (!T.keys[pid]) T.keys[pid] = (async () => { const pub = await crypto.subtle.importKey('jwk', T.s.pks[pid], { name: 'ECDH', namedCurve: 'P-256' }, false, []); return crypto.subtle.deriveKey({ name: 'ECDH', public: pub }, T.kp.privateKey, { name: 'AES-GCM', length: 256 }, false, ['encrypt']); })().catch(() => null);
  return T.keys[pid];
}
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
async function sendPrivate(pid, payload) {
  const key = await keyFor(pid);
  if (key) { const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(payload))); tSend({ type: 'you', to: pid, iv: b64(iv), ct: b64(ct) }); }
  else tSend({ type: 'you', to: pid, you: payload });
}
function tSend(m) { T.tr && T.tr.send({ ...m, from: 'teacher', room: T.s.room }); }

/* ---- roles ---- */
function dealRoles(newShops) {
  const s = T.s, hs = s.humans.map(h => h.pid);
  const nShopPeople = Math.min(hs.length, 5 * s.team);
  let pool = hs.slice().sort(() => Math.random() - .5);
  if (newShops) pool.sort((a, b) => (s.wasShop[a] ? 1 : 0) - (s.wasShop[b] ? 1 : 0)); // people who haven't run a shop go first
  const shopPeople = pool.slice(0, hs.length >= 8 ? nShopPeople : Math.min(nShopPeople, Math.floor(hs.length / 2)));
  s.roles = {}; s.shopNames = {};
  shopPeople.forEach((pid, i) => { const shop = M2.SHOP_IDS[i % 5]; s.roles[pid] = 'shop:' + shop; s.wasShop[pid] = true; });
  hs.forEach(pid => { if (!s.roles[pid]) s.roles[pid] = 'buyer'; });
  s.phase = 'dealt'; Sound.play('sting');
  { const nb = hs.filter(pid => s.roles[pid] === 'buyer').length; if (!s.botsOn && nb < 19) toast(`Robots are off: ${nb} buyer card${nb === 1 ? '' : 's'}, so the demand curve has only ${nb} step${nb === 1 ? '' : 's'} and some shocks may not move the price. Turn robots on for the full 19 cards.`, 6000); }
  tSave(); renderBody(); youAll(); tBroadcast(true);
}
function buyerSlots() { const nb = T.s.humans.filter(h => T.s.roles[h.pid] === 'buyer').length; return M2.buyerCards(Math.max(T.s.botsOn ? 19 : 0, nb)); }

/* ---- rounds ---- */
function startRound(step) {
  const s = T.s; if (s.current) return;
  if (!Object.keys(s.roles).length) dealRoles();
  const cards = buyerSlots();
  const humansB = s.humans.filter(h => s.roles[h.pid] === 'buyer').map(h => h.pid);
  const order = cards.map(c => c.id).sort(() => Math.random() - .5);        // new cards every round
  const holder = {}; humansB.forEach((pid, i) => { holder[order[i]] = pid; });
  if (step.fromPlan) s.events.forEach(e => { if (!(step.events || []).includes(e.key)) e.active = false; });
  (step.events || []).forEach(key => { const ev = EVENTS3.find(e => e.key === key); if (ev && !s.events.find(e => e.key === key && e.active)) s.events.push({ ...ev, id: rid(5), active: true }); });
  if (step.lock) s.lock = { ...step.lock };
  const ev = activeEvents();
  const n = s.rounds.length + 1, len = step.len || s.roundLen;
  if (s.pred && s.pred.open) { s.pred.open = false; s.pred.round = n; }
  const eq = Object.fromEntries(PX().map(p => [p, M2.equilibrium(cards, p, ev)]));
  const sur = Object.fromEntries(PX().map(p => [p, M2.surplus(cards, p, ev)]));
  const lockQ = s.lock ? M2.atPrice(cards, s.lock.product, ev, s.lock.price) : null;
  s.rounds.push({ n, label: step.label || `Round ${n}`, practice: !!step.practice, mode: step.mode || 'offers', cards: cards.map(c => ({ ...c })), holder, events: s.events.filter(e => e.active).map(e => ({ key: e.key, icon: e.icon, label: e.label, detail: e.detail })), ev, lock: s.lock ? { ...s.lock } : null, lockQ, eq, sur, trades: [], startedAt: Date.now() });
  s.current = { idx: s.rounds.length - 1, endsAt: Date.now() + len * 1000 };
  s.phase = 'running'; if (step.board != null) s.board.visible = step.board;
  T.R = M2.createRound({ n, slots: cards.map(c => ({ slot: c.id, card: c })), events: ev, lock: s.lock, mode: step.mode || 'offers' });
  T.asks = {}; T.lastAsk = {}; T.away = {}; M2.SHOP_IDS.forEach(sh => { T.asks[sh] = {}; T.lastAsk[sh] = {}; T.away[sh] = {}; });
  T.offers.clear();
  const prevR = s.rounds[s.rounds.length - 2], fresh = s.events.filter(e => e.active && !((prevR && prevR.events) || []).some(f => f.key === e.key));
  T.hold = 0;
  if (fresh.length && fresh.every(e => (s.newsShown || []).includes(e.key))) FX.news({ icon: fresh.map(e => e.icon).join(' '), kicker: 'THE NEWS IS HERE · TIN ĐÃ ĐẾN', title: (step.label || `Round ${n}`) + ': trade!', vi: fresh.map(e => e.vi || '').filter(Boolean).join(' + '), detail: fresh.map(e => e.detail).join(' · '), theme: fresh[fresh.length - 1].key, ms: 4500 });
  else if (fresh.length) { T.hold = FX.broadcast(newsOpts(fresh, { when: 'now' })); s.current.endsAt += T.hold; s.newsShown = fresh.map(e => e.key); }
  else { Sound.play('sting'); FX.news({ icon: step.mode === 'menu' ? '📋' : step.mode === 'fast' ? '⚡' : '🔔', kicker: 'NEW ROUND · VÒNG MỚI', title: step.label || `Round ${n}`, detail: (step.mode || 'offers') === 'fast' ? 'Fast mode: post offers and asks. Trades happen automatically.' : step.mode === 'menu' ? 'Menu prices: each shop chooses ONE price for the whole round.' : 'Shops post prices. Buyers buy, or make an offer.', theme: 'round', ms: 3500, sound: false }); }
  tSave(); renderBody(); youAll(); tBroadcast(true); if (T.projector) renderProj(true);
  clearInterval(T.tick);
  T.tick = setInterval(() => {
    if (!s.current) return;
    const left = Math.round((s.current.endsAt - Date.now()) / 1000);
    expireOffers();
    if (left <= 0) endRound(); else { updateTimer(); if (left % 3 === 0) tBroadcast(true); }
  }, 1000);
  if (T.hold) { const R0 = T.R; setTimeout(() => { if (T.R === R0 && T.s.current) startBots(len); }, T.hold); } else startBots(len); // robots wait for the news to finish
}
function endRound() {
  const s = T.s; if (!s.current) return;
  clearInterval(T.tick); stopBots();
  T.offers.forEach(o => { if (o.status === 'open') o.status = 'expired'; });
  const r = curRound(); r.endedAt = Date.now();
  if (r.mode === 'menu') r.menu = M2.SHOP_IDS.map(sh => PX().map(p => { const price = T.asks[sh][p]; const willing = price == null ? 0 : [0, 1, 2, 3].filter(u => M2.costOf(sh, p, u, r.ev) <= price).length; const sold = r.trades.filter(x => x.shop === sh && x.product === p).length; return { shop: sh, product: p, price: price ?? null, sold, unsold: Math.max(0, willing - sold), away: Object.keys(T.away[sh][p] || {}).length }; })).flat();
  if (!r.practice) roundAwards(r);
  if (s.pred && s.pred.round === r.n && !s.pred.result) judgePred(r);
  s.newsShown = []; s.revealed[r.n] = true; if (s.board.view === 'live' || s.board.view === 'chart') s.board.view = 'floor';
  T.revealAnim = { n: r.n, t0: Date.now() + 6800 };
  setTimeout(() => { FX.news({ ...revealInfo(r), ms: 6000 }); }, 700);
  setTimeout(animReveal, 6800);
  s.current = null; s.phase = 'between'; T.R = null;
  Sound.play('fanfare'); tSave(); renderBody(); youAll(); tBroadcast(true); if (T.projector) renderProj(true);
}
const slotOf = (r, pid) => Object.keys(r.holder).find(k => r.holder[k] === pid) || null;
const pidOfSlot = (r, slot) => r.holder[slot] || null;

/* ---- recording a trade, earnings ---- */
function recordTrade(t) {
  const s = T.s, r = curRound();
  const buyer = pidOfSlot(r, t.slot);
  const rec = { ...t, buyer, shopPids: shopMembers(t.shop), at: Date.now() };
  r.trades.push(rec);
  if (!r.practice) {
    if (buyer) addEarn(buyer, r.n, t.gain);
    const sp = rec.shopPids; sp.forEach(pid => addEarn(pid, r.n, t.profit / sp.length));
    if (buyer && t.gain >= 5) award(buyer, 'bargain');
    if (T.R.stock(t.shop, t.product) <= 0) sp.forEach(pid => award(pid, 'sellout'));
  }
  if (buyer) award(buyer, 'firstdeal'); rec.shopPids.forEach(pid => award(pid, 'firstdeal'));
  // close other offers that can no longer happen
  T.offers.forEach(o => { if (o.status === 'open' && ((o.slot === t.slot && o.product === t.product) || (o.shop === t.shop && o.product === t.product && T.R.stock(t.shop, t.product) <= 0))) { o.status = 'closed'; notifyOffer(o); } });
  if (T.asks[t.shop] && T.R.stock(t.shop, t.product) <= 0 && r.mode !== 'menu') delete T.asks[t.shop][t.product];
  if (r.mode === 'fast') {
    const last = (T.lastAsk[t.shop] || {})[t.product], R = T.R;
    if (last != null) setTimeout(() => {
      if (T.R !== R) return;
      const nc = R.nextCost(t.shop, t.product);
      if (nc != null && last >= nc && !R.book[t.product].asks.has(t.shop)) { const res = R.ask(t.shop, t.product, last); if (res.trade) recordTrade(res.trade); else { shopMembers(t.shop).forEach(you); tBroadcast(); } }
      else { delete T.lastAsk[t.shop][t.product]; shopMembers(t.shop).forEach(you); }
    }, 250);
  }
  Sound.play('cash'); tickerAdd(rec); floorPing();
  tSave(); [buyer, ...rec.shopPids].filter(Boolean).forEach(you); tBroadcast(); renderLive();
}
function addEarn(pid, n, v) { const e = (T.s.earnings[pid] ||= {}); e[n] = Math.round(((e[n] || 0) + v) * 10) / 10; }

/* ---- offers (shops + offers mode) ---- */
function openOffersFor(shop) { let n = 0; T.offers.forEach(o => { if (o.status === 'open' && o.shop === shop) n++; }); return n; }
function makeOffer(pid, slot, shop, product, price) {
  const R = T.R, r = curRound();
  if (!R || r.mode !== 'offers') return 'no-round';
  const pre = R.check(slot, shop, product, price);
  if (pre && pre !== 'below-cost') return pre;               // shops decide on offers below their cost
  for (const o of T.offers.values()) if (o.status === 'open' && o.slot === slot && o.product === product) return 'one-offer';
  if (openOffersFor(shop) >= MAX_OFFERS_PER_SHOP) return 'busy';
  const o = { id: rid(8), slot, buyer: pid, shop, product, price, by: 'buyer', status: 'open', expires: Date.now() + OFFER_SECS * 1000 };
  T.offers.set(o.id, o); notifyOffer(o); Sound.play('blip');
  if (!isShopHuman(shop)) botShopRespond(o);
  return null;
}
function respondOffer(o, by, action, price) {
  if (!o || o.status !== 'open') return 'expired';
  if (action === 'decline') { o.status = 'declined'; notifyOffer(o); return null; }
  if (action === 'accept') {
    if (o.by === by) return 'not-yours';
    const res = T.R.trade(o.slot, o.shop, o.product, o.price, 'offer');
    if (!res.ok) { o.status = 'closed'; notifyOffer(o); return res.error; }
    o.status = 'accepted'; notifyOffer(o); recordTrade(res.trade); return null;
  }
  if (action === 'counter') {
    price = Math.round(price);
    if (by === 'shop') { const c = T.R.nextCost(o.shop, o.product); if (c == null) return 'sold-out'; if (price < c) return 'below-cost'; }
    if (by === 'buyer' && price > T.R.val(o.slot, o.product)) return 'above-value';
    if (T.R.lock && T.R.lock.product === o.product && price !== T.R.lock.price) return 'locked';
    o.price = price; o.by = by; o.expires = Date.now() + OFFER_SECS * 1000; notifyOffer(o);
    if (by === 'shop' && !o.buyer) botBuyerRespond(o);
    if (by === 'buyer' && !isShopHuman(o.shop)) botShopRespond(o);
    return null;
  }
  return 'bad';
}
function expireOffers() { const now = Date.now(); T.offers.forEach(o => { if (o.status === 'open' && now > o.expires) { o.status = 'expired'; notifyOffer(o); } }); }
function offerView(o) { return { id: o.id, shop: o.shop, product: o.product, price: o.price, by: o.by, status: o.status, left: Math.max(0, Math.round((o.expires - Date.now()) / 1000)), buyerNo: o.slot ? o.slot.replace(/^\D+/, '') : '' }; }
function notifyOffer(o) {
  if (o.buyer) you(o.buyer);
  shopMembers(o.shop).forEach(you);
  if (T.projector) projDynamic();
}

/* ---- messages from students ---- */
function tOnMsg(m) {
  if (!m || m.from === 'teacher') return;
  if (m.type === 'whois') return tBroadcast(true);
  const s = T.s;
  if (m.type === 'check2') {
    if (!s.ck || m.id !== s.ck.id || !s.humans.find(h => h.pid === m.pid)) return;
    (s.checks2 ||= {})[m.pid] = { score: m.score | 0, total: m.total | 0, items: (m.items || []).slice(0, 12).map(x => ({ id: String(x.id), correct: !!x.correct })) };
    Sound.play('pop'); tSave(); renderBody(); if (T.projector) renderProj(true); return;
  }
  if (m.type === 'hello') {
    if (m.pk && JSON.stringify(s.pks[m.pid]) !== JSON.stringify(m.pk)) { s.pks[m.pid] = m.pk; delete T.keys[m.pid]; }
    if (!s.humans.find(h => h.pid === m.pid)) { s.humans.push({ pid: m.pid, nick: String(m.nick || 'Student').slice(0, 18), at: Date.now() }); Sound.play('pop'); if (Object.keys(s.roles).length) s.roles[m.pid] = 'buyer'; }
    const hu = human(m.pid); if (FX.AVATARS.includes(m.av)) hu.av = m.av; if (FX.TEAMS[m.team]) hu.team = m.team;
    tSave(); renderBody(); you(m.pid); tBroadcast(true); return;
  }
  if (!s.humans.find(h => h.pid === m.pid)) return;
  if (DB.Tch.onMsg(m)) return;
  if (m.type === 'pred') {
    const P = s.pred;
    if (P && P.open && P.id === m.id && P.products.includes(m.product) && DIRS[m.dir]) { (P.answers[m.pid] ||= {})[m.product] = m.dir; Sound.play('blip'); tSave(); renderBody(); you(m.pid); tBroadcast(); if (T.projector) projDynamic(); }
    return;
  }
  if (m.type === 'shopname') {
    const role = s.roles[m.pid] || '';
    if (role.startsWith('shop:')) { const nm = String(m.name || '').replace(/\s+/g, ' ').trim().slice(0, 16); if (nm) { s.shopNames[role.slice(5)] = nm; Sound.play('pop'); tSave(); renderBody(); shopMembers(role.slice(5)).forEach(you); tBroadcast(true); } }
    return;
  }
  const r = curRound(), R = T.R, role = s.roles[m.pid] || '', shop = role.startsWith('shop:') ? role.slice(5) : null;
  const slot = r ? slotOf(r, m.pid) : null;
  const fail = e => { tSend({ type: 'ack', to: m.pid, ok: false, error: e }); return e; };
  if (!R || !r) return fail('no-round');
  const price = Math.round(Number(m.price));
  let err = null;
  if (m.product && !PX().includes(m.product)) return fail('bad-product');
  switch (m.type) {
    case 'buy': { // buyer buys at a shop's posted (or menu) price
      if (!slot) return fail('no-card');
      const ask = (T.asks[m.shop] || {})[m.product];
      if (ask == null) return fail('bad-price');
      const res = R.trade(slot, m.shop, m.product, ask, r.mode === 'menu' ? 'menu' : 'posted');
      if (!res.ok) { if (r.mode === 'menu' && (res.error === 'sold-out' || res.error === 'below-cost') && ask <= R.val(slot, m.product)) { (T.away[m.shop][m.product] ||= {})[slot] = 1; return fail('not-for-sale'); } return fail(res.error); }
      recordTrade(res.trade); break;
    }
    case 'offer': if (!slot) return fail('no-card'); err = makeOffer(m.pid, slot, m.shop, m.product, price); break;
    case 'respond': {
      const o = T.offers.get(m.id); if (!o) return fail('expired');
      const by = shop && o.shop === shop ? 'shop' : o.buyer === m.pid ? 'buyer' : null; if (!by) return fail('not-yours');
      err = respondOffer(o, by, m.action, price); break;
    }
    case 'setask': {
      if (!shop) return fail('bad');
      const c = R.nextCost(shop, m.product); if (c == null) return fail('sold-out');
      if (price < c) return fail('below-cost');
      if (R.lock && R.lock.product === m.product && price !== R.lock.price) return fail('locked');
      if (r.mode === 'menu' && T.asks[shop][m.product] != null) return fail('menu-set');
      T.asks[shop][m.product] = price; shopMembers(shop).forEach(you); tBroadcast(); renderLive(); break;
    }
    case 'bid': { if (!slot) return fail('no-card'); const res = R.bid(slot, m.product, price); if (!res.ok) return fail(res.error); if (res.trade) recordTrade(res.trade); else { you(m.pid); tBroadcast(); } break; }
    case 'ask': { if (!shop) return fail('bad'); T.lastAsk[shop][m.product] = price; const res = R.ask(shop, m.product, price); if (!res.ok) return fail(res.error); if (res.trade) recordTrade(res.trade); else { shopMembers(shop).forEach(you); tBroadcast(); } break; }
    case 'cancel': { if (slot) R.cancelBid(slot, m.product); if (shop) { R.cancelAsk(shop, m.product); delete T.lastAsk[shop][m.product]; } you(m.pid); tBroadcast(); break; }
    default: return;
  }
  if (err) return fail(err);
  tSend({ type: 'ack', to: m.pid, ok: true });
}

/* ---- what each student sees privately ---- */

    sold: R ? Object.fromEntries(PX().map(p => [p, R.sold[shop][p]])) : { choc: 0, candy: 0 },
    asks: { ...(T.asks && T.asks[shop] || {}) }, keep: { ...(T.lastAsk && T.lastAsk[shop] || {}) }, myAsks: live && R ? Object.fromEntries(PX().map(p => [p, (R.book[p].asks.get(shop) || {}).price ?? null])) : null,
    offers, mine: r.trades.filter(t => t.shop === shop).map(t => ({ product: t.product, price: t.price, profit: t.profit, buyerNo: t.slot.replace(/^\D+/, '') })) };
}
const you = pid => { if (pid) sendPrivate(pid, youFor(pid)); };
const youAll = () => T.s.humans.forEach(h => you(h.pid));

}

function functionsHtml(rd) {

  const s = T.s, idx = s.rounds.indexOf(rd), keys = (rd.events || []).map(e => e.key);
  const prev = s.rounds.slice(0, idx).reverse().find(x => !x.practice && (x.events || []).every(e => keys.includes(e.key)) && JSON.stringify(x.ev) !== JSON.stringify(rd.ev));
  if (!prev || JSON.stringify(prev.ev) === JSON.stringify(rd.ev)) return '';
  const parts = PX().map(p => {
    const a = M2.adjustment(rd.cards, p, prev.ev, rd.ev); if (!a || a.direction === 'none') return '';
    const up = a.direction === 'up', gap = Math.abs(a.gapAtOld), st = M2.stats(rd.trades, p);
    return `<div class="func"><h3>${PROD[p].name}: from ${k(a.P1)} towards ${k(a.P2)}</h3><ol class="funcs">
      <li><b>Signal.</b> At the old price of ${k(a.P1)}, buyers want <b>${a.qdAtOld}</b> but shops offer <b>${a.qsAtOld}</b>: a <b>${up ? 'shortage' : 'surplus'} of ${gap}</b>. The price ${up ? 'rises' : 'falls'}.</li>
      <li><b>Incentive.</b> ${up ? `At a higher price, more units are worth selling: quantity supplied <b>extends</b> from ${a.qsAtOld} to ${a.Q2}.` : `At a lower price, fewer units are worth selling: quantity supplied <b>contracts</b> from ${a.qsAtOld} to ${a.Q2}.`}</li>
      <li><b>Rationing.</b> ${up ? `The higher price makes some buyers drop out: quantity demanded <b>contracts</b> from ${a.qdAtOld} to ${a.Q2}.` : `The lower price brings in more buyers: quantity demanded <b>extends</b> from ${a.qdAtOld} to ${a.Q2}.`}</li>
      <li><b>New equilibrium:</b> about ${k(a.P2)} with ${a.Q2} sold.${st.n ? ` <span class="muted">In your class: average ${k(st.mean)}, ${st.n} sold.</span>` : ''}</li></ol></div>`;
  }).join('');
  return parts ? `<div class="funcbox"><h2 style="margin:0 0 6px">Signal, incentive, rationing</h2><p class="muted" style="margin:0 0 8px">Compared with ${esc(prev.label)}: ${rd.events.filter(e => !(prev.events || []).some(f => f.key === e.key)).map(e => e.icon + ' ' + esc(e.label)).join(', ') || 'the events ended'}</p>${parts}</div>` : '';
}

  }).join('');
  const inbox = offers.length ? offers.map(o => o.by === 'buyer' ? `<div class="offer">Buyer card <b>${o.buyerNo}</b> offers <b>${k(o.price)}</b> for ${PROD[o.product].name.toLowerCase()} · <span data-left="${o.left}">${o.left}s</span>
      ${S.compose && S.compose.id === o.id ? `<div class="stack" style="gap:6px;margin-top:6px">${stepper('c', S.compose.price, 'your counter', me.costs[o.product][me.sold[o.product]] ?? 1, 35)}<div class="row" style="gap:6px"><button class="btn small primary" data-a="sendcounter">Counter ${pv('c', S.compose.price)}</button><button class="btn small ghost" data-a="close">✕</button></div></div>` :
      `<div class="row" style="gap:6px;margin-top:6px"><button class="btn small seller" data-a="accept" data-id="${o.id}">Accept</button><button class="btn small" data-a="counter" data-id="${o.id}">Counter</button><button class="btn small ghost" data-a="decline" data-id="${o.id}">Decline</button></div>`}</div>` :
      `<div class="offer counter">You countered card <b>${o.buyerNo}</b>: ${PROD[o.product].name.toLowerCase()} for <b>${k(o.price)}</b> · waiting <span data-left="${o.left}">${o.left}s</span></div>`).join('') : '<p class="muted" style="margin:0">No offers yet. Buyers can buy at your price, or send you an offer.</p>';
  const inboxPanel = S.pub.round.mode === 'menu' ? '' : `<div class="panel stack"><h3 style="margin:0">Offers from buyers</h3>${inbox}</div>`;
  return `<div class="tradegrid"><div class="stack">${shopCard()}${earnBox()}</div><div class="stack">${inboxPanel}<div class="pricerow">${priceBoxes}</div>${tapeHtml()}</div></div>`;
}
function shopFast() {
  const p = S.pub, me = S.me;
  return `<div class="tradegrid"><div class="stack">${shopCard()}${earnBox()}</div><div class="stack">${PX().map(pr => {
    const b = p.book && p.book[pr] || {}, next = me.sold[pr] < 4 ? me.costs[pr][me.sold[pr]] : null, key = 'f' + pr;
    if (S.price[key] == null || (next != null && S.price[key] < next)) S.price[key] = next != null ? next + 4 : 10;
    const fixed = p.lock && p.lock.product === pr;
    return `<div class="panel stack fastp ${pr}"><h3 style="margin:0"><span class="mini-art">${ART3[pr]}</span>${PROD[pr].name}: <span class="muted">${4 - me.sold[pr]} left</span></h3>
      ${next == null ? '<p class="muted" style="margin:0">Sold out.</p>' : `<div class="quotes"><div class="quote bid"><div class="q-label">Highest offer</div><div class="q-val">${k(b.bid)}</div></div><div class="quote ask"><div class="q-label">Lowest ask</div><div class="q-val">${k(b.ask)}</div></div></div>
      <button class="btn block seller" data-a="fastsell" data-p="${pr}" ${b.bid != null && b.bid >= next ? '' : 'disabled'}>Sell now ${b.bid != null ? 'for ' + k(b.bid) : ''}</button>
      ${fixed ? '' : stepper(key, S.price[key], 'next unit: lowest ' + k(next), next, Math.max(next + 15, 30))}<div class="row"><button class="btn primary" data-a="ask" data-p="${pr}">Ask ${fixed ? k(p.lock.price) : pv(key, S.price[key])}</button>${me.myAsks && me.myAsks[pr] != null ? `<span>Your ask: <b>${k(me.myAsks[pr])}</b> <small class="muted">(stays up for your next unit if it is at or above that unit's lowest price)</small></span><button class="btn small ghost" data-a="cancel" data-p="${pr}">Cancel</button>` : ''}</div>`}</div>`;
  }).join('')}${tapeHtml()}</div></div>`;
}
function earnBox() { const me = S.me; return `<div class="panel" id="earnBox"><div><div>This round: <b>${k(me.earnRound)}</b></div><div class="muted">Total: <b>${k(me.earnTotal)}</b></div></div>${FX.jar(me.prize, { key: 'prize', size: 'small', label: `🍬 ${me.prize || 0}` })}</div>`; }
function tapeHtml() {
  if (S.pub.pricesHidden) return `<div class="panel" id="tapeBox"><h3 style="margin:0 0 6px">Live prices</h3><small class="muted">Hidden this round: compare the shops yourself.</small></div>`;
  const items = (S.pub.prices || []).map(x => ({ id: x.id, price: x.price, key: x.p, art: ART3[x.p], label: shopLab(x.shop) }));
  return `<div class="panel" id="tapeBox"><h3 style="margin:0 0 6px">Live prices <small class="muted">▲ higher, ▼ lower than the trade before</small></h3>${FX.ticker(items, k, 'tape')}</div>`;
}

function onClick(e) {
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  const a = b.dataset.a, me = S.me, p = S.pub;
  const lockFor = pr => p.lock && p.lock.product === pr ? p.lock.price : null;
  if (a === 'minus' || a === 'plus') {
    const d = a === 'plus' ? 1 : -1, key = b.dataset.key, rg = b.closest('.fx-tag') && b.closest('.fx-tag').querySelector('.fx-range');
    const lo = rg ? +rg.min : 1, hi = rg ? +rg.max : 200, cur = key === 'o' || key === 'c' ? S.compose.price : (S.price[key] || 0), nv = Math.max(lo, Math.min(hi, cur + d));
    if (nv === cur) { sfx('bonk'); FX.shake(b.closest('.fx-tag')); return; }
    if (key === 'o' || key === 'c') S.compose.price = nv; else S.price[key] = nv;
    sfx('blip'); return render();
  }
  if (a === 'pred') { sSend({ type: 'pred', id: p.pred.id, product: b.dataset.p, dir: b.dataset.d }); $$(`[data-a=pred][data-p="${b.dataset.p}"]`).forEach(x => x.classList.toggle('sel', x === b)); sfx('pop'); return; }
  if (a === 'shopname') { const v = ($('#shopName').value || '').trim(); if (!v) return toast('Type a name first.'); sSend({ type: 'shopname', name: v }); $('#shopName').blur(); sfx('pop'); return toast('Shop name saved.'); }
  if (a === 'compose') { const pr = b.dataset.p, v = me.values[pr], ask = p.shops[b.dataset.shop].asks[pr]; S.compose = { shop: b.dataset.shop, product: pr, price: lockFor(pr) ?? Math.min(v, ask != null ? ask - 2 : v - 4) }; return render(); }
  if (a === 'close') { S.compose = null; return render(); }
  if (a === 'send') { const c = S.compose; if (c.price > me.values[c.product]) return toast(errMsg('above-value')); sSend({ type: 'offer', shop: c.shop, product: c.product, price: c.price }); S.compose = null; sfx('blip'); return render(); }
  if (a === 'buy') { sSend({ type: 'buy', shop: b.dataset.shop, product: b.dataset.p }); return; }
  if (a === 'accept') return sSend({ type: 'respond', id: b.dataset.id, action: 'accept' });
  if (a === 'decline') return sSend({ type: 'respond', id: b.dataset.id, action: 'decline' });
  if (a === 'counter') { const o = me.offers.find(x => x.id === b.dataset.id), next = me.costs[o.product][me.sold[o.product]]; S.compose = { id: o.id, price: lockFor(o.product) ?? Math.max(next, o.price + 2) }; return render(); }
  if (a === 'sendcounter') { sSend({ type: 'respond', id: S.compose.id, action: 'counter', price: S.compose.price }); S.compose = null; return render(); }
  if (a === 'setask') { const pr = b.dataset.p; if (p.round && p.round.mode === 'menu' && !confirm(`Set your ${PROD[pr].name.toLowerCase()} price to ${k(S.price['a' + pr])} for the whole round? You cannot change it.`)) return; return sSend({ type: 'setask', product: pr, price: lockFor(pr) ?? S.price['a' + pr] }); }
  if (a === 'fastbuy') return sSend({ type: 'bid', product: b.dataset.p, price: p.book[b.dataset.p].ask });
  if (a === 'fastsell') return sSend({ type: 'ask', product: b.dataset.p, price: p.book[b.dataset.p].bid });
  if (a === 'bid') { const pr = b.dataset.p; return sSend({ type: 'bid', product: pr, price: lockFor(pr) ?? S.price['b' + pr] }); }
  if (a === 'ask') { const pr = b.dataset.p; return sSend({ type: 'ask', product: pr, price: lockFor(pr) ?? S.price['f' + pr] }); }
  if (a === 'cancel') return sSend({ type: 'cancel', product: b.dataset.p });
}

(function boot() {
  const mode = PARAMS.get('mode') || (PARAMS.get('room') ? 'student' : 'home');
  if (mode === 'teacher') teacherBoot(); else if (mode === 'student') studentBoot(); else location.replace('index.html' + (PARAMS.get('t') ? '?t=' + PARAMS.get('t') : ''));
})();

</script>
<script>
/* ---- Vietnamese on/off (teacher). Off hides Vietnamese on the console and the board; students keep it only as small support text. ---- */
function viOnT() { return typeof T !== 'undefined' && T.s ? (T.s.vi ?? FX.get('vi', true)) !== false : FX.get('vi', true) !== false; }
document.addEventListener('click', e => {
  if (!e.target.closest || !e.target.closest('#viT') || typeof T === 'undefined' || !T.s) return;
  T.s.vi = !viOnT(); FX.set('vi', T.s.vi); FX.setVi(T.s.vi, 'teacher');
  const b = document.getElementById('viT'); if (b) b.textContent = T.s.vi ? '🇻🇳 Tiếng Việt: on' : '🇻🇳 Vietnamese: off';
  tSave(); renderBody(); if (T.projector) renderProj(true); tBroadcast(true);
  toast(T.s.vi ? 'Vietnamese is on.' : 'Vietnamese is off on the console and the board. Students still see small Vietnamese help.');
});
</script>
